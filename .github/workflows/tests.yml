name: Tests

on:
  push:
    branches: [ main, master, 'release/**' ]
  # Every PR needs evidence, including stacked PRs whose base is another
  # feature branch. A missing workflow is too easy to mistake for a green one.
  pull_request:
  workflow_call:

# A newer head makes the older PR result obsolete. Preserve every main,
# release-branch and called workflow run, including immutable-tag verification.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Do not restore the shared pip cache: its account egress limit stalled Python
# setup before tests ran. Install dependencies directly; all checks stay enabled.
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify and audit the exact dependency lock
        run: |
          python -m pip install uv==0.6.16 pip-audit==2.10.1
          uv lock --check
          uv export --quiet --frozen --all-extras --no-dev --no-emit-project \
            --output-file "$RUNNER_TEMP/connectonion-audit-requirements.txt"
          python -m pip_audit \
            --requirement "$RUNNER_TEMP/connectonion-audit-requirements.txt" \
            --disable-pip --strict --progress-spinner off

  # The offline suite is ~9 minutes of tests on a two-worker runner (over 15
  # traced for coverage), so each Python runs it as six parallel shards.
  # scripts/ci_test_shard.py splits by file, balanced by tests/ci_durations.json:
  # a 50-line script instead of pytest-split, because that plugin makes every
  # shard collect the whole suite. Inside a shard, --dist worksteal hands out
  # single tests as `make test` always has: --dist loadfile pinned the largest
  # files (test_cli_tips_name_real_commands.py, 150 s traced) to one worker,
  # which set the floor for their shard. Six because a shard's fixed cost (checkout, install) is about
  # a minute, and the free plan runs 20 jobs at once: 18 shards already fill it.
  test:
    name: test (${{ matrix.python-version }}) ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # A shard still running at fifteen is hung; the per-test timeout in
    # pytest.ini has already named the culprit, and this is the backstop for a
    # hang outside any test (collection, a fixture that never yields, atexit).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run this shard's test files
        env:
          # This job runs only offline tests, and tests/conftest.py refuses any
          # connection that leaves the machine — so no production credential
          # belongs in this process. A fixed non-secret value keeps the auth
          # CLI on its authenticated code path (empty reads as "not logged in").
          OPENONION_API_KEY: test-key
          # Coverage is traced on one interpreter: the report is the same on
          # all of them and tracing slows the run. Each 3.12 shard writes its
          # own data file; the coverage job combines them and gates the total.
          COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
          # sys.monitoring (coverage 7.4+, Python 3.12+) instead of a trace
          # function: line coverage, measured the same, at a fraction of the cost.
          COVERAGE_CORE: sysmon
          COVERAGE_ARGS: ${{ matrix.python-version == '3.12' && '--cov=connectonion --cov-report=' || '' }}
        run: |
          pytest $(python scripts/ci_test_shard.py ${{ matrix.shard }} 6) \
            -n auto --dist worksteal --tb=short \
            -m "not slow and not real_api and not network" \
            -o junit_family=xunit1 --junitxml=junit.xml \
            $COVERAGE_ARGS

      - name: Upload this shard's coverage data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

      # Per-test times, for refreshing tests/ci_durations.json:
      # python scripts/ci_test_shard.py --record junit-3.11-*/junit.xml
      - name: Upload this shard's test times
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-${{ matrix.python-version }}-${{ matrix.shard }}
          path: junit.xml
          retention-days: 14
          if-no-files-found: ignore

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download every shard's coverage data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      # The gate is a floor at today's number so a change cannot lower it
      # unnoticed. Raise it as the number goes up; never lower it to make a
      # PR pass.
      - name: Combine and gate coverage
        run: |
          python -m pip install "coverage>=7"
          ls .coverage.shard-*
          coverage combine .coverage.shard-*
          coverage xml
          coverage report --skip-covered --show-missing --fail-under=78

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # One stable check name for every shard and the coverage gate. A shard that
  # failed, was cancelled or was skipped makes this red, never green.
  tests-passed:
    needs: [test, coverage, cli-help-audit, cli-help-audit-tree]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard and the coverage gate to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          AUDIT_RESULT: ${{ needs.cli-help-audit.result }}
          TREE_RESULT: ${{ needs.cli-help-audit-tree.result }}
        run: |
          echo "test shards: $TEST_RESULT, coverage: $COVERAGE_RESULT, help audit shards: $AUDIT_RESULT, help audit tree: $TREE_RESULT"
          [ "$TEST_RESULT" = success ] && [ "$COVERAGE_RESULT" = success ] \
            && [ "$AUDIT_RESULT" = success ] && [ "$TREE_RESULT" = success ]

  # Each `co ... --help` is a process start, and the audit runs over 800 of
  # them. Each shard walks and audits the top-level commands that fall to it
  # (see tests/unit/test_cli_help_contract.py); cli-help-audit-tree then
  # checks the whole tree once over every shard's list of pages.
  cli-help-audit:
    name: cli-help-audit ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Audit this shard's co help pages
        env:
          OPENONION_API_KEY: test-key
          CO_AUDIT_SHARD: ${{ matrix.shard }}/6
          CO_AUDIT_PAGES_DIR: audit-pages
        run: |
          mkdir audit-pages
          pytest -q tests/unit/test_cli_help_contract.py::test_co_meets_the_contract_and_its_house_style \
            -m slow --tb=short

      - name: Upload the pages this shard audited
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-pages-${{ matrix.shard }}
          path: audit-pages
          if-no-files-found: error

  cli-help-audit-tree:
    needs: cli-help-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download every shard's list of pages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: audit-pages-*
          path: audit-pages
          merge-multiple: true

      - name: Every page audited once, every listed command reachable
        env:
          OPENONION_API_KEY: test-key
          CO_AUDIT_PAGES_DIR: audit-pages
        run: |
          pytest -q tests/unit/test_cli_help_contract.py::test_the_shards_together_audit_every_page_once \
            -m slow --tb=short

  # The Remote Browser gateway is a security boundary built directly on each
  # platform's asyncio/TCP implementation. Keep its small focused suite on every
  # supported Python and OS instead of treating one green Linux socket as proof
  # for Proactor Windows or Darwin close/shutdown behavior.
  remote-browser-egress:
    runs-on: ${{ matrix.os }}
    # Backstop for hangs outside a test (installation, shutdown); the per-test watchdog catches the rest.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run destination, gateway, and private runtime contracts
        # A thread watchdog can terminate blocked native IPC on every OS.
        run: |
          python -m pytest tests/unit/test_remote_browser_destination_policy.py tests/unit/test_remote_browser_egress_gateway.py tests/unit/test_remote_browser_private_runtime.py tests/unit/test_remote_browser_service.py tests/e2e/cli/test_remote_browser_daemon.py -v --tb=short --timeout=30 --timeout-method=thread

  # Validate the native Windows browser IPC (named-pipe daemon transport) — the
  # `co browser` daemon uses Unix sockets on POSIX and Windows named pipes here.
  # These tests use a StubBrowser, so no Chrome/network is needed; they exercise the
  # real cross-platform transport (multiprocessing.connection + HMAC authkey).
  windows-browser:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run browser transport + daemon tests (native Windows named pipes)
        run: |
          pytest tests/unit/test_transport.py tests/e2e/cli/test_browser_daemon.py tests/unit/test_rem_file_lock.py -v --tb=short

  # Simulate a REAL Windows user end-to-end: install from the wheel (exactly what
  # PyPI ships — not an editable checkout), discover the CLI from the shell,
  # validate the patchright CLI, exercise paths with spaces + non-ASCII characters,
  # then drive a REAL Chrome through `co browser` (daemon spawn → named pipe →
  # launch → navigate → close). This is the "it installs but co/patchright won't
  # run on my machine" class of failure, caught before release.
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build the wheel (what PyPI ships)
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install from the wheel like a real user (not editable)
        run: |
          $whl = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          pip install $whl
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: CLI is discoverable from a plain shell
        run: |
          co --version
          if ($LASTEXITCODE -ne 0) { Write-Error "co not on PATH after pip install"; exit 1 }
          python -m connectonion.cli.main --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          co doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: CLI works from cmd.exe too (not just PowerShell)
        shell: cmd
        run: |
          co --version || exit /b 1
          python -m connectonion.cli.main --version || exit /b 1

      - name: REM reader opens its private snapshot on Windows
        run: python scripts/check_rem_reader_snapshot.py

      - name: First run OFFLINE is graceful — no traceback, scaffold still created
        env:
          # A dead proxy makes every backend call fail fast, deterministically —
          # this is the fresh Windows laptop on hotel wifi. Isolated USERPROFILE =
          # a true first run (keypair generation included).
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          USERPROFILE: ${{ runner.temp }}\co-first-run-home
        run: |
          New-Item -ItemType Directory -Path $env:USERPROFILE -Force | Out-Null
          $dir = Join-Path $env:RUNNER_TEMP "co-first-run-project"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Set-Location $dir
          $globalInitOutput = co init --yes 2>&1 | Out-String
          Write-Host $globalInitOutput
          if ($LASTEXITCODE -ne 0 -or $globalInitOutput -match "Traceback") { Write-Error "global init failed offline"; exit 1 }
          if ((Test-Path ".co") -or (Test-Path ".env")) { Write-Error "global init wrote project files"; exit 1 }
          if (!(Test-Path (Join-Path $env:USERPROFILE ".co\keys.env"))) { Write-Error "global keys.env missing"; exit 1 }
          $out = co init ./ --yes 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Error "offline first run exited $LASTEXITCODE"; exit 1 }
          if ($out -match "Traceback") { Write-Error "offline first run printed a traceback"; exit 1 }
          if (!(Test-Path ".co")) { Write-Error "offline first run did not scaffold .co/"; exit 1 }
          if (!(Test-Path (Join-Path $env:USERPROFILE ".co\keys\agent.key"))) {
            Write-Error "keypair was not created on first run"; exit 1
          }

      - name: patchright CLI is included and runnable
        run: |
          python -m patchright --version
          if ($LASTEXITCODE -ne 0) { Write-Error "patchright module not runnable"; exit 1 }

      - name: Package data survives the wheel — skills copy in a path with spaces + CJK
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "co test 测试 dir"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Set-Location $dir
          co copy install-connectonion
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (!(Test-Path ".co/skills/install-connectonion/SKILL.md")) {
            Write-Error "SKILL.md missing after co copy - package data broken on Windows"
            exit 1
          }
          co copy --list
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Real co browser end-to-end — daemon spawn, named pipe, Chrome, navigation
        run: |
          # A local file:// page keeps this hermetic (no external network flake).
          Set-Content -Path test.html -Value "<html><body><h1>co-windows-e2e</h1></body></html>"
          $url = "file:///" + ($PWD.Path -replace '\\','/') + "/test.html"

          co browser --headless go_to $url
          if ($LASTEXITCODE -ne 0) { Write-Error "go_to failed - Chrome did not launch/navigate"; exit 1 }

          $status = co browser status | Out-String
          Write-Host $status
          if ($status -notmatch "Browser: open") { Write-Error "daemon does not report an open browser"; exit 1 }

          $cur = co browser get_current_url | Out-String
          Write-Host $cur
          if ($cur -notmatch "test.html") { Write-Error "navigation did not land on the test page"; exit 1 }

      - name: Parallel agents — three tabs opened concurrently (multi-agent contention)
        run: |
          # Reuse the real daemon from the preceding step. Cold start is already
          # covered there; restarting it here spent ~7 seconds without testing a
          # different path. This step is about simultaneous named-pipe clients.
          $jobs = 1..3 | ForEach-Object {
            Start-Job -ScriptBlock {
              param($i)
              $o = co browser newtab --who=agent$i --purpose=parallel-$i 2>&1 | Out-String
              [pscustomobject]@{ Code = $LASTEXITCODE; Out = $o }
            } -ArgumentList $_
          }
          $results = $jobs | Wait-Job -Timeout 180 | Receive-Job
          $jobs | Remove-Job -Force
          foreach ($r in $results) { Write-Host $r.Out }
          if (@($results).Count -ne 3) { Write-Error "not all parallel newtab jobs finished"; exit 1 }
          foreach ($r in $results) {
            if ($r.Code -ne 0) { Write-Error "a parallel newtab failed under contention"; exit 1 }
          }

          $status = co browser status | Out-String
          Write-Host $status
          foreach ($who in "agent1", "agent2", "agent3") {
            if ($status -notmatch $who) { Write-Error "status is missing $who's tab"; exit 1 }
          }

      - name: Restart after close — a second daemon lifecycle stays healthy
        run: |
          co browser close
          if ($LASTEXITCODE -ne 0) { Write-Error "first daemon did not close cleanly"; exit 1 }
          co browser --headless go_to about:blank
          if ($LASTEXITCODE -ne 0) { Write-Error "second daemon cold-start failed"; exit 1 }
          co browser close
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # THE fresh-Windows-laptop test: no system Chrome anywhere, empty browsers dir.
      # The first page-driving command must auto-install a browser (real download,
      # no admin rights involved — chromium goes to the per-user browsers path) and
      # then actually drive it. This is the exact first-experience a new Windows
      # user gets on a machine without Chrome.
      - name: Fresh laptop — auto-install fires for real (no system Chrome, empty browsers dir)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\fresh-browsers
        run: |
          Stop-Process -Name chrome -Force -ErrorAction SilentlyContinue
          Rename-Item "C:\Program Files\Google" "C:\Program Files\GoogleHidden"
          if (!(Test-Path "C:\Program Files\GoogleHidden")) { Write-Error "could not hide system Chrome"; exit 1 }
          New-Item -ItemType Directory -Path $env:PLAYWRIGHT_BROWSERS_PATH -Force | Out-Null

          Set-Content -Path fresh.html -Value "<html><body><h1>fresh-laptop</h1></body></html>"
          $url = "file:///" + ($PWD.Path -replace '\\','/') + "/fresh.html"
          $out = co browser --headless go_to $url 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Error "auto-install path failed to launch/navigate"; exit 1 }
          if ($out -notmatch "one-time download") { Write-Error "auto-install did not announce itself"; exit 1 }
          if ($out -notmatch "Navigated to") { Write-Error "navigation missing after auto-install"; exit 1 }

          $cur = co browser get_current_url | Out-String
          if ($cur -notmatch "fresh.html") { Write-Error "wrong page after auto-install launch"; exit 1 }
          co browser close
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Restore system Chrome (cleanup for the fresh-laptop test)
        if: always()
        run: |
          if (Test-Path "C:\Program Files\GoogleHidden") {
            Rename-Item "C:\Program Files\GoogleHidden" "C:\Program Files\Google"
          }

      - name: CLI works from Windows PowerShell 5.1 (many users' default shell)
        shell: powershell
        run: |
          co --version
          if ($LASTEXITCODE -ne 0) { Write-Error "co failed under PowerShell 5.1"; exit 1 }
          co doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The classic Chinese-Windows-user minefield: the ENTIRE home lives under a
      # path with CJK characters and a space. keys.env, the keypair, browser
      # sidecars/authkey (LOCALAPPDATA), the Chrome profile dir — all of it.
      - name: Everything works with a CJK + space home directory
        env:
          USERPROFILE: ${{ runner.temp }}\co 用户 目录
          LOCALAPPDATA: ${{ runner.temp }}\co 用户 目录\AppData\Local
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $proj = Join-Path $env:USERPROFILE "我的 项目"
          New-Item -ItemType Directory -Path $proj -Force | Out-Null
          Set-Location $proj

          $out = co init ./ --yes 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -match "Traceback") { Write-Host $out; Write-Error "init failed in CJK home"; exit 1 }
          if (!(Test-Path (Join-Path $env:USERPROFILE ".co\keys\agent.key"))) { Write-Error "keypair missing under CJK home"; exit 1 }

          # Idempotency: a second init must not corrupt the project.
          $out2 = co init ./ --yes --force 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $out2 -match "Traceback") { Write-Host $out2; Write-Error "second init corrupted the project"; exit 1 }
          if (!(Test-Path ".env")) { Write-Error ".env lost on re-init"; exit 1 }

          co copy install-connectonion
          if ($LASTEXITCODE -ne 0) { Write-Error "co copy failed in CJK home"; exit 1 }

          # Real browser with profile + sidecars + authkey all under the CJK home.
          Set-Content -Path page.html -Value "<html><body>cjk-home</body></html>"
          $url = "file:///" + ($PWD.Path -replace '\\','/') + "/page.html"
          co browser --headless go_to $url
          if ($LASTEXITCODE -ne 0) { Write-Error "browser failed with CJK home"; exit 1 }
          co browser close
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The GBK/cp936 minefield (issue #230): a Chinese Windows console runs in the
      # legacy GBK codepage. Before the fix, the co_ai/shell subprocess layer used
      # text=True with NO explicit encoding, so a child that emitted UTF-8/emoji
      # crashed the reader thread (UnicodeDecodeError) or the child itself
      # (UnicodeEncodeError). Force the console into GBK and turn OFF Python's UTF-8
      # mode so the legacy codepage is actually in effect, then drive the *shipped*
      # Shell + background runner through a child that prints CJK + an emoji and
      # assert it round-trips cleanly.
      - name: Subprocess tools survive the Chinese (GBK/cp936) console codepage
        shell: pwsh
        env:
          PYTHONUTF8: "0"
        run: |
          chcp 936
          @'
          import sys, time
          from connectonion.useful_tools.shell import Shell
          from connectonion.cli.co_ai.tools import background as bg

          cps = [20013, 25991, 27979, 35797, 128640]   # CJK chars + a rocket emoji
          want = "".join(chr(c) for c in cps)
          # Build the child from codepoints so the command line stays pure ASCII;
          # the child generates the Unicode itself and prints it (UTF-8 thanks to the
          # env the Shell/background runner inject).
          inner = "print(''.join(chr(c) for c in %s))" % cps
          child = '"%s" -c "%s"' % (sys.executable, inner)

          out = Shell().run(child)
          assert want in out, "Shell lost unicode under GBK console: %r" % out

          bg.run_background(child)
          for _ in range(100):
              t = bg._tasks.get("bg_1")
              if t and t.status != bg.TaskStatus.RUNNING:
                  break
              time.sleep(0.1)
          o2 = bg.task_output("bg_1")
          assert want in o2, "background lost unicode under GBK console: %r" % o2
          print("OK: GBK/cp936 console subprocess round-trip clean")
          '@ | Set-Content -Path gbk_check.py -Encoding ascii
          python gbk_check.py
          if ($LASTEXITCODE -ne 0) { Write-Error "GBK/cp936 subprocess round-trip failed"; exit 1 }

      # Task-Manager-kill recovery: a stale pid file whose pid now belongs to a
      # LIVE unrelated process must never block a fresh daemon (the pre-fix
      # behavior was a permanent 'daemon is busy' denial of service).
      - name: Stale pid file with a recycled live pid cannot brick the daemon
        run: |
          $pidfile = python -c "from connectonion.cli.browser_agent import transport, daemon as d; print(transport.pid_path(d.default_sock_path()))"
          Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
            Where-Object { $_.CommandLine -match "browser_agent.daemon" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 1
          $decoy = Start-Process notepad -PassThru -WindowStyle Hidden
          New-Item -ItemType Directory -Path (Split-Path $pidfile) -Force | Out-Null
          Set-Content -Path $pidfile -Value $decoy.Id -NoNewline

          co browser status
          $code = $LASTEXITCODE
          Stop-Process -Id $decoy.Id -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { Write-Error "stale pid file blocked the daemon (exit $code)"; exit 1 }
          co browser close

      # Corrupt authkey heals itself: a truncated key file (crashed writer) must
      # not brick the CLI — the next command replaces it atomically and works.
      - name: Corrupt authkey self-heals
        run: |
          Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
            Where-Object { $_.CommandLine -match "browser_agent.daemon" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 1
          $auth = Join-Path $env:LOCALAPPDATA "co\authkey"
          New-Item -ItemType Directory -Path (Split-Path $auth) -Force | Out-Null
          Set-Content -Path $auth -Value "xx" -NoNewline

          co browser status
          if ($LASTEXITCODE -ne 0) { Write-Error "corrupt authkey bricked the CLI"; exit 1 }
          $len = (Get-Item $auth).Length
          if ($len -lt 16) { Write-Error "authkey was not healed (length $len)"; exit 1 }
          co browser close

      - name: Show the browser daemon log on failure
        if: failure()
        run: |
          $log = Join-Path $env:USERPROFILE ".co\browser.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "no browser.log" }

  # The macOS release path is distinct from Windows: it uses the POSIX Unix
  # socket transport and is a common place for packaging or first-launch
  # regressions to hide. Install the wheel exactly as a user would, install the
  # bundled browser into an isolated runner directory, then drive a real page
  # through the public `co browser` CLI.
  macos-e2e:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build and install the wheel (what PyPI ships)
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install dist/*.whl

      - name: CLI and bundled browser are runnable
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/co-browsers
        run: |
          co --version
          python -m patchright --version
          python -m patchright install chromium

      - name: Real co browser end-to-end over the macOS Unix socket
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/co-browsers
          CO_BROWSER_SOCK: ${{ runner.temp }}/co-browser.sock
        run: |
          page="$RUNNER_TEMP/co-browser-page.html"
          printf '%s\n' '<html><body><h1>co-macos-e2e</h1></body></html>' > "$page"
          url="file://$page"

          co browser --headless go_to "$url"
          status="$(co browser status)"
          printf '%s\n' "$status"
          [[ "$status" == *"Browser: open"* ]]

          current_url="$(co browser get_current_url)"
          printf '%s\n' "$current_url"
          [[ "$current_url" == *"co-browser-page.html"* ]]

          co browser close

      - name: Stop the browser daemon on failure
        if: failure()
        env:
          CO_BROWSER_SOCK: ${{ runner.temp }}/co-browser.sock
        run: co browser close || true
