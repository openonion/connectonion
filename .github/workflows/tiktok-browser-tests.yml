name: TikTok browser scripts
on:
  pull_request:
    paths:
      - 'connectonion/useful_skills/co-tiktok/**'
      - 'tests/tiktok_browser/**'
      - '.github/workflows/tiktok-browser-tests.yml'
  push:
    branches: [main]
    paths:
      - 'connectonion/useful_skills/co-tiktok/**'
      - 'tests/tiktok_browser/**'
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: tests/tiktok_browser
      - run: npm test
        working-directory: tests/tiktok_browser
