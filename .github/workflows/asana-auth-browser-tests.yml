name: Asana auth page scripts
on:
  pull_request:
    paths:
      - 'connectonion/cli/commands/asana_auth.py'
      - 'tests/asana_auth_browser/**'
      - '.github/workflows/asana-auth-browser-tests.yml'
  push:
    branches: [main]
    paths:
      - 'connectonion/cli/commands/asana_auth.py'
      - 'tests/asana_auth_browser/**'
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: tests/asana_auth_browser
      - run: npm test
        working-directory: tests/asana_auth_browser
