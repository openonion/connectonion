<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$name · Control Center</title>
<style>
  /* Shared Control Center tokens. The page is self-contained: no remote assets,
     scripts, inline handlers, or navigation. The chat bridge owns declarative
     data-ochat-* controls; plain HTML remains usable when that bridge is absent.
     No web font either: the page has to render offline, so the headline uses
     the system serif (New York on Apple, Georgia elsewhere). */
  /* O Chat v12: one light ground, green and white only. Green is spent on four
     things — the one primary action, the live dot, the current item and focus
     rings — so --cc-danger is deliberately not a red: a failure is said in words
     and weight, not in a second accent colour. --cc-subtle is the quietest text
     that still reads (AA on every ground); --cc-faint is for chevrons and
     the marks that carry no words. */
  :root {
    color-scheme: light dark;
    --cc-bg: #f8faf9;
    --cc-surface: #ffffff;
    --cc-surface-raised: #f1f5f2;
    --cc-text: #122019;
    --cc-muted: #4f5f56;
    --cc-subtle: #5f6f66;
    --cc-faint: #9aa8a0;
    --cc-border: #e3e9e5;
    --cc-border-strong: #cfd9d3;
    --cc-accent: #146c43;
    --cc-on-accent: #ffffff;
    --cc-live: #1f9d5c;
    --cc-accent-soft: #e9f4ee;
    --cc-accent-text: #146c43;
    --cc-danger: #122019;
    --cc-focus: #146c43;
    --cc-radius-sm: 6px;
    --cc-radius-md: 8px;
    --cc-shadow: 0 1px 2px rgba(20, 20, 19, .04);
    --cc-serif: "New York", ui-serif, Georgia, serif;
    --cc-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --cc-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cc-bg: #0b100d;
      --cc-surface: #111813;
      --cc-surface-raised: #17201a;
      --cc-text: #e9f0eb;
      --cc-muted: #a4b3aa;
      --cc-subtle: #8a9990;
      --cc-faint: #67766d;
      --cc-border: #1f2a23;
      --cc-border-strong: #2c3a31;
      --cc-accent: #3fbf7f;
      --cc-on-accent: #06150d;
      --cc-live: #3fbf7f;
      --cc-accent-soft: #16281e;
      --cc-accent-text: #7fd6a8;
      --cc-danger: #e9f0eb;
      --cc-focus: #3fbf7f;
      --cc-shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    --cc-bg: #0b100d;
    --cc-surface: #111813;
    --cc-surface-raised: #17201a;
    --cc-text: #e9f0eb;
    --cc-muted: #a4b3aa;
    --cc-subtle: #8a9990;
    --cc-faint: #67766d;
    --cc-border: #1f2a23;
    --cc-border-strong: #2c3a31;
    --cc-accent: #3fbf7f;
    --cc-on-accent: #06150d;
    --cc-live: #3fbf7f;
    --cc-accent-soft: #16281e;
    --cc-accent-text: #7fd6a8;
    --cc-danger: #e9f0eb;
    --cc-focus: #3fbf7f;
    --cc-shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
  * { box-sizing: border-box; }
  html { background: var(--cc-bg); }
  body {
    margin: 0;
    background: var(--cc-bg);
    color: var(--cc-text);
    font: 14px/1.5 var(--cc-sans);
    -webkit-font-smoothing: antialiased;
  }
  html, body { max-width: 100%; overflow-x: clip; }
  main, .skill-rows, .skill { width: 100%; min-width: 0; max-width: 100%; }
  button, input, summary { font: inherit; }
  :focus-visible { outline: 2px solid var(--cc-focus); outline-offset: 2px; border-radius: 4px; }

  /* The bar: who you are talking to, and that it is live. It says nothing else. */
  .bar {
    display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 16px;
    border-bottom: 1px solid var(--cc-border); background: var(--cc-surface);
  }
  .bar .nm { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
  .bar .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--cc-live); }
  .bar .r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .quiet-link {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px;
    border-radius: var(--cc-radius-sm); color: var(--cc-muted); font-size: 12.5px; text-decoration: none;
  }
  .quiet-link:hover { background: var(--cc-surface-raised); color: var(--cc-text); }

  main { width: min(100%, 720px); margin: 0 auto; padding: 56px 24px 56px; }
  h1 {
    margin: 0; font-family: var(--cc-serif); font-weight: 600; font-size: 34px;
    line-height: 1.1; letter-spacing: -.02em; overflow-wrap: anywhere;
  }
  .bio { margin: 8px 0 0; max-width: 52ch; color: var(--cc-muted); font-size: 15px; }
  .bio:empty { display: none; }

  /* The owner's two strings — the address people connect to and the invite code
     that lets them in. Quiet rows, not a panel: they are looked up, not read.
     One click selects the whole value, which is the copy this page can offer
     without a script. */
  .ids { display: grid; gap: 2px; margin: 14px 0 0; }
  .ids > div { display: flex; align-items: baseline; gap: 10px; min-width: 0; font-size: 12.5px; }
  .ids dt { flex: none; width: 52px; color: var(--cc-subtle); }
  .ids dd { margin: 0; min-width: 0; color: var(--cc-muted); }
  .addr, .code { font-family: var(--cc-mono); font-size: 12px; overflow-wrap: anywhere; user-select: all; cursor: text; }

  /* Skills: one hairline row each — the name, then what it does. No boxes; the
     whole row is the button, and "Use" appears only under the pointer. */
  .fold { margin-top: 32px; }
  /* Consecutive folded sections read as one list of labels. */
  .fold + .fold, .sec + .fold { margin-top: 12px; }
  .fold > summary {
    display: flex; align-items: center; gap: 8px; min-height: 44px; list-style: none; cursor: pointer;
    color: var(--cc-muted); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
  }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::before {
    content: ""; flex: none; width: 6px; height: 6px; margin: 0 3px 0 1px;
    border-right: 1.5px solid var(--cc-faint); border-bottom: 1.5px solid var(--cc-faint);
    transform: rotate(-45deg);
  }
  .fold[open] > summary::before { transform: translateY(-2px) rotate(45deg); }
  .fold > summary .n { color: var(--cc-subtle); letter-spacing: 0; }
  co-filter { display: block; min-height: 44px; margin: 4px 0 8px; }
  .skill-rows { display: grid; }
  .rows { display: grid; }
  .skill {
    display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; row-gap: 2px;
    min-height: 44px; padding: 10px 0; border: 0; border-top: 1px solid var(--cc-border);
    background: transparent; color: var(--cc-text); cursor: pointer; text-align: left;
  }
  .skill .name { flex: none; max-width: 100%; font-weight: 500; overflow-wrap: anywhere; }
  .skill .desc {
    flex: 1 1 18ch; min-width: 0; max-width: 100%; margin-top: 0; color: var(--cc-muted);
  }
  .skill .desc:empty { display: none; }
  .skill .use { flex: none; margin-left: auto; color: var(--cc-subtle); font-size: 13px; opacity: 0; }
  .skill:hover .use, .skill:focus-visible .use { opacity: 1; }
  .skill:hover .name { color: var(--cc-accent-text); }
  .more > summary {
    display: flex; align-items: center; min-height: 44px; border-top: 1px solid var(--cc-border);
    color: var(--cc-muted); cursor: pointer; list-style: none; font-size: 13px;
  }
  .more > summary::-webkit-details-marker { display: none; }
  .lbl-less { display: none; }
  .more[open] .lbl-more { display: none; }
  .more[open] .lbl-less { display: inline; }
  .empty { margin: 0; padding: 10px 0; border-top: 1px solid var(--cc-border); color: var(--cc-muted); }
  code { font-family: var(--cc-mono); font-size: .92em; }

  /* Activity and host facts: the same quiet label and hairline rows. */
  .sec { margin-top: 32px; }
  .sec > h2 {
    margin: 0; padding: 6px 0; color: var(--cc-muted); font-size: 11px; font-weight: 500;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .act { display: flex; align-items: baseline; gap: 8px; min-height: 40px; padding: 9px 0; border-top: 1px solid var(--cc-border); font-size: 13px; }
  .act .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act .meta { flex: none; color: var(--cc-subtle); font-size: 12px; font-variant-numeric: tabular-nums; }
  .act .bad { color: var(--cc-danger); font-weight: 600; }
  .act .live { color: var(--cc-accent-text); }
  .diagnostics { margin: 0; }
  .diag { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--cc-border); font-size: 13px; }
  .diag dt { color: var(--cc-subtle); }
  .diag dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

  @media (min-width: 640px) {
    .skill .name { white-space: nowrap; }
  }
  @media (max-width: 520px) {
    main { padding: 36px 16px 40px; }
    h1 { font-size: 30px; }
    .act { align-items: flex-start; flex-direction: column; gap: 1px; }
    .act .what { white-space: normal; }
    .skill .use { display: none; }
    /* A description beside the name leaves a ragged hanging column at phone
       width; under it, every row reads the same way. */
    .skill .desc { flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .skill .use, .skill .name, .quiet-link { transition: opacity .12s ease, color .12s ease, background-color .12s ease; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <header class="bar">
    <span class="nm"><i class="live-dot" aria-hidden="true"></i><span>$name</span></span>
    <div class="r">$bar_actions</div>
  </header>
  <main>
    <section class="intro" aria-labelledby="agent-name">
      <h1 id="agent-name">$name</h1>
      <p class="bio">$tagline</p>
$identity
    </section>

    <details class="fold skills" id="skills" open>
      <summary><span>Skills</span><span class="n">$skill_count</span></summary>
$filter
      <div class="skill-rows" id="capability-list">
$body
      </div>
    </details>
$activity
$diagnostics
  </main>
</body>
</html>

<!--FRAGMENTS
Everything below this marker is render scaffolding and never reaches the page.
Placeholders use string.Template syntax; do not use dollar signs elsewhere.
-->

<template id="skill"><button class="skill" type="button" data-ochat-skill="$name"><span class="name">$name</span><span class="desc">$description</span><span class="use" aria-hidden="true">Use →</span></button></template>

<template id="list"><div class="rows">
$rows
  </div></template>

<template id="more"><details class="more">
    <summary><span class="lbl-more">$count more skill$plural</span><span class="lbl-less">Show fewer</span></summary>
    <div class="rows">
$rows
    </div>
  </details></template>

<template id="empty"><p class="empty">None yet — add one to <code>.co/skills/</code>.</p></template>

<template id="filter"><co-filter target="#capability-list" placeholder="Search skills"></co-filter></template>

<template id="ids"><dl class="ids">
$rows
      </dl></template>

<template id="id"><div><dt>$label</dt><dd class="$class" title="Click to select">$value</dd></div></template>

<template id="details-link"><a class="quiet-link" href="#details">Details</a></template>

<template id="quick"><section class="sec" aria-labelledby="quick-title">
    <h2 id="quick-title">Quick actions</h2>
    <div class="rows">
$rows
    </div>
  </section></template>

<template id="activity"><section class="sec">
    <h2>$title</h2>
$rows
  </section></template>

<template id="act"><div class="act"><span class="what">$what</span><span class="meta $tone">$meta</span></div></template>

<template id="diagnostics"><details class="fold diagnostics-card">
    <summary><span>Diagnostics</span></summary>
    <dl class="diagnostics" id="details">
$rows
    </dl>
  </details></template>

<template id="diag"><div class="diag"><dt>$label</dt><dd class="$class">$value</dd></div></template>
