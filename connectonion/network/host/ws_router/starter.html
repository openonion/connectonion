<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$name</title>
<style>
  /* The O Chat light style: warm neutrals, white cards, one green. The green
     (#22d27a) is a fill under dark ink, never a text colour on white -- it is
     too light to read there; text that must say "green" uses --cc-accent-ink.
     Self-contained: no remote assets, scripts, inline handlers or navigation.
     The chat bridge owns the declarative data-ochat-* controls. */
  :root {
    color-scheme: light dark;
    --cc-bg: #fafaf9;
    --cc-surface: #ffffff;
    --cc-raised: #f5f5f4;
    --cc-text: #1c1917;
    --cc-muted: #57534e;
    --cc-subtle: #6f6a66;
    --cc-border: #e7e5e4;
    --cc-green: #22d27a;
    --cc-on-green: #0b2416;
    --cc-green-soft: #e9faf1;
    --cc-accent-ink: #13703f;
    --cc-danger: #b42318;
    --cc-danger-soft: #fdf0ee;
    --cc-warn: #9a5b00;
    --cc-warn-soft: #fdf5e6;
    --cc-focus: #0b2416;
    --cc-radius: 12px;
    --cc-radius-sm: 8px;
    --cc-shadow: 0 1px 2px rgba(20, 20, 19, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --cc-bg: #121211;
      --cc-surface: #1b1b1a;
      --cc-raised: #252523;
      --cc-text: #f5f5f4;
      --cc-muted: #c4c0bc;
      --cc-subtle: #aaa5a0;
      --cc-border: #33322f;
      --cc-green-soft: #12301f;
      --cc-accent-ink: #5fe39e;
      --cc-danger: #ff8a80;
      --cc-danger-soft: #3a1d1a;
      --cc-warn: #f5c060;
      --cc-warn-soft: #33281a;
      --cc-focus: #5fe39e;
      --cc-shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--cc-bg); }
  body {
    margin: 0;
    padding: clamp(24px, 5vw, 48px) 16px 56px;
    background: var(--cc-bg);
    color: var(--cc-text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html, body { max-width: 100%; overflow-x: clip; }
  main { display: grid; gap: 20px; width: min(100%, 920px); margin: 0 auto; }
  main > *, .columns > *, .activity > * { width: 100%; min-width: 0; max-width: 100%; }
  button, summary { font: inherit; min-height: 44px; }
  :focus-visible { outline: 2px solid var(--cc-focus); outline-offset: 2px; }
  p { margin: 0; }

  /* Header: who this agent is, then one quiet line of facts. No eyebrow: the
     pane around this page is already titled Control Center. */
  .head { display: flex; align-items: center; gap: 16px; padding: 4px 0 8px; }
  .mark {
    flex: none; display: grid; place-items: center; width: 52px; height: 52px;
    border-radius: 14px; background: var(--cc-green); color: var(--cc-on-green);
    font-size: 22px; font-weight: 750; text-transform: uppercase; user-select: none;
  }
  .head-text { min-width: 0; }
  h1 { margin: 0; font-size: clamp(24px, 5vw, 30px); line-height: 1.15; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .tagline { margin-top: 4px; max-width: 62ch; color: var(--cc-muted); font-size: 15px; }
  .tagline:empty, .facts:empty { display: none; }
  .facts { margin-top: 6px; color: var(--cc-subtle); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  .card {
    padding: 18px 20px; border: 1px solid var(--cc-border); border-radius: var(--cc-radius);
    background: var(--cc-surface); box-shadow: var(--cc-shadow);
  }
  .card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .section-title { margin: 0; font-size: 15px; font-weight: 680; letter-spacing: -.01em; }
  .note { margin-left: auto; color: var(--cc-subtle); font-size: 12px; text-align: right; }

  /* Status: the agent's own .co/status.json, first because it is what the
     agent is doing now. Big numbers, then compact lists. Tones colour the
     number or a small dot, never a whole card. */
  .status { display: grid; gap: 14px; }
  .status > *, .status-lists > *, .metrics > * { min-width: 0; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .metric { padding: 12px 14px; border-radius: var(--cc-radius-sm); background: var(--cc-raised); }
  .metric .value { display: block; font-size: 28px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .metric .label { display: block; margin-top: 4px; color: var(--cc-muted); font-size: 12.5px; }
  .metric.tone-good { background: var(--cc-green-soft); }
  .metric.tone-good .value { color: var(--cc-accent-ink); }
  .metric.tone-warn { background: var(--cc-warn-soft); }
  .metric.tone-warn .value { color: var(--cc-warn); }
  .metric.tone-bad { background: var(--cc-danger-soft); }
  .metric.tone-bad .value { color: var(--cc-danger); }
  .status-lists { display: grid; gap: 14px; }
  .status-list h3 { margin: 0 0 4px; color: var(--cc-subtle); font-size: 12.5px; font-weight: 600; }
  .status-item { display: flex; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--cc-border); font-size: 13px; }
  .status-list h3 + .status-item { border-top: 0; }
  .status-item .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-item .meta { flex: none; max-width: 50%; color: var(--cc-subtle); font-size: 12px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-item .text::before {
    content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%;
    background: var(--cc-border); vertical-align: 1px;
  }
  .status-item.tone-bad .text::before { background: var(--cc-danger); }
  .status-item.tone-warn .text::before { background: var(--cc-warn); }
  .status-item.tone-good .text::before { background: var(--cc-green); }
  .metrics:not(:has(*)), .status-lists:not(:has(*)) { display: none; }
  .status-problem { padding: 0 4px; color: var(--cc-subtle); font-size: 12.5px; }

  /* Skills: tiles, each one tap to start a chat with that skill. */
  .tiles { display: grid; gap: 10px; }
  .skill, .restricted-skill {
    position: relative; display: flex; flex-direction: column; justify-content: center; gap: 3px;
    width: 100%; min-width: 0; max-width: 100%; min-height: 72px; padding: 12px 36px 12px 14px;
    border: 1px solid var(--cc-border); border-radius: var(--cc-radius-sm);
    background: var(--cc-surface); color: var(--cc-text); text-align: left; overflow: hidden;
  }
  .skill { cursor: pointer; }
  .skill::after {
    content: ""; position: absolute; right: 16px; top: 50%; width: 7px; height: 7px;
    border-right: 2px solid var(--cc-subtle); border-top: 2px solid var(--cc-subtle);
    transform: translateY(-50%) rotate(45deg);
  }
  .skill:hover, .skill:focus-visible { border-color: var(--cc-green); background: var(--cc-green-soft); }
  .skill:hover::after { border-color: var(--cc-accent-ink); }
  .skill:active { background: var(--cc-green); color: var(--cc-on-green); }
  .skill .name, .restricted-skill .name { font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
  .skill .name::before { content: "/"; color: var(--cc-subtle); font-weight: 500; margin-right: 1px; }
  .skill .desc, .restricted-skill .desc {
    min-width: 0; max-width: 100%; color: var(--cc-muted); font-size: 12.5px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .skill .desc:empty { display: none; }
  .restricted-skill { background: var(--cc-raised); border-style: dashed; padding-right: 14px; }
  co-filter { display: block; min-height: 44px; margin-bottom: 12px; }
  .more { margin-top: 10px; }
  .more > summary {
    display: flex; align-items: center; justify-content: center; padding: 8px 12px;
    border: 1px solid var(--cc-border); border-radius: var(--cc-radius-sm);
    color: var(--cc-muted); cursor: pointer; list-style: none; font-size: 13px; font-weight: 600;
  }
  .more > summary::-webkit-details-marker { display: none; }
  .more[open] > .tiles { margin-top: 10px; }
  .lbl-less { display: none; }
  .more[open] .lbl-more { display: none; }
  .more[open] .lbl-less { display: inline; }
  .empty { padding: 14px; border-radius: var(--cc-radius-sm); background: var(--cc-raised); color: var(--cc-muted); font-size: 13px; }
  code { padding: 1px 5px; border-radius: 5px; background: var(--cc-green-soft); font-size: .92em; }

  /* People and the recent runs sit side by side on a wide pane, People first. A page
     with only one of them gives it the whole width. */
  .columns { display: grid; gap: 20px; align-items: start; }
  .columns:not(:has(*)) { display: none; }
  .activity { display: grid; gap: 20px; }

  /* A run is two lines -- what was asked, then how it went -- so the prompt
     keeps the whole width of a half-width column instead of sharing it. */
  .act { display: grid; gap: 2px; min-height: 44px; padding: 10px 0; border-top: 1px solid var(--cc-border); }
  .card-head + .act { border-top: 0; padding-top: 2px; }
  .act .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act .meta { color: var(--cc-subtle); font-size: 12px; font-variant-numeric: tabular-nums; }
  .act .meta::before {
    content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%;
    background: var(--cc-border); vertical-align: 1px;
  }
  .act .live { color: var(--cc-accent-ink); font-weight: 650; }
  .act .live::before { background: var(--cc-green); }
  .act .bad { color: var(--cc-danger); }
  .act .bad::before { background: var(--cc-danger); }

  .person { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--cc-border); }
  .card-head + .person { border-top: 0; padding-top: 2px; }
  .person .who { flex: 1 1 200px; min-width: 0; }
  .person .line { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .person strong { min-width: 0; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person strong.mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .person .meta { margin-top: 2px; color: var(--cc-subtle); font-size: 12.5px; }
  .person .meta:empty { display: none; }
  .role {
    flex: none; padding: 1px 8px; border: 1px solid var(--cc-border); border-radius: 999px;
    color: var(--cc-muted); font-size: 11.5px; font-weight: 600; line-height: 18px;
  }
  .role:empty { display: none; }
  .role.admin { border-color: var(--cc-green); background: var(--cc-green); color: var(--cc-on-green); }
  .role.whitelist { border-color: transparent; background: var(--cc-green-soft); color: var(--cc-accent-ink); }
  .admin-actions { display: flex; gap: 6px; }
  .admin-actions:empty { display: none; }
  .admin-btn {
    min-height: 34px; padding: 4px 12px; border: 1px solid var(--cc-border); border-radius: var(--cc-radius-sm);
    background: var(--cc-surface); color: var(--cc-text); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .admin-btn:hover { border-color: var(--cc-text); }
  .admin-btn.primary { border-color: var(--cc-green); background: var(--cc-green); color: var(--cc-on-green); }
  .admin-btn.danger { color: var(--cc-danger); }
  .admin-btn.danger:hover { border-color: var(--cc-danger); }
  .sub {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 14px -20px -18px;
    padding: 14px 20px; border-top: 1px solid var(--cc-border); border-radius: 0 0 var(--cc-radius) var(--cc-radius);
    background: var(--cc-raised);
  }
  .sub + .sub { margin-top: 18px; }
  .sub .who { flex: 1 1 200px; min-width: 0; }
  .sub .label { display: block; color: var(--cc-subtle); font-size: 12px; }
  .sub .value { font-weight: 650; overflow-wrap: anywhere; }
  .sub .value.mono { font: 650 14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .02em; }

  /* Health: one line, no accordion. */
  .health { display: grid; gap: 4px; padding: 4px 4px 0; color: var(--cc-subtle); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .health .line::before {
    content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%;
    background: var(--cc-border); vertical-align: 0;
  }
  .health .up::before { background: var(--cc-green); }
  .addr { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; user-select: all; }
  .log > summary { min-height: 32px; cursor: pointer; color: var(--cc-subtle); font-size: 12.5px; }
  .log pre {
    max-height: 320px; margin: 6px 0 0; padding: 12px; overflow: auto; border: 1px solid var(--cc-border);
    border-radius: var(--cc-radius-sm); background: var(--cc-surface);
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
  }

  @media (min-width: 560px) {
    .tiles { grid-template-columns: 1fr 1fr; }
    .status-lists { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 28px; }
  }
  @media (min-width: 900px) {
    .tiles { grid-template-columns: 1fr 1fr 1fr; }
    .columns:has(> .people):has(> .activity) { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  }
  @media (max-width: 520px) {
    .card { padding: 16px; }
    .sub { margin: 14px -16px -16px; padding: 14px 16px; }
    .card-head { flex-wrap: wrap; }
    .note { margin-left: 0; flex-basis: 100%; text-align: left; }
    .status-item { flex-wrap: wrap; gap: 0 12px; }
    .status-item .text { flex-basis: 100%; white-space: normal; }
    .status-item .meta { max-width: 100%; padding-left: 15px; text-align: left; }
    .act .what { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .skill, .admin-btn, summary { transition: background-color .14s ease, border-color .14s ease; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <main>
    <header class="head">
      <span class="mark" aria-hidden="true">$initial</span>
      <div class="head-text">
        <h1>$name</h1>
        <p class="tagline">$tagline</p>
        <p class="facts">$subtitle</p>
      </div>
    </header>
$status

    <section class="card skills" aria-labelledby="skills-title">
      <div class="card-head"><h2 class="section-title" id="skills-title">Skills</h2><span class="note">$capability_count</span></div>
      <div id="capability-list">
$body
      </div>
    </section>

    <div class="columns">
$admin
$activity
    </div>
$health
  </main>
</body>
</html>

<!--FRAGMENTS
Everything below this marker is render scaffolding and never reaches the page.
Placeholders use string.Template syntax; do not use dollar signs elsewhere.
-->

<template id="skill"><button class="skill" type="button" data-ochat-skill="$name"><span class="name">$name</span><span class="desc">$description</span></button></template>

<template id="list"><div class="tiles">
$rows
  </div></template>

<template id="filter"><co-filter target="#capability-list" placeholder="Search skills"></co-filter></template>

<template id="more"><details class="more">
    <summary><span class="lbl-more">$count more skill$plural</span><span class="lbl-less">Show fewer</span></summary>
    <div class="tiles">
$rows
    </div>
  </details></template>

<template id="empty"><p class="empty">No published skills yet. Add one to <code>.co/skills/</code> and it appears here.</p></template>

<template id="quick"><section class="card" aria-labelledby="quick-title">
    <h2 class="section-title" id="quick-title">Quick actions</h2>
    <div class="tiles">
$rows
    </div>
  </section></template>

<template id="activity"><section class="card">
    <div class="card-head"><h2 class="section-title">$title</h2><span class="note">$note</span></div>
$rows
  </section></template>

<template id="act"><div class="act"><span class="what">$what</span><span class="meta $tone">$meta</span></div></template>

<template id="restricted"><div class="restricted-skill"><span class="name">$name</span><span class="desc">Allowed by restricted: in host.yaml. Ask for it in chat.</span></div></template>

<template id="status"><section class="card status" aria-labelledby="status-title">
      <div class="card-head"><h2 class="section-title" id="status-title">$title</h2><span class="note">$updated</span></div>
      <div class="metrics">
$metrics
      </div>
      <div class="status-lists">
$lists
      </div>
    </section></template>

<template id="metric"><div class="metric $tone"><span class="value">$value</span><span class="label">$label</span></div></template>

<template id="status_list"><div class="status-list"><h3>$title</h3>
$items
        </div></template>

<template id="status_item"><div class="status-item $tone"><span class="text">$text</span><span class="meta">$meta</span></div></template>

<template id="status_problem"><p class="status-problem">$problem</p></template>

<template id="health"><footer class="health">
      <p class="line $tone">$facts</p>
      $address
      $log
    </footer></template>

<template id="admin"><section class="card people" id="admin">
        <div class="card-head"><h2 class="section-title">People</h2><span class="note">$count · only admins see this</span></div>
$rows
$extras
      </section></template>

<template id="person"><div class="person"><div class="who"><p class="line"><strong class="$mono">$what</strong><span class="role $role">$role</span></p><p class="meta">$meta</p></div><div class="admin-actions">$actions</div></div></template>

<template id="admin_sub"><div class="sub"><div class="who"><span class="label">$label</span><span class="value $mono">$value</span></div><div class="admin-actions">$actions</div></div></template>

<template id="admin_button"><button class="admin-btn $tone" type="button" data-ochat-admin="$action" data-ochat-target="$target">$label</button></template>

<template id="admin_log"><details class="log">
        <summary>Log · $count</summary>
        <pre>$text</pre>
      </details></template>
