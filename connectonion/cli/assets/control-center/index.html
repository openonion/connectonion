<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect AI · Control Center</title>
  <style>
    /* This is the interactive version of CO AI's canonical starter.html.
       Keep its tokens, landmarks, and responsive structure in sync with
       connectonion/network/host/ws_router/starter.html. The one thing this page
       adds is the composer: it is the page's single focus, so it is the only
       filled green control on it. */
    /* O Chat v12: one light ground, green and white only. Green is spent on four
       things — the one primary action, the live dot, the current item and focus
       rings — so --cc-danger is deliberately not a red: a failure is said in words
       and weight, not in a second accent colour. --cc-subtle is the quietest text
       that still reads (AA on every ground); --cc-faint is for chevrons and
       the marks that carry no words. */
    :root {
      color-scheme: light dark;
      --cc-bg: #f8faf9;
      --cc-surface: #ffffff;
      --cc-surface-raised: #f1f5f2;
      --cc-text: #122019;
      --cc-muted: #4f5f56;
      --cc-subtle: #5f6f66;
      --cc-faint: #9aa8a0;
      --cc-border: #e3e9e5;
      --cc-border-strong: #cfd9d3;
      --cc-accent: #146c43;
      --cc-on-accent: #ffffff;
      --cc-live: #1f9d5c;
      --cc-accent-soft: #e9f4ee;
      --cc-accent-text: #146c43;
      --cc-danger: #122019;
      --cc-focus: #146c43;
      --cc-radius-sm: 6px;
      --cc-radius-md: 8px;
      --cc-shadow: 0 1px 2px rgba(20, 20, 19, .04);
      --cc-serif: "New York", ui-serif, Georgia, serif;
      --cc-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --cc-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --cc-bg: #0b100d;
        --cc-surface: #111813;
        --cc-surface-raised: #17201a;
        --cc-text: #e9f0eb;
        --cc-muted: #a4b3aa;
        --cc-subtle: #8a9990;
        --cc-faint: #67766d;
        --cc-border: #1f2a23;
        --cc-border-strong: #2c3a31;
        --cc-accent: #3fbf7f;
        --cc-on-accent: #06150d;
        --cc-live: #3fbf7f;
        --cc-accent-soft: #16281e;
        --cc-accent-text: #7fd6a8;
        --cc-danger: #e9f0eb;
        --cc-focus: #3fbf7f;
        --cc-shadow: 0 1px 2px rgba(0, 0, 0, .3);
      }
    }
    :root[data-theme="dark"] {
      --cc-bg: #0b100d;
      --cc-surface: #111813;
      --cc-surface-raised: #17201a;
      --cc-text: #e9f0eb;
      --cc-muted: #a4b3aa;
      --cc-subtle: #8a9990;
      --cc-faint: #67766d;
      --cc-border: #1f2a23;
      --cc-border-strong: #2c3a31;
      --cc-accent: #3fbf7f;
      --cc-on-accent: #06150d;
      --cc-live: #3fbf7f;
      --cc-accent-soft: #16281e;
      --cc-accent-text: #7fd6a8;
      --cc-danger: #e9f0eb;
      --cc-focus: #3fbf7f;
      --cc-shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
    * { box-sizing: border-box; }
    html { background: var(--cc-bg); }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: var(--cc-bg);
      color: var(--cc-text);
      font: 14px/1.5 var(--cc-sans);
      -webkit-font-smoothing: antialiased;
    }
    html, body { max-width: 100%; overflow-x: clip; }
    main, .skill-rows, .skill { width: 100%; min-width: 0; max-width: 100%; }
    button, input, textarea, summary { font: inherit; }
    :focus-visible { outline: 2px solid var(--cc-focus); outline-offset: 2px; border-radius: 4px; }
    [hidden] { display: none !important; }

    .bar {
      display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 16px;
      border-bottom: 1px solid var(--cc-border); background: var(--cc-surface);
    }
    .bar .nm { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
    .bar .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .live-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--cc-faint); }
    .connected .live-dot { background: var(--cc-live); }
    .bar .r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .state { color: var(--cc-subtle); font-size: 12.5px; white-space: nowrap; }
    .quiet-link {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px;
      border-radius: var(--cc-radius-sm); color: var(--cc-muted); font-size: 12.5px; text-decoration: none;
    }
    .quiet-link:hover { background: var(--cc-surface-raised); color: var(--cc-text); }

    main { flex: 1; width: min(100%, 720px); margin: 0 auto; padding: 56px 24px 32px; }
    h1 {
      margin: 0; font-family: var(--cc-serif); font-weight: 600; font-size: 34px;
      line-height: 1.1; letter-spacing: -.02em; overflow-wrap: anywhere;
    }

    .ids { display: grid; gap: 2px; margin: 14px 0 0; }
    .ids > div { display: flex; align-items: baseline; gap: 10px; min-width: 0; font-size: 12.5px; }
    .ids dt { flex: none; width: 52px; color: var(--cc-subtle); }
    .ids dd { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; margin: 0; min-width: 0; color: var(--cc-muted); }
    .addr, .revision { font-family: var(--cc-mono); font-size: 12px; overflow-wrap: anywhere; user-select: all; min-width: 0; }
    .copy {
      min-height: 28px; padding: 0 6px; border: 0; border-radius: var(--cc-radius-sm);
      background: transparent; color: var(--cc-subtle); font-size: 12px; cursor: pointer;
    }
    .copy:hover { background: var(--cc-surface-raised); color: var(--cc-text); }

    .fold { margin-top: 32px; }
    /* Consecutive folded sections read as one list of labels. */
    .fold + .fold, .sec + .fold { margin-top: 12px; }
    .fold > summary {
      display: flex; align-items: center; gap: 8px; min-height: 44px; list-style: none; cursor: pointer;
      color: var(--cc-muted); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    }
    .fold > summary::-webkit-details-marker { display: none; }
    .fold > summary::before {
      content: ""; flex: none; width: 6px; height: 6px; margin: 0 3px 0 1px;
      border-right: 1.5px solid var(--cc-faint); border-bottom: 1.5px solid var(--cc-faint);
      transform: rotate(-45deg);
    }
    .fold[open] > summary::before { transform: translateY(-2px) rotate(45deg); }
    .fold > summary .n { color: var(--cc-subtle); letter-spacing: 0; }
    .filter {
      width: 100%; min-height: 40px; margin: 4px 0 8px; padding: 0 12px; border: 1px solid var(--cc-border-strong);
      border-radius: var(--cc-radius-md); background: var(--cc-surface); color: var(--cc-text);
    }
    .filter:focus { outline: none; border-color: var(--cc-accent); box-shadow: 0 0 0 3px var(--cc-accent-soft); }
    .skill-rows { display: grid; }
    .skill {
      display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; row-gap: 2px;
      min-height: 44px; padding: 10px 0; border: 0; border-top: 1px solid var(--cc-border);
      background: transparent; color: var(--cc-text); cursor: pointer; text-align: left;
    }
    .skill .name { flex: none; max-width: 100%; font-weight: 500; overflow-wrap: anywhere; }
    .skill .desc { flex: 1 1 18ch; min-width: 0; max-width: 100%; color: var(--cc-muted); }
    .skill .desc:empty { display: none; }
    .skill .use { flex: none; margin-left: auto; color: var(--cc-subtle); font-size: 13px; opacity: 0; }
    .skill:hover .use, .skill:focus-visible .use { opacity: 1; }
    .skill:hover .name { color: var(--cc-accent-text); }
    .empty { margin: 0; padding: 10px 0; border-top: 1px solid var(--cc-border); color: var(--cc-muted); }
    code { font-family: var(--cc-mono); font-size: .92em; }

    #recent-chat p { margin: 0; padding: 9px 0; border-top: 1px solid var(--cc-border); font-size: 13px; }
    .note { margin: 0; padding: 9px 0; border-top: 1px solid var(--cc-border); color: var(--cc-subtle); font-size: 12.5px; }
    .diagnostics { margin: 0; }
    .diag { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--cc-border); font-size: 13px; }
    .diag dt { color: var(--cc-subtle); }
    .diag dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

    /* The composer, docked like O Chat's. Sticky, so a long skill list scrolls
       under it instead of pushing it off the page. */
    .dock {
      position: sticky; bottom: 0; width: min(100%, 720px); margin: 0 auto; padding: 0 24px 20px;
      background: linear-gradient(to bottom, transparent, var(--cc-bg) 16px);
    }
    .comp { border: 1px solid var(--cc-border); border-radius: var(--cc-radius-md); background: var(--cc-surface); box-shadow: var(--cc-shadow); }
    .comp:focus-within { border-color: var(--cc-border-strong); }
    .comp .row { display: flex; align-items: flex-end; gap: 10px; padding: 10px 10px 10px 14px; }
    textarea {
      flex: 1; min-width: 0; min-height: 36px; max-height: 240px; resize: none; padding: 7px 0;
      border: 0; background: transparent; color: var(--cc-text); font-size: 15px; line-height: 1.45;
    }
    textarea:focus { outline: none; }
    textarea::placeholder { color: var(--cc-subtle); }
    .send {
      flex: none; display: grid; place-items: center; width: 44px; height: 44px;
      border: 0; border-radius: var(--cc-radius-md); background: var(--cc-accent); color: var(--cc-on-accent); cursor: pointer;
    }
    .send:disabled { background: var(--cc-surface-raised); color: var(--cc-faint); cursor: not-allowed; }
    .comp .ft { display: flex; align-items: center; min-height: 32px; padding: 4px 14px; border-top: 1px solid var(--cc-border); }
    .status { margin: 0; color: var(--cc-subtle); font-size: 12px; }
    .comp .ft:has(.status:empty) { display: none; }
    .status[data-state="error"] { color: var(--cc-danger); font-weight: 600; }

    @media (min-width: 640px) {
      .skill .name { white-space: nowrap; }
    }
    @media (max-width: 520px) {
      main { padding: 36px 16px 24px; }
      h1 { font-size: 30px; }
      .dock { padding: 0 12px 12px; }
      .state { display: none; }
      .skill .use { display: none; }
      /* A description beside the name leaves a ragged hanging column at phone
         width; under it, every row reads the same way. */
      .skill .desc { flex-basis: 100%; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .skill .use, .skill .name, .quiet-link, .send { transition: opacity .12s ease, color .12s ease, background-color .12s ease; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header id="connection" class="bar">
    <span class="nm"><i class="live-dot" aria-hidden="true"></i><span>Connect AI</span></span>
    <div class="r"><span id="connection-label" class="state">Not connected</span><a class="quiet-link" href="#details">Details</a></div>
  </header>
  <main>
    <section class="intro" aria-labelledby="agent-name">
      <h1 id="agent-name">Connect AI</h1>
      <dl id="card-ids" class="ids" hidden>
        <div><dt>Address</dt><dd><span id="card-address" class="addr"></span><button class="copy" type="button" data-copy="#card-address" aria-label="Copy address">Copy</button></dd></div>
      </dl>
    </section>

    <details id="skills" class="fold skills" open>
      <summary><span>Skills</span><span id="capability-count" class="n"></span></summary>
      <input id="skill-filter" class="filter" type="search" placeholder="Search skills" aria-label="Search skills" hidden>
      <div id="capability-list" class="skill-rows">
        <p class="empty">Not connected.</p>
      </div>
      <p id="search-empty" class="empty" hidden>No skills match.</p>
    </details>

    <details id="recent" class="fold">
      <summary><span>Recent chat</span></summary>
      <p id="history-note" class="note" hidden></p>
      <div id="recent-chat" aria-live="polite" style="overflow-wrap:anywhere"></div>
    </details>

    <details class="fold diagnostics-card">
      <summary><span>Diagnostics</span></summary>
      <dl id="details" class="diagnostics">
        <div class="diag"><dt>Address</dt><dd id="agent-address" class="addr">Not connected</dd></div>
        <div class="diag"><dt>Skills</dt><dd id="diagnostic-skills">Unknown</dd></div>
        <div class="diag"><dt>Conversation</dt><dd id="diagnostic-conversation">Not connected</dd></div>
        <div class="diag"><dt>App revision</dt><dd id="app-revision" class="revision">Not connected</dd></div>
      </dl>
    </details>
  </main>

  <div class="dock">
    <form id="message-form" class="comp" aria-label="Workspace">
      <div class="row">
        <textarea id="message" name="message" rows="1" autocomplete="off" placeholder="Send a message…" required maxlength="10000" aria-label="Message to Agent"></textarea>
        <button class="send" type="submit" aria-label="Send" disabled><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="ft"><p id="status" class="status" data-state="idle" role="status" aria-live="polite"></p></div>
    </form>
  </div>
  <script type="module" src="./control-center.js"></script>
</body>
</html>
