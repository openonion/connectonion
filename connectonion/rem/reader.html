    .rail { position: static; height: 0; padding: 0; width: 0; overflow: visible; }
    .brand, .rail-menu { display: none; }
    .rail[data-open="true"] .rail-menu { display: flex; position: fixed; left: 12px; right: 12px; bottom: 88px; top: auto; max-height: 70vh; overflow-y: auto; z-index: 45; align-items: stretch;
      padding: 8px; border-radius: var(--r-card); background: var(--raised); box-shadow: var(--e3); }
    .rail[data-open="true"] #nav { align-items: stretch; }
    .rail[data-open="true"] .rail-end { flex-direction: row; justify-content: space-between; margin-top: 4px; }
    .rail[data-open="true"] .nav { width: auto; height: 44px; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 12px; }
    .rail[data-open="true"] .nav .ic { width: 18px; height: 18px; }
    /* a row has room for the whole name, so it reads the name the link already carries, not the rail's short word */
    .rail[data-open="true"] .nav .w { display: none; }
    .rail[data-open="true"] .nav::after { content: attr(aria-label); font: var(--w-regular) var(--s-body)/1.4 var(--font); }
    .rail[data-open="true"] .nav .n { position: static; order: 1; }
    .rail[data-open="true"] .nav.more { display: none; }
    .rail[data-open="true"] .rail-more { display: block; position: static; box-shadow: none; padding: 0; animation: none; min-width: 0; }
    .rail[data-open="true"] .rail-more .mi { min-height: 44px; padding: 0 12px; font: var(--w-regular) var(--s-body)/1.4 var(--font); }
    .top { height: 48px; padding: 0 18px; gap: 10px; }
    .crumb { width: auto; flex: 1; color: var(--ink); font: var(--w-bold) var(--s-body)/1.4 var(--font); }
    .crumb a { color: var(--ink); }
    .top-end { width: auto; }
    .lang-toggle { min-width: 44px; height: 44px; }
    .search { display: none; }
    body.searching .search { display: flex; position: fixed; left: 12px; right: 12px; top: 10px; z-index: 46; max-width: none; }
    body.searching .search input { font: var(--w-regular) var(--s-body)/1 var(--font); }
    .search .kbd { display: none; }
    main { padding: 4px 16px 40px; }
    .tabbar { display: flex; position: fixed; left: 12px; right: 12px; bottom: 14px; height: 62px; border-radius: var(--r-card); background: var(--raised); box-shadow: var(--e2);
      justify-content: space-around; align-items: center; z-index: 30; }
    .tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 60px; min-height: 48px; justify-content: center; color: var(--grey);
      font: var(--w-regular) var(--s-meta)/1.3 var(--font); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none !important; }
    .tab.active, .tab[aria-expanded="true"] { color: var(--ink); font-weight: var(--w-bold); }
    .tab .n { position: absolute; top: -2px; right: 8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-pill); background: var(--ink); color: var(--paper);
      font: var(--w-bold) var(--s-meta)/18px var(--font); text-align: center; }
    dialog.n3-sheet, dialog.palette { width: 100%; max-width: 100%; inset: auto 0 0 0; margin: 0; border-radius: var(--r-card); border-bottom-left-radius: 0; border-bottom-right-radius: 0; max-height: 85vh; }
  }

  /* ---- shared N3 parts: faces, widgets, buttons ---- */
  .face { position: relative; width: 40px; height: 40px; border-radius: var(--round); background: var(--well); color: var(--ink); display: inline-grid; place-items: center; flex: none;
    font: var(--w-bold) var(--s-ui)/1 var(--font); letter-spacing: 0; }
  .face.s { width: 22px; height: 22px; font: var(--w-bold) var(--s-meta)/1 var(--font); }
  .face.l { width: 46px; height: 46px; }
  .face.xl { width: 104px; height: 104px; font: var(--w-bold) var(--s-head)/1 var(--font); }
  .face svg.ring { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); transform: rotate(-90deg); overflow: visible; }
  .face svg.ring circle { fill: none; stroke-width: 3; }
  .face.xl svg.ring circle { stroke-width: 2.4; }
  .face svg.ring .track { stroke: var(--rule); }
  .face svg.ring .burn { stroke: var(--red); stroke-linecap: round; animation: n3-burn var(--t-burn) var(--ease-out) both; animation-delay: var(--t-state); }
  .org-mark { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: var(--r-org); border: 1.6px solid currentColor; flex: none;
    font: var(--w-bold) var(--s-meta)/1 var(--font); color: var(--ink); }
  .org-mark.l { width: 46px; height: 46px; font: var(--w-bold) var(--s-ui)/1 var(--font); }
  .widget { background: var(--raised); border-radius: var(--r-card); box-shadow: var(--e1); padding: 18px 20px; animation: n3-rise var(--t-draw) var(--spring) both; }
  .wt { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--grey); font: var(--w-regular) var(--s-meta)/1.4 var(--font); }
  .wt .ic { width: 15px; height: 15px; }
  .big { font: var(--w-bold) var(--s-head)/1.15 var(--font); letter-spacing: -0.02em; color: var(--ink); }
  .btn-act { min-height: 40px; padding: 0 16px; border: 0; border-radius: var(--radius); background: var(--green); color: var(--on-green) !important; box-shadow: var(--e-green);
    font: var(--w-bold) var(--s-body)/1 var(--font); transition: transform var(--t-press) var(--spring); }
  .btn-act:hover { background: var(--green); color: var(--on-green) !important; transform: translateY(-1px); }
  /* Green means the action is available: a disabled primary (a snapshot, an unanswered question) is a well. */
  .btn-act:disabled, .btn-act:disabled:hover { background: var(--well); color: var(--grey) !important; box-shadow: none; transform: none; }
  .btn-quiet { min-height: 32px; padding: 0 10px; border-radius: var(--radius); color: var(--grey); font: var(--w-regular) var(--s-ui)/1.3 var(--font); }
  .btn-quiet:hover { color: var(--ink); background: var(--well); }
  @media (max-width: 820px), (pointer: coarse) { .btn-act, .card-acts .btn-act { min-height: 44px; } }
  .link-btn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); font: var(--w-regular) var(--s-ui)/1.5 var(--font);
    text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }

  /* ---- Today: the night chart and who waits ---- */
  .schedule-failure, .snapshot-line { margin: 0 0 12px; color: var(--grey); font: var(--w-regular) var(--s-ui)/1.5 var(--font); }
  .night-card { padding: 16px 24px 12px; border-radius: var(--r-card); background: var(--raised); box-shadow: var(--e1); animation: n3-rise var(--t-draw) var(--spring) both; }
  .nh { display: flex; align-items: center; gap: 8px; color: var(--ink); font: var(--w-bold) var(--s-ui)/1.4 var(--font); }
  .nh .ic { width: 15px; height: 15px; }
  .nh .chart-toggle { display: none; align-items: center; gap: 6px; padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; font: var(--w-bold) var(--s-ui)/1.4 var(--font); }
  .nh .legend { margin-left: 8px; color: var(--grey); font: var(--w-regular) var(--s-meta)/1.4 var(--font); opacity: 0; transition: opacity var(--t-press) var(--ease-out); }
  .night-card:hover .legend, .night-card:focus-within .legend { opacity: 1; }
  .nb { display: flex; align-items: center; gap: 28px; }
  /* A sparse three nights (nightSparse): one grey line under the title, and the people waiting take the row. */
  .nh .nt { flex: none; white-space: nowrap; }
  .nh .night-sum { margin-left: 8px; min-width: 0; color: var(--grey); font: var(--w-regular) var(--s-meta)/1.4 var(--font); }
  .night-card.sparse .faces { flex-direction: row; align-items: center; gap: 24px; padding: 6px 0 4px; }
  /* Why the nights read nothing: one plain line under the title; the pages set aside fold beneath it. */
  .night-stall { margin: 4px 0 0 23px; color: var(--ink); font: var(--w-regular) var(--s-meta)/1.5 var(--font); }
  .night-stall > summary { cursor: pointer; list-style: none; }
  .night-stall > summary::-webkit-details-marker { display: none; }
  .night-stall > summary::after { content: " ›"; color: var(--grey); }
  .night-stall[open] > summary::after { content: " ⌄"; }
  .night-stall ul { margin: 4px 0 0; padding: 0; list-style: none; }
  .night-stall li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .night-stall li .meta { color: var(--grey); }
  .night-card.sparse .frow { flex: 1; min-width: 0; }
  .hyp-wrap { flex: 1; min-width: 0; }
  .hyp { display: block; width: 100%; height: auto; overflow: visible; }
  .hyp .lv line { stroke: var(--rule); stroke-dasharray: 2 4; }
  .hyp .line { fill: none; stroke: var(--pencil); stroke-width: 1.3; stroke-linejoin: round; stroke-dasharray: 6000; animation: n3-draw var(--t-night) var(--ease-out) both; }
  .hyp .hit { fill: transparent; }
  .hyp .hit:hover { fill: var(--well); }
  .hyp .rise { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
  .hyp .stem { stroke: var(--ink); stroke-width: 1.6; }
  .hyp .fc circle { fill: var(--raised); stroke: var(--ink); stroke-width: 1.4; }
  .hyp .fc text { fill: var(--ink); text-anchor: middle; dominant-baseline: central; font: var(--w-bold) var(--s-meta)/1 var(--font); }
  .hyp .fc.sel circle { fill: var(--ink); }
  .hyp .fc.sel text { fill: var(--paper); }
  .hyp .fc text.plus { fill: var(--grey); text-anchor: start; }
  .hyp .days text { fill: var(--grey); text-anchor: middle; font: var(--w-regular) var(--s-meta)/1 var(--font); }
  .hyp .now { fill: var(--ink); animation: n3-ember var(--t-ember) var(--ease-out) infinite; }
  .faces { flex: none; display: flex; flex-direction: column; gap: 10px; padding-left: 26px; border-left: var(--hair) solid var(--rule); max-width: 300px; }
  .nb.solo .faces { border-left: 0; padding: 8px 0; max-width: none; flex: 1; }
  .count-line { display: flex; align-items: baseline; gap: 10px; margin: 0; color: var(--grey); font: var(--w-regular) var(--s-body)/1.3 var(--font); letter-spacing: 0; }
  .count-line .count { color: var(--ink); font: var(--w-bold) var(--s-display)/1 var(--font); letter-spacing: var(--track-display); }
  .count-line { flex-wrap: wrap; row-gap: 2px; }
  .count-line .count-of { flex-basis: 100%; color: var(--grey); font: var(--w-regular) var(--s-ui)/1.3 var(--font); }
  .frow { display: flex; gap: 6px; overflow-x: auto; padding: 6px 4px 4px; margin: -6px -4px -4px; }
  .deal { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 8px 6px; border: 0; border-radius: var(--r-inner); background: none; cursor: pointer;
    transition: background var(--t-state) var(--ease-out), box-shadow var(--t-state) var(--ease-out); }
  .deal:hover { background: var(--well); }
  .deal.on { background: var(--raised); box-shadow: var(--e1); }
  .deal .dd { color: var(--grey); font: var(--w-regular) var(--s-meta)/1.2 var(--font); white-space: nowrap; }
  .deal .dd.late { color: var(--red); }

  /* ---- Today: the deck — one raised card ---- */
  .tgrid { display: grid; grid-template-columns: minmax(0, 1fr) var(--rail); gap: var(--gap); align-items: start; margin-top: 22px; }
  .deck { position: relative; padding-bottom: 26px; min-width: 0; }
  .deck:has(.qcard ~ .qcard)::before, .deck:has(.qcard ~ .qcard)::after { content: ""; position: absolute; left: 22px; right: 22px; bottom: 13px; height: 60px; border-radius: var(--r-card);
    background: var(--raised); box-shadow: var(--e1); }
  .deck:has(.qcard ~ .qcard)::after { left: 44px; right: 44px; bottom: 0; opacity: .7; }
  .today-brief { position: relative; z-index: 1; }
  .today-brief .today-threads { display: block; border: 0; }
  .today-brief .qcard { display: none; cursor: auto; }
  .today-brief .qcard.focal { display: block; padding: 24px 28px 22px; border: 0; border-radius: var(--r-card); background: var(--raised); box-shadow: var(--e2); cursor: auto;
    animation: n3-rise var(--t-draw) var(--spring) backwards; }  /* no fill once risen: a filled transform would hold the pinned Send bar */
  .today-brief .qcard.focal:focus-visible { outline: 0; background: var(--well); }
  .today-brief .qsent { padding: 14px 20px; margin-bottom: 14px; border-radius: var(--r-inner); background: var(--well); }
  .today-brief .qsent .lede { margin: 0; color: var(--ink); font: var(--w-bold) var(--s-ui)/1.5 var(--font); }
  .today-brief > .quiet-line { padding: 36px 20px; border-radius: var(--r-card); background: var(--raised); box-shadow: var(--e1); text-align: center; }
  .qhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
  .qhead .qmark { display: none; }
  .qhead .qmark.org { display: inline-block; width: 18px; height: 18px; border-radius: var(--r-org); border: 1.6px solid var(--ink); }
  .qhead .today-who { color: var(--ink); font: var(--w-bold) var(--s-head)/1.15 var(--font); letter-spacing: -0.01em; }
  .qhead .org-chip { flex: 0 1 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 28px; max-width: 100%; padding: 4px 11px; border-radius: var(--r-pill); box-shadow: var(--e-ring);
    color: var(--grey); font: var(--w-regular) var(--s-ui)/1.3 var(--font); white-space: normal; overflow: visible; }
  .qhead-acts { margin-left: auto; display: flex; opacity: 0; transition: opacity var(--t-state) var(--ease-out); }
  .qhead-acts .ibtn { width: auto; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; color: var(--grey); font: var(--w-regular) var(--s-meta)/1 var(--font); white-space: nowrap; }
  .qhead-acts .ibtn:hover { color: var(--ink); }
  .qcard:hover .qhead-acts, .qcard:focus-within .qhead-acts { opacity: 1; }
  .qhead .qage { color: var(--grey); font: var(--w-bold) var(--s-ui)/1 var(--font); white-space: nowrap; }
  .qhead .qage.late { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 8px; border-radius: var(--r-pill); color: var(--red); box-shadow: var(--e-fuse); }
  .qhead .qage.late::before { content: ""; width: 7px; height: 7px; border-radius: var(--round); background: var(--red); animation: n3-ember var(--t-ember) var(--ease-out) infinite; }
  .qitems { display: grid; gap: 2px; margin: 16px 0 18px; padding: 0; }
  .qitem { grid-template-columns: minmax(0, 1fr) 30px; padding: 7px 8px 7px 30px; margin: 0 -10px; border-radius: var(--radius); cursor: default;
    transition: background var(--t-press) var(--ease-out); }
  .qitem::before { content: ""; position: absolute; left: 12px; top: 15px; width: 8px; height: 8px; border-radius: var(--round); background: var(--pencil); }
  .qitem.late::before { background: var(--red); }
  .qitem:hover, .qitem.show { background: var(--well); }
  .qcard .qitem .words, .qcard.open .qitem .words { margin: 0; white-space: normal; color: var(--ink); font: var(--w-regular) var(--s-body)/1.5 var(--font); }
  .today-threads > .qcard:first-child.open .qitem:first-child .words { font-size: var(--s-body); line-height: 1.5; }
  .qcard.focal[data-step="send"]:not(.full) .qitem .words { display: block; -webkit-line-clamp: unset; overflow: visible; }
  .qcard .qdone, .qcard.open .qdone { width: 30px; height: 30px; opacity: 0; border-radius: var(--radius); }
  .qcard .qitem:is(:hover, :focus-within, .show) .qdone { opacity: 1; }
  .qcard .qdone:hover { background: var(--raised); }
  .qcard .qmore, .qcard.open .qmore { display: none; color: var(--grey); font: var(--w-regular) var(--s-ui)/1.5 var(--font); }
  .qcard .qitem:is(:hover, :focus-within, .show, .handled) .qmore, .qcard .qitem:has(.talk, .handed, .task-result) .qmore { display: block; }
  /* The strip itself (kind · Codex · Claude · 聊一聊 · 标为完成 · 忽略) is always shown on an open card, so Mark done and
     Ignore are words you can see and tap once; the notes under it (also on, the draft's reason, a task's result)
     keep the hover or tap reveal. Hover-only, an untouched card had no visible way to close a row (owner, 2026-11-12). */
  .qcard.open .qitem .qmore:has(.handoff) { display: block; }
  .qcard.open .qitem:not(:hover, :focus-within, .show, .handled):not(:has(.talk, .handed, .task-result)) .qmore > :not(.qkind) { display: none; }
  .qcard .qkind { gap: var(--u1) var(--u3); }
  .qcard .handoff-line .btn-quiet, .qcard .talk-menu summary { min-height: 30px; color: var(--ink); }
  .qcard .handoff-line .strip-lead { font-weight: var(--w-bold); }
  .qcard .strip-more > summary { text-decoration: none; color: var(--grey); }
  .qcard .strip-more > .talk-choices { left: auto; right: 0; }
  .qcard .strip-more .talk-menu > summary { padding: 0 10px; }
  .task-result { margin: 8px 0 0; padding: 14px 16px; border-radius: var(--r-inner); background: var(--raised); box-shadow: var(--e1); color: var(--ink); }
  .card-acts { margin: 14px 0 0; gap: 8px 14px; }
  .card-acts .btn-act, .card-acts .btn-line { min-height: 40px; border-radius: var(--radius); }
  .card-acts .btn-line { border: 0; box-shadow: var(--e-ring); }
  .card-acts .btn-quiet { font: var(--w-regular) var(--s-ui)/1.5 var(--font); }

  /* the composer: the reply as the letter it becomes */
  .qdraft .mailcard { border: 0; border-radius: var(--r-inner); box-shadow: var(--e-ring); background: none; }
  .qdraft .mail-head { padding: 14px 18px 0; border: 0; background: none; }
  .qdraft .mail-row { border: 0; color: var(--grey); font: var(--w-regular) var(--s-ui)/1.6 var(--font); }
  .qdraft .mail-row .k { color: var(--grey); }
  .qdraft .mail-channels { padding: 3px; border-radius: var(--r-pill); background: var(--well); }
  .qdraft .mail-channels .channel { border-radius: var(--r-pill); font: var(--w-regular) var(--s-meta)/1.4 var(--font); }
  .qdraft .mail-channels .channel.active { background: var(--raised); color: var(--ink); box-shadow: var(--e1); }
  .qdraft .mail-text { color: var(--ink); font: var(--w-regular) var(--s-body)/var(--lh-body) var(--font); }
  .qdraft .mail-actions { border: 0; background: none; padding: 12px 18px 14px; }
  .qdraft .mail-choices { border: 0; }
  .mail-actions .btn-act { margin-left: auto; }
  .mail-actions .mail-note { opacity: 0; transition: opacity var(--t-press) var(--ease-out); color: var(--grey); font: var(--w-regular) var(--s-meta)/1.4 var(--font); }
  .mail-actions:hover .mail-note, .mail-actions:focus-within .mail-note { opacity: 1; }
  .more-menu { position: relative; }
  .more-menu > summary { list-style: none; width: 38px; height: 38px; border-radius: var(--radius); display: grid; place-items: center; color: var(--grey); cursor: pointer; }
  .more-menu > summary::-webkit-details-marker { display: none; }
  .more-menu > summary:hover, .more-menu[open] > summary { background: var(--well); color: var(--ink); }
  .more-menu > .menu { left: 0; bottom: 44px; }
  .more-menu .menu .btn-quiet { display: flex; width: 100%; justify-content: flex-start; min-height: 36px; color: var(--ink); }
  .qdraft :is(.mail-body, .mail-choices, .mail-text, .mail-gist, .mail-head) { background: none; }

  /* ---- Today: the side column ---- */
  .tgrid > .side { display: grid; gap: 16px; min-width: 0; }
  .tgrid > .side > * { margin: 0; }
  .tgrid > .side .widget:nth-child(2) { animation-delay: calc(var(--t-stagger) * 2); }
  .tgrid > .side .widget:nth-child(3) { animation-delay: calc(var(--t-stagger) * 3); }
  /* Two things to act on, each in words: the batch button, then the link to what others owe. */
  .pair { display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
  .approval-header { display: contents; }
  .pair-cell.waiting-more { order: 1; display: flex; align-items: center; min-height: 32px; color: var(--ink); font: var(--w-regular) var(--s-ui)/1.4 var(--font);
    text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
  .pair-cell.waiting-more:hover { text-decoration-color: var(--ink); }
  .approve-all { min-height: 40px; padding: 0 16px; border: 1px solid var(--ink); border-radius: var(--radius); background: none; color: var(--ink);
    font: var(--w-bold) var(--s-ui)/1.3 var(--font); cursor: pointer; }
  .approve-all:hover:not(:disabled) { background: var(--well); }
  .closed { display: flex; align-items: center; gap: 8px; padding: 4px 6px; color: var(--grey); font: var(--w-regular) var(--s-ui)/1.5 var(--font); }
  .closed .ic { width: 15px; height: 15px; }
  .closed .link-btn { margin-left: auto; }
  #night-sheet .night-done h2 { display: none; }
  #night-sheet .night-done ul { list-style: none; margin: 0; padding: 0; }
  #night-sheet .night-done li { display: grid; gap: 2px; padding: 12px 0; border-top: var(--hair) solid var(--rule); font: var(--w-regular) var(--s-ui)/1.5 var(--font); color: var(--grey); }
  #night-sheet .night-done li b { color: var(--ink); font: var(--w-bold) var(--s-body)/1.4 var(--font); }
  /* Long-quiet promises, folded under the desk: grey words, no red, two quiet buttons per promise. */
  .stale ul { list-style: none; margin: 0; padding: 0; }
  .stale li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px; padding: 8px 0;
    border-top: var(--hair) solid var(--rule); font: var(--w-regular) var(--s-ui)/1.5 var(--font); }
  .stale li:first-child { border-top: 0; padding-top: 0; }
  .stale li > a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-weight: var(--w-bold); }
  .stale :is(.stale-what, .stale-when) { grid-column: 1 / -1; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stale .stale-what { color: var(--ink); }

function route() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ""));
  return { record: params.get("r"), category: params.get("c"), query: params.get("q"), related: params.get("related") || "", heading: params.get("h"),
    view: params.get("view"), project: params.get("project"), reviews: params.has("reviews"),
    ...Object.fromEntries(["find", "agent", "when", "from", "to", "person", "tag", "outcome"].map(key => [key, params.get(key) || ""])) };
}
function railActive() {
  const { record: r, category: c, query, view, reviews } = route();
  const kind = r && r.split("/")[0];
  return reviews ? "reviews" : view === "graph" ? "all" : view || c || (r ? (ACTIVITY.has(kind) ? "activity" : kind) : (query ? "search" : "today"));
}
function scheduleState(s) {
  const state = s.state || "";
  if (/^(?:Not started|Stopped|Not scheduled here)/.test(state)) return "Background updates off";
  if (/^Running in background/.test(state)) return "Nightly updates are on";
  if (/^Background needs attention/.test(state)) return "Background needs attention";
  return state;
}
function nightlyUpdatesOff() {
  return scheduleState(REM.status || {}) === "Background updates off";
}

// One stepped line: runs closer than a few pixels are one stretch at the deepest of their depths.
function nightPath(spans, width) {

    const last = merged.at(-1);
    if (last && span.a - last.b < 6) { last.b = Math.max(last.b, span.b); last.y = Math.max(last.y, span.y); }
    else merged.push({ ...span, b: Math.max(span.b, span.a + 3) });

  return "M0 " + LEVEL.idle + merged.map(span => " H" + span.a.toFixed(1) + " V" + span.y + " H" + span.b.toFixed(1) + " V" + LEVEL.idle).join("") + " H" + (NIGHT_X * 2 + width);

    else clusters.push({ x: Math.min(width - 6, Math.max(14, x(rise.at))), people: [rise.r] });

      + '<circle r="12.5"/><text>' + esc(initials) + "</text>" + (people.length > 1 ? '<text class="plus" x="15" y="-10">+' + (people.length - 1) + "</text>" : "")

// Each promise is its own mark: one setDone over all of them would link unrelated rows as one thread in the
// notebook, so a later Undo of any one would reopen every one. The page is drawn once and says it once: one notice,
// one Undo that reopens only the marks the notebook kept, and for any it refused one Try again for just those.
async function closeAllStale(entries) {
  const marks = entries.map(entry => ({ entry, ...markThread(entry, true) }));
  redrawKeepingScroll();
  document.getElementById("done-notice")?.remove();
  const undo = el("button", { type: "button", text: t("Undo") }), status = el("span", { text: t("Saving…") });
  const notice = el("div", { id: "done-notice", class: "done-notice", role: "status" }, [t("Marked done"), " · ", undo, " · ", status]);
  let undone = false;
  const reopen = list => () => { undone = true; list.forEach(mark => markThread(mark.entry, false)); redrawKeepingScroll(); notice.remove(); focusRaisedCard(); };
  undo.onclick = reopen(marks);
  document.body.appendChild(notice);
  undo.focus({ preventScroll: true });
  noticeLeaves(notice);
  const results = await Promise.all(marks.map(mark => mark.saved));
  const failed = marks.filter((mark, i) => results[i] === "refused");
  failed.forEach(mark => mark.restore());
  undo.onclick = reopen(marks.filter(mark => !failed.includes(mark)));
  // true is the notebook's; false waits on this device; "refused" is not saved, so it never reads as saved.
  status.textContent = t(results.every(result => result === true) ? "Saved in notebook" : failed.length ? "Not saved" : "Saved on this device — sync pending");
  // The refusal is added to this notice (own: null), so the Undo for the marks that were saved stays; once Undo ran
  // there is nothing to try again.
  if (failed.length && !undone) notSavedNotice(() => closeAllStale(failed.map(mark => mark.entry)), null);
  redrawKeepingScroll();
}

function highlight(line, needle) {
  if (!needle) return esc(line);
  const lower = line.toLowerCase();
  const out = [];
  let i = 0, at;
  while ((at = lower.indexOf(needle, i)) !== -1) {
    out.push(esc(line.slice(i, at)), "<mark>", esc(line.slice(at, at + needle.length)), "</mark>");
