<!doctype html>
<!--
  co rem reader. One self-contained file, no network, opened from file://.
  Python embeds a snapshot of the notebook where the placeholder below sits;
  everything after that is a client of the REM object and nothing else, so the
  same client can be served by a local server or a site later without changes.
  Note text is data: it reaches the DOM only through esc() or textContent.

  Design. co rem is named for REM sleep: overnight it consolidates the day's
  mail and coding sessions into pages. The home returns the changed context
  first, then asks the owner to recall an older page. Processing details remain
  available below the memory; a candidate connection stays a question until
  the owner reviews it. Every page opens on what is still open.
  - Palette: cool, blue-biased neutrals ("pillow" paper, "midnight" ink), one
    night blue for links and knowledge, one lamp amber kept for what is owed
    or open. Dark is its own palette, not an inversion.
  - Type: Optima for display only (titles, the night's sentence), Charter for
    page prose, the system UI face for chrome, and the mono face for every
    date, count and id, with tabular numerals.
  - Fonts are local faces on purpose: a page of someone's private notes must
    not phone a font host on open.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>co rem</title>
<style>
  :root {
    color-scheme: light dark;
    /* light: pillow paper, midnight ink, night blue, lamp amber */
    --paper: #f3f4f7;
    --sheet: #ffffff;
    --well: #e9ebf1;
    --ink: #171b2b;
    --ink-2: #585e75;
    --ink-3: #686e86;
    --line: #dcdfe8;
    --line-2: #e8eaf0;
    --blue: #2c3e9e;
    --blue-soft: #e6e9f8;
    --blue-line: #c3caee;
    --lamp: #9a5800;
    --lamp-soft: #fbf0de;
    --lamp-line: #ebcb94;
    --night: #18203f;
    --night-ink: #e7eaf6;
    --night-2: #9fa9d6;
    --night-line: #2c3663;
    --night-lamp: #f2b65e;
    --mark: #fce7b8;
    --mark-ink: #3e2a00;
    --shadow: 0 1px 2px rgba(23, 27, 43, 0.06), 0 6px 24px -12px rgba(23, 27, 43, 0.18);
    --display: Optima, "Optima Nova", Candara, "Segoe UI Variable Display", "Gill Sans", "Noto Sans", sans-serif;
    --text: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, "Songti SC", serif;
    --ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0d101a; --sheet: #141927; --well: #1b2132; --ink: #e3e6f0; --ink-2: #a3aac2; --ink-3: #8088a2;
      --line: #262c3f; --line-2: #1d2233; --blue: #9eaeff; --blue-soft: #1c2347; --blue-line: #2f3a70;
      --lamp: #edb15a; --lamp-soft: #2a2213; --lamp-line: #5a4520; --night: #161d3c; --night-ink: #e7eaf6;
      --night-2: #a5afdc; --night-line: #2b3566; --night-lamp: #f2b65e; --mark: #4a3a12; --mark-ink: #ffe7b0;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 28px -14px rgba(0, 0, 0, 0.7);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0d101a; --sheet: #141927; --well: #1b2132; --ink: #e3e6f0; --ink-2: #a3aac2; --ink-3: #8088a2;
    --line: #262c3f; --line-2: #1d2233; --blue: #9eaeff; --blue-soft: #1c2347; --blue-line: #2f3a70;
    --lamp: #edb15a; --lamp-soft: #2a2213; --lamp-line: #5a4520; --night: #161d3c; --night-ink: #e7eaf6;
    --night-2: #a5afdc; --night-line: #2b3566; --night-lamp: #f2b65e; --mark: #4a3a12; --mark-ink: #ffe7b0;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 28px -14px rgba(0, 0, 0, 0.7);
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--ui); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 2px; }
  code { font: 0.86em var(--mono); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  svg.moon { width: 11px; height: 11px; flex-shrink: 0; color: var(--blue); vertical-align: -1px; }

  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

  /* ---- rail: quiet chrome, the notebook's spine ---- */
  .rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 16px 18px 20px; border-right: 1px solid var(--line); background: var(--paper); display: flex; flex-direction: column; gap: 18px; }
  .brand { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; align-items: center; color: var(--ink); text-decoration: none !important; }
  .brand svg { width: 26px; height: 26px; grid-row: span 2; }
  .brand .name { font: 600 19px/1 var(--display); letter-spacing: 0.02em; }
  .brand .sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px/1.4 var(--mono); color: var(--ink-3); margin-top: 3px; }

  .search { position: relative; }
  .search input { width: 100%; padding: 8px 30px 8px 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--ink); font: 13.5px var(--ui); }
  .search input::-webkit-search-decoration,
  .search input::-webkit-search-cancel-button,
  .search input::-webkit-search-results-button,
  .search input::-webkit-search-results-decoration { display: none; -webkit-appearance: none; }
  .search input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }
  .search input::placeholder { color: var(--ink-3); }
  .search .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; fill: none; stroke: var(--ink-3); stroke-width: 2; pointer-events: none; }
  .search .kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 11px var(--mono); color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; pointer-events: none; }
  .search input:not(:placeholder-shown) ~ .kbd { display: none; }
  .search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 2px 6px; font-size: 13px; color: var(--ink-3); cursor: pointer; border-radius: 4px; display: none; line-height: 1; }
  .search-clear:hover { color: var(--ink); background: var(--well); }
  .search input:not(:placeholder-shown) + .search-clear { display: block; }

  nav { display: flex; flex-direction: column; gap: 1px; }
  nav .label { font: 500 10.5px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin: 4px 0 6px 10px; }
  nav a { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 10px; border-radius: 5px; color: var(--ink-2); font-size: 14px; position: relative; }
  nav a:hover { background: var(--well); color: var(--ink); text-decoration: none; }
  nav a.active { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
  nav a.active::before { content: ""; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px; border-radius: 2px; background: var(--blue); }
  nav a .n { font: 11.5px var(--mono); color: var(--ink-3); }
  nav a .n.zero { opacity: 0.5; }
  nav a .n.open { color: var(--lamp); }
  nav .gap { height: 10px; }

  .rail .foot { margin-top: auto; font: 11px/1.6 var(--mono); color: var(--ink-3); display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  .theme-switch { display: inline-flex; background: var(--well); border-radius: 6px; padding: 2px; gap: 2px; align-self: flex-start; }
  .theme-btn { background: none; border: none; padding: 3px 9px; font: 11.5px var(--ui); color: var(--ink-2); border-radius: 4px; cursor: pointer; }
  .theme-btn:hover { color: var(--ink); }
  .theme-btn.active { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  .privacy-tag { font: 10px var(--mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 0 5px; margin: 0 2px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-3); background: var(--well); white-space: nowrap; }
  .privacy-tag.sensitive { border-color: var(--ink-3); color: var(--ink); font-weight: 600; }
  :root.hide-private .private, :root.hide-private li.private-item { display: none; }
  :root.hide-private .privacy-only .privacy-content { display: none; }
  .private-hidden-notice { display: none; }
  :root.hide-private .private-hidden-notice { display: block; }

  /* ---- main ---- */
  main { min-width: 0; width: 100%; overflow-wrap: anywhere; padding: 40px 56px 96px; max-width: 1180px; }
  main:focus { outline: none; }
  .eyebrow { font: 11.5px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .eyebrow a { color: var(--blue); }
  .eyebrow .sep { color: var(--line); }
  .eyebrow .when { text-transform: none; letter-spacing: 0; }
  h1 { font: 500 36px/1.1 var(--display); letter-spacing: -0.01em; margin: 0 0 12px; text-wrap: balance; color: var(--ink); }
  .lede { color: var(--ink-2); font-size: 15.5px; margin: 0 0 32px; max-width: 64ch; }
  .lede b { color: var(--ink); font-weight: 600; }
  h2.section { font: 500 24px/1.2 var(--display); margin: 52px 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  h2.section .n { font: 11.5px var(--mono); color: var(--ink-3); text-align: right; font-weight: 400; }
  h2.section .n a { color: var(--ink-2); }
  .section-sub { color: var(--ink-3); font-size: 13.5px; margin: 0 0 14px; }

  /* status: a moon phase, full when investigated */
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font: 500 11px/1.6 var(--mono); letter-spacing: 0.02em; text-transform: none; background: var(--blue-soft); color: var(--blue); white-space: nowrap; }
  .pill.status.mapped { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); }
  .pill.status.mapped svg.moon { color: var(--ink-3); }
  .pill.quiet { background: var(--well); color: var(--ink-2); }
  .pill.warn { background: var(--lamp-soft); color: var(--lamp); }

  /* ---- the night: the home's one loud thing ---- */
  .night { position: relative; margin: 8px 0 8px; padding: 26px 28px 22px; border-radius: 10px; background: var(--night); color: var(--night-ink); overflow: hidden; box-shadow: var(--shadow); }
  .night::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background-image: radial-gradient(1px 1px at 12% 22%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 31% 12%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 57% 26%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 78% 9%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 91% 31%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 44% 6%, #fff 50%, transparent 51%); }
  .night > * { position: relative; }
  .night .kicker { font: 11.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--night-2); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .night .kicker svg { width: 14px; height: 14px; color: var(--night-lamp); }
  .night .thesis { font: 400 27px/1.25 var(--display); margin: 10px 0 18px; max-width: 30ch; text-wrap: balance; }
  .night .thesis b { font-weight: 600; color: #fff; }
  .night .stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0 0 16px; }
  .night .stat .v { font: 500 22px/1 var(--mono); color: #fff; }
  .night .stat .k { font: 11px var(--mono); color: var(--night-2); margin-top: 4px; letter-spacing: 0.04em; }
  .night .stat.warn .v { color: var(--night-lamp); }
  .hypno { position: relative; height: 104px; margin: 6px 0 4px; }
  .hypno svg { display: block; width: 100%; height: 84px; overflow: visible; }
  .hypno .grid { stroke: var(--night-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .hypno .trace { fill: none; stroke: #c9d0f5; stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .hypno .area { fill: #c9d0f5; opacity: 0.13; }
  .hypno .day { position: absolute; top: 88px; padding-left: 4px; font: 10px var(--mono); color: var(--night-2); white-space: nowrap; }
  .hypno .dot { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.12); }
  .hypno .dot.woke { background: var(--night-lamp); box-shadow: 0 0 0 3px rgba(242,182,94,0.18); }
  .night .legend { font: 10.5px var(--mono); color: var(--night-2); display: flex; gap: 16px; flex-wrap: wrap; }
  .night .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .night .changes { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--night-line); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
  .night .changes .k { font: 11px var(--mono); color: var(--night-2); margin-right: 4px; letter-spacing: 0.04em; }
  .night .changes a { color: var(--night-ink); font-size: 13.5px; padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px var(--night-line); }
  .night .changes a:hover { background: rgba(255,255,255,0.14); text-decoration: none; }
  .night code { font: 12px var(--mono); color: #fff; background: rgba(255,255,255,0.08); padding: 2px 7px; border-radius: 4px; }
  .night p { margin: 0; color: var(--night-2); font-size: 14px; }

  /* Morning recall: the foreground is what the notebook retained, not its run log. */
  .morning { position: relative; isolation: isolate; overflow: hidden; margin: 20px 0 0; padding: 32px; border-radius: 16px; background: #111931; color: #f4f5fb; box-shadow: 0 18px 48px -30px rgba(12, 20, 48, .55); }
  .morning::before { content: ""; position: absolute; z-index: -1; width: 500px; height: 500px; right: -185px; top: -340px; border: 1px solid rgba(163, 181, 255, .35); border-radius: 50%; box-shadow: 0 0 0 70px rgba(134, 157, 255, .035), 0 0 0 140px rgba(134, 157, 255, .025); pointer-events: none; }
  .morning-top { display: flex; justify-content: space-between; gap: 18px; align-items: start; border-bottom: 1px solid rgba(194, 205, 255, .18); padding-bottom: 22px; }
  .morning-kicker { display: block; color: #aab7e8; font: 600 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .13em; }
  .morning h2 { max-width: 22ch; font: 400 clamp(28px, 3vw, 42px)/1.12 var(--display); letter-spacing: -.02em; margin: 9px 0 0; text-wrap: balance; }
  .morning-time { flex-shrink: 0; color: #b3bfed; font: 11px/1.5 var(--mono); }
  .first-map-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .first-map-actions a, .first-map-actions button { display: inline-flex; align-items: center; min-height: 44px; padding: 9px 14px; border: 1px solid rgba(194, 205, 255, .42); border-radius: 7px; background: transparent; color: #f4f5fb; font: 600 13px var(--ui); text-decoration: none; cursor: pointer; }
  .first-map-actions a { background: #f4f5fb; color: #111931; }
  .first-map-held { margin: 16px 0 0; color: #b3bfed; font-size: 12.5px; }
  .memory-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
  .memory-card { min-width: 0; padding: 24px 22px 12px 0; }
  .memory-card + .memory-card { border-left: 1px solid rgba(194, 205, 255, .18); padding-left: 22px; }
  .memory-card .kind { color: #b3bfed; font: 10px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .1em; }
  .memory-card h3 { font: 500 20px/1.25 var(--display); margin: 9px 0 10px; }
  .memory-card h3 a, .memory-card .open { color: #fff; }
  .memory-card p { margin: 0 0 12px; color: #d4daf2; font: 15px/1.5 var(--text); }
  .memory-card .open { display: inline-block; font: 12px var(--ui); text-decoration: underline; text-underline-offset: 4px; }
  .memory-empty { margin: 22px 0 0; color: #c8d0ed; font: 16px/1.5 var(--text); }
  .memory-connection { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; border-top: 1px solid rgba(194, 205, 255, .18); padding-top: 17px; margin-top: 8px; font-size: 13px; }
  .memory-connection .label { color: #b3bfed; font: 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .memory-connection a { color: #fff; }
  .memory-connection .relation { color: #aab7e8; }
  .memory-connection .basis { color: #b3bfed; }
  .recall { margin-top: 22px; padding: 23px 27px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 24px; align-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; }
  .recall .label { font: 600 10px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }
  .recall h2 { grid-column: 1; font: 500 23px/1.28 var(--display); margin: 6px 0; }
  .recall .why { grid-column: 1; color: var(--ink-2); font-size: 13px; margin: 0; }
  .recall-toggle { grid-column: 2; grid-row: 1 / span 3; align-self: center; min-height: 44px; border: 1px solid var(--blue-line); background: var(--blue-soft); color: var(--blue); border-radius: 7px; padding: 10px 14px; font: 600 13px var(--ui); cursor: pointer; }
  .recall-toggle:hover { border-color: var(--blue); }
  .recall-answer { grid-column: 1 / -1; border-top: 1px solid var(--line); margin-top: 16px; padding-top: 15px; }
  .recall-answer[hidden] { display: none; }
  .recall-answer p { font: 16px/1.5 var(--text); margin: 0 0 7px; }
  .recall-answer a { font-size: 13px; }
  .connection-review { margin-top: 14px; padding: 20px 27px; border: 1px solid var(--blue-line); background: var(--blue-soft); border-radius: 12px; }
  .connection-review .label { font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }
  .connection-review h2 { font: 500 20px/1.3 var(--display); margin: 7px 0; }
  .connection-review p { margin: 0 0 10px; color: var(--ink-2); font-size: 13px; }
  .connection-review .subjects { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; }
  .night-details { margin-top: 60px; border-top: 1px solid var(--line); padding-top: 10px; }
  .night-details > summary { cursor: pointer; color: var(--ink-2); font: 13px var(--ui); padding: 8px 0; }
  .night-details .night { margin-top: 10px; }

  /* ---- this week: what was rewritten ---- */
  .week { list-style: none; padding: 0; margin: 10px 0 0; border-top: 1px solid var(--line); }
  .week li { display: grid; grid-template-columns: 64px 14px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
  .week .d { font-size: 11.5px; color: var(--ink-3); text-align: right; }
  .week .w { display: flex; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
  .week .w a { color: var(--ink); font-weight: 600; }
  .week .meta { font-size: 12px; color: var(--ink-3); }
  .week .s { flex-basis: 100%; font: 14px/1.45 var(--text); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* ---- open threads: who owes whom ---- */
  .bands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; margin-top: 12px; }
  .bands > .band:last-child:nth-child(3) { grid-column: 1 / -1; }
  .band h3 { display: flex; justify-content: space-between; align-items: baseline; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
  .band .threads .thread { grid-template-columns: 76px minmax(0, 1fr) auto; padding: 11px 14px; }
  .band-none { color: var(--ink-3); font-size: 13.5px; margin: 8px 0 0; }
  .thread .when.today { color: var(--sheet); background: var(--lamp); padding: 0 5px; border-radius: 3px; }
  @media (max-width: 1100px) { .bands { grid-template-columns: minmax(0, 1fr); } }
  .threads { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .thread { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; padding: 12px 16px; background: var(--sheet); border: 1px solid var(--line); border-left: 3px solid var(--lamp); border-radius: 4px 8px 8px 4px; }
  .thread.theirs { border-left-color: var(--blue); }
  .thread.plain { border-left-color: var(--ink-3); }
  .dir { font: 600 10.5px/1.7 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lamp); white-space: nowrap; }
  .thread.theirs .dir { color: var(--blue); }
  .thread.plain .dir { color: var(--ink-3); }
  .thread .what { font: 15px/1.5 var(--text); color: var(--ink); }
  .thread .who { font-size: 13px; color: var(--ink-2); margin-top: 3px; font-family: var(--ui); }
  .thread .when { font: 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; }

  /* ---- rows: a page as one line of what it knows ---- */
  .hits { list-style: none; margin: 0; padding: 0; max-width: 80ch; border-top: 1px solid var(--line); }
  .hits.cols { max-width: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
  .hits > li { padding: 13px 0 14px; border-bottom: 1px solid var(--line); min-width: 0; }
  .hits .t { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .hits .t > span:first-child { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .hits .t a { color: var(--ink); font-weight: 600; font-size: 15px; }
  .hits .t a:hover { color: var(--blue); }
  .hits .t .meta { font-size: 12.5px; color: var(--ink-3); }
  .hits .when { font: 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; }
  .hits .hit { margin-top: 4px; color: var(--ink-2); font: 14.5px/1.5 var(--text); }
  .hits .hit.ui { font-family: var(--ui); font-size: 13px; }
  .hits .open { color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
  .hits .open .k { flex-shrink: 0; font: 600 10px/1.9 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lamp); background: var(--lamp-soft); padding: 0 6px; border-radius: 3px; }
  .hits .eyebrow { margin-bottom: 4px; }
  .usage { display: flex; align-items: center; gap: 10px; margin-top: 6px; font: 11.5px var(--mono); color: var(--ink-3); }
  .usage .bar { width: 120px; height: 4px; border-radius: 2px; background: var(--well); overflow: hidden; flex-shrink: 0; }
  .usage .bar i { display: block; height: 100%; background: var(--blue); border-radius: 2px; }
  mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 2px; }

  /* the home's quick entry: one shelf per kind of page */
  .shelves { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px 40px; margin-top: 14px; }
  .shelf h3 { font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; padding-bottom: 7px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .shelf h3 a { color: inherit; }
  .shelf .ask { font: italic 13.5px/1.4 var(--text); color: var(--ink-3); margin: 0 0 6px; }
  .toc { list-style: none; margin: 0; padding: 0; }
  .toc li { padding: 4px 0; font-size: 14px; line-height: 1.4; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .toc li > a:first-of-type { color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc li > a:hover { color: var(--blue); }
  .toc .when, .toc .path-hint { margin-left: auto; font: 11px var(--mono); color: var(--ink-3); white-space: nowrap; flex-shrink: 0; }
  .toc .path-hint { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .toc .more { color: var(--blue); font-size: 13px; }

  /* the engine room: maintenance, kept below everything */
  .maint { margin-top: 64px; border-top: 1px solid var(--line); padding-top: 8px; }
  .maint > summary { cursor: pointer; list-style: none; padding: 10px 0; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  .maint > summary::-webkit-details-marker { display: none; }
  .maint > summary h2 { font: 500 18px var(--display); margin: 0; display: inline; }
  .maint > summary .n { font: 11.5px var(--mono); color: var(--ink-3); }
  .maint > summary::after { content: "+"; font: 16px var(--mono); color: var(--ink-3); }
  .maint[open] > summary::after { content: "−"; }
  .maint .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px 22px; margin: 6px 0 16px; }
  .maint .k { font: 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .maint .v { font: 500 16px var(--mono); margin-top: 3px; }
  .maint .state { font-size: 14px; color: var(--ink-2); margin: 4px 0 14px; max-width: 72ch; }
  table.runs { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); }
  table.runs th { text-align: left; font-weight: 500; color: var(--ink-3); padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.runs td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
  table.runs td:first-child { color: var(--ink); }

  /* ---- a page ---- */
  .page-head { margin-bottom: 26px; }
  .standfirst { font: 400 20px/1.55 var(--text); color: var(--ink); margin: 6px 0 0; max-width: 62ch; }
  .page-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 56px; }
  .page-grid > .side { margin: 26px 0 0; max-width: 66ch; }
  .panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font-size: 13px; }
  .panel + .panel { margin-top: 12px; }
  .panel h3 { font: 600 10.5px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
  .panel dl { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px 10px; margin: 0; }
  .panel dt { color: var(--ink-3); font-size: 12px; }
  .panel dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .panel dd.mono, .panel dd .mono { font-size: 12px; }
  .unk { color: var(--ink-3); opacity: 0.7; }
  .bigstat { display: flex; align-items: baseline; gap: 8px; }
  .bigstat .v { font: 500 30px/1 var(--mono); color: var(--ink); }
  .bigstat .k { font-size: 12.5px; color: var(--ink-3); }
  .panel .usage { margin-top: 10px; }
  .panel .usage .bar { width: 100%; height: 6px; }
  .panel p { margin: 8px 0 0; color: var(--ink-2); }

  .note { max-width: 66ch; font: 16.5px/1.68 var(--text); color: var(--ink); }
  .note p { margin: 0 0 1em; }
  .note > h2 { font: 500 24px/1.25 var(--display); margin: 2.1em 0 0.6em; position: relative; display: flex; align-items: baseline; gap: 10px; }
  .note > h2::after { content: ""; flex: 1; height: 1px; background: var(--line); transform: translateY(-5px); }
  .note > h2:first-child { margin-top: 0; }
  .note h3 { font: 600 16px/1.3 var(--ui); margin: 1.5em 0 0.4em; position: relative; }
  .note h4, .note h5, .note h6 { font: 600 14.5px/1.3 var(--ui); margin: 1.3em 0 0.4em; }
  .heading-anchor { opacity: 0; font: 400 13px var(--mono); color: var(--ink-3); text-decoration: none !important; }
  .note :is(h2,h3,h4):hover .heading-anchor, .heading-anchor:focus-visible { opacity: 1; }
  .heading-anchor:hover { color: var(--blue); }
  .note ul, .note ol { padding-left: 1.25em; margin: 0 0 1em; }
  .note li { margin: 0.3em 0; }
  .note li > p { margin-bottom: 0.25em; }
  .note li > ul, .note li > ol { margin-bottom: 0.5em; }
  .note li::marker { color: var(--ink-3); }
  .note li.unknown-item, .note p.unknown-item { color: var(--ink-3); font-style: italic; font-size: 15px; }
  .note strong { font-weight: 700; }
  .note code { background: var(--well); padding: 1px 5px; border-radius: 3px; font-size: 0.82em; }
  .note blockquote { margin: 0 0 1em; padding: 2px 18px; border-left: 2px solid var(--blue-line); color: var(--ink-2); font-style: italic; }
  .note hr { border: 0; border-top: 1px solid var(--line); margin: 1.8em 0; }
  .note table { border-collapse: collapse; font: 14px/1.45 var(--ui); }
  .note th, .note td { border-bottom: 1px solid var(--line); padding: 7px 14px 7px 0; text-align: left; vertical-align: top; }
  .note th { font: 600 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .table-scroll { max-width: 100%; overflow-x: auto; margin-bottom: 1.2em; }
  .table-scroll table { margin-bottom: 0; min-width: 100%; }
  .table-scroll th, .table-scroll td { min-width: 120px; }
  .note :is(h2,h3,h4,h5,h6), .note [id^="src-"] { scroll-margin-top: 24px; }

  /* citations: a small chip that names its source on hover or focus */
  .cite { display: inline-block; position: relative; vertical-align: super; font: 600 9.5px/1 var(--mono); color: var(--blue); background: var(--blue-soft); border-radius: 3px; padding: 2px 3px 1px; margin: 0 1px; text-decoration: none !important; }
  .cite:hover, .cite:focus-visible { background: var(--blue); color: var(--sheet); }
  .cite[data-tip]:hover::after, .cite[data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; z-index: 5; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); width: max-content; max-width: min(340px, 80vw); padding: 7px 10px; border-radius: 6px; background: var(--ink); color: var(--paper); font: 400 12px/1.45 var(--ui); white-space: pre-line; text-align: left; box-shadow: var(--shadow); }

  /* open threads on a page: the visual centre */
  .block-threads { margin: 0 0 8px; }
  .note .threads, .note .timeline, .note .block-sources ol { padding-left: 0; }
  .thread .when:empty { display: none; }
  .block-threads .threads { margin-bottom: 1em; }
  .calm { display: flex; gap: 10px; align-items: baseline; padding: 11px 16px; border-radius: 8px; background: var(--well); color: var(--ink-2); font-size: 15px; margin-bottom: 1em; }
  .calm .dir { color: var(--ink-3); }

  /* history: a dated spine */
  .timeline { list-style: none; margin: 0 0 1.2em; padding: 0; position: relative; }
  .timeline li { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 0; margin: 0; padding: 0 0 12px; position: relative; }
  .timeline li::before { content: ""; position: absolute; left: 101px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--sheet); box-shadow: 0 0 0 1.5px var(--blue); }
  .timeline li::after { content: ""; position: absolute; left: 104px; top: 20px; bottom: -2px; width: 1px; background: var(--line); }
  .timeline li:last-child::after { display: none; }
  .timeline .d { font: 12px/1.9 var(--mono); color: var(--ink-3); text-align: right; padding-right: 20px; white-space: nowrap; }
  .timeline .e { padding-left: 18px; font-size: 15.5px; line-height: 1.55; }
  .timeline li.undated .d { visibility: hidden; }
  .timeline li.undated::before { box-shadow: 0 0 0 1.5px var(--line); }

  /* sources: a compact footnote list */
  .block-sources ol { list-style: none; padding: 0; margin: 0 0 1em; font: 13px/1.5 var(--ui); color: var(--ink-2); }
  .block-sources li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line-2); margin: 0; }
  .block-sources li:target, .block-sources li.flash { background: var(--blue-soft); }
  .dead-link { color: var(--ink-3); text-decoration: line-through dotted; cursor: help; }
  .block-sources .n { font: 600 11px/1.9 var(--mono); color: var(--blue); }
  .block-sources .source-open { display: inline-flex; min-width: 44px; min-height: 44px; align-items: center; justify-content: center; vertical-align: baseline; font: 600 11px var(--mono); }
  .block-sources .id { font: 11.5px var(--mono); color: var(--ink); }

  /* where it stands: a status block */
  .block-standing { border-left: 2px solid var(--blue); padding: 2px 0 2px 18px; margin-bottom: 1.2em; }
  .block-standing ul { list-style: none; padding: 0; }
  .block-standing li + li { margin-top: 0.6em; }

  /* code and diagrams: a plate */
  .code-block { position: relative; margin: 0 0 1.3em; }
  .note pre { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; overflow-x: auto; font: 12.5px/1.55 var(--mono); max-width: 100%; tab-size: 4; margin: 0; color: var(--ink); }
  .code-block.diagram pre { background-color: var(--sheet); background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 14px 14px; background-position: 7px 7px; padding: 22px 22px 20px; }
  .code-block .cap { position: absolute; left: 12px; top: -8px; font: 600 9.5px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); background: var(--paper); padding: 3px 6px; border-radius: 3px; }
  .note pre code { background: none; padding: 0; font: inherit; white-space: pre; overflow-wrap: normal; }
  .code-copy { position: absolute; top: 8px; right: 8px; font: 11px var(--mono); color: var(--ink-2); background: var(--sheet); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; opacity: 0; cursor: pointer; }
  .code-block:hover .code-copy, .code-copy:focus-visible { opacity: 1; }

  /* guidance, not error: what is not known yet and the command that fills it */
  .missing, .empty { max-width: 66ch; margin-top: 34px; padding: 16px 18px 16px 20px; border-radius: 8px; background: var(--sheet); border: 1px dashed var(--blue-line); color: var(--ink-2); font-size: 14px; line-height: 1.6; position: relative; }
  .empty { margin-top: 10px; }
  .missing .lead, .empty .lead { display: block; font: 600 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue); margin-bottom: 4px; }
  .missing:not(.primary) { padding: 10px 14px; border-style: dashed; background: transparent; font-size: 13px; }
  .missing:not(.primary) .names { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-3); }
  .missing:not(.primary) .cmd { margin-top: 6px; }
  .missing.primary { margin: 0 0 30px; border: 1px solid var(--blue-line); background: var(--blue-soft); padding: 20px 22px; }
  .missing.primary .lead { font-size: 11px; }
  .missing.primary .why { margin: 4px 0 8px; font: 16px/1.5 var(--text); color: var(--ink); }
  .missing.primary .names { color: var(--ink-2); font-size: 13px; }
  .btn-primary { min-height: 44px; font: 600 13px var(--ui); color: var(--sheet); background: var(--blue); border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  .btn-primary:hover { filter: brightness(1.1); }
  .missing .cmd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .missing.primary .cmd { margin-top: 0; }
  .missing code, .empty code { font: 12.5px var(--mono); color: var(--ink); background: var(--well); border-radius: 4px; padding: 3px 8px; overflow-wrap: anywhere; }
  .aside { max-width: 66ch; margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px 18px; font-size: 14px; }
  .aside .k { font: 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding-top: 4px; }
  .aside .related a { display: inline-block; margin: 0 14px 6px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 11.5px var(--mono); color: var(--ink-2); background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
  .chip .d { color: var(--ink-3); margin-left: 6px; }
  .page-foot { max-width: 66ch; margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line-2); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn-action, .eyebrow-path { font: 12px var(--ui); color: var(--ink-2); background: var(--sheet); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  .eyebrow-path { font: 11.5px var(--mono); }
  .btn-action:hover, .eyebrow-path:hover { color: var(--blue); border-color: var(--blue-line); }
  .btn-action.done { color: var(--blue); border-color: var(--blue-line); background: var(--blue-soft); }
  details.copies { margin: 0 0 20px; font-size: 14px; }
  details.copies summary { cursor: pointer; color: var(--ink-2); }
  details.copies p { margin: 6px 0 0 16px; font: 12px var(--mono); }

  /* search: the best match answers, the rest grouped */
  .best { max-width: 80ch; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin: 0 0 10px; box-shadow: var(--shadow); }
  .best-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 12px; }
  .best-head .lead { font: 600 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue); }
  .best-head a { font: 500 21px var(--display); color: var(--ink); }
  .best-facts { display: grid; grid-auto-flow: column; grid-template-rows: auto auto; gap: 3px 22px; margin: 0; justify-content: start; }
  .best-facts dt { font: 600 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .best-facts dd { margin: 0; font: 13px var(--mono); overflow-wrap: anywhere; }
  .best-facts dd.none { color: var(--ink-3); font-family: var(--ui); }
  .best-open { margin-top: 12px; display: flex; gap: 8px; align-items: baseline; font: 14.5px var(--text); }
  .best-open .dir { flex-shrink: 0; padding: 0 6px; border-radius: 3px; background: var(--lamp-soft); }
  h2.section.group { font-size: 17px; margin: 28px 0 8px; }
  nav a.you { margin-bottom: 10px; background: var(--sheet); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; color: var(--ink); }
  nav a.you > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  nav a.you .n { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 11.5px var(--ui); }
  @media (max-width: 820px) { .best-facts { grid-auto-flow: row; grid-template-rows: none; grid-template-columns: 96px minmax(0, 1fr); } }

  /* questions & connections */
  .review { max-width: 72ch; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .review h2 { font: 500 19px/1.3 var(--display); margin: 0 0 6px; }
  .review .basis { font-size: 13.5px; color: var(--ink-2); margin: 0 0 8px; }
  .review .subjects a { margin-right: 14px; font-size: 14px; }
  .review .response { font: italic 15px var(--text); color: var(--ink-2); margin: 8px 0 0; }
  .review .note { margin-top: 10px; font-size: 14px; }
  .review button { font: 12px var(--ui); color: var(--ink-2); background: var(--sheet); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; cursor: pointer; margin-bottom: 6px; }

  .nav-toggle { display: none; }
  .mobile-status { display: none; }
  .skip { position: absolute; left: 16px; top: -80px; z-index: 2; background: var(--sheet); padding: 10px; }
  .skip:focus { top: 8px; }
  .mobile-back { display: none; margin-bottom: 14px; }
  .mobile-back a { font-size: 13.5px; color: var(--ink-2); }

  /* ---- the sheet: a page per row, facts in columns ---- */
  main.wide { max-width: none; }
  .sheet-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 12px; }
  .sheet-find { flex: 0 1 260px; min-width: 0; padding: 7px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--ink); font: 13.5px var(--ui); }
  .sheet-find:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .seg button { font: 12.5px var(--ui); color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
  .seg button .n { font: 11px var(--mono); color: var(--ink-3); }
  .seg button:hover { border-color: var(--blue-line); color: var(--ink); }
  .seg button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .seg button.on .n { color: var(--paper); opacity: 0.7; }
  .sheet-count { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
  .held-note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: -18px 0 20px; color: var(--ink-3); font-size: 12.5px; }
  .held-note button { min-height: 44px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--ink-2); font: 600 12px var(--ui); cursor: pointer; }
  .sheet-scroll { overflow: auto; max-height: calc(100vh - 150px); border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); }
  table.sheet { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
  .sheet th { position: sticky; top: 0; z-index: 2; background: var(--well); text-align: left; padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .sheet th button { all: unset; box-sizing: border-box; display: flex; gap: 6px; align-items: center; width: 100%; padding: 9px 12px; font: 600 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); cursor: pointer; }
  .sheet th button:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  .sheet th .arrow { color: var(--ink-3); opacity: 0.6; font-size: 11px; }
  .sheet th[aria-sort="ascending"] .arrow, .sheet th[aria-sort="descending"] .arrow { color: var(--blue); opacity: 1; }
  .sheet th.num button { justify-content: flex-end; }
  .sheet td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; color: var(--ink); max-width: 260px; min-width: 120px; overflow-wrap: normal; word-break: normal; }
  .sheet td.num { min-width: 0; }
  .sheet .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 200px; }
  .sheet td.wide .clamp { max-width: 360px; }
  .sheet tbody tr { cursor: pointer; }
  .sheet tbody tr:hover td { background: var(--blue-soft); }
  .sheet tbody tr:last-child td { border-bottom: 0; }
  .sheet td.num { text-align: right; white-space: nowrap; }
  .sheet td.mono-col { white-space: nowrap; font-size: 12px; }
  .sheet td.wide { min-width: 240px; max-width: 380px; color: var(--ink-2); }
  .sheet .name { position: sticky; left: 0; z-index: 1; background: var(--sheet); min-width: 220px; max-width: 300px; box-shadow: inset -1px 0 0 var(--line-2); }
  .sheet th.name { z-index: 3; background: var(--well); }
  .name-cell { display: flex; flex-direction: column; gap: 2px; }
  .name-cell .nm { display: flex; align-items: center; gap: 7px; font-weight: 600; }
  .name-cell .nm a { color: var(--ink); }
  .mobile-status-label { display: none; }
  .name-cell .sum { font-size: 12.5px; color: var(--ink-3); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sheet .open-col { min-width: 220px; max-width: 320px; }
  .open-cell { display: flex; gap: 7px; align-items: baseline; }
  .open-cell .dir { font-size: 9.5px; padding: 0 5px; border-radius: 3px; background: var(--lamp-soft); }
  .open-cell.theirs .dir { background: var(--blue-soft); }
  .open-cell.plain .dir { background: var(--well); }
  .open-cell .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .open-cell .more { font: 11px var(--mono); color: var(--ink-3); }
  .sheet td.none { text-align: center; color: var(--ink-3); padding: 28px; cursor: default; }

  /* People at 1440: every column fits (main 1136px); narrower, the sheet scrolls inside itself. */
  @media (min-width: 821px) { main.wide { padding-left: 28px; padding-right: 28px; } }
  .sheet th button { padding: 9px 9px; }
  .sheet td { padding: 8px 9px; min-width: 0; font-size: 13px; }
  .sheet .name { min-width: 180px; max-width: 200px; width: 190px; }
  .sheet .c-open { min-width: 220px; max-width: 250px; width: 240px; }
  .sheet .c-company, .sheet .c-role { min-width: 92px; max-width: 112px; }
  .sheet .c-company .clamp, .sheet .c-role .clamp { max-width: 112px; }
  .sheet .c-email { max-width: 140px; }
  .sheet .trunc { display: block; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .c-phone { min-width: 128px; }
  .sheet .c-phone .mono { white-space: nowrap; }
  .open-cell { flex-wrap: wrap; row-gap: 2px; }
  .open-cell .txt { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; flex-basis: 100%; }
  .name-cell .st { display: inline-flex; }
  /* A cut edge says so: a shadow where more columns wait to the right. */
  .sheet-box { position: relative; }
  .sheet-box::after { content: ""; position: absolute; right: 1px; bottom: 1px; top: var(--sheet-top, 0); width: 28px; pointer-events: none; border-radius: 0 8px 8px 0; background: linear-gradient(to right, transparent, rgba(23, 27, 43, 0.12)); opacity: 0; transition: opacity 150ms; }
  .sheet-box.clip-right::after { opacity: 1; }

  /* ---- under the title: what is open, how long, when you last spoke ---- */
  .leadrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 16px 0 0; }
  .leadrow:empty { display: none; }
  .lead-open { display: inline-flex; align-items: baseline; gap: 9px; max-width: 100%; padding: 7px 12px; border-radius: 6px; background: var(--lamp-soft); box-shadow: inset 3px 0 0 var(--lamp); color: var(--ink); text-decoration: none !important; }
  .lead-open.theirs { background: var(--blue-soft); box-shadow: inset 3px 0 0 var(--blue); }
  .lead-open.plain { background: var(--well); box-shadow: inset 3px 0 0 var(--ink-3); }
  .lead-open .txt { font: 14.5px var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
  .lead-open .age { font-size: 12px; color: var(--lamp); font-weight: 600; white-space: nowrap; }
  .lead-open.theirs .age { color: var(--blue); }
  .lead-open .age.today { background: var(--lamp); color: var(--sheet); padding: 0 5px; border-radius: 3px; }
  .lead-open .more { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .lead-calm { font: 600 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); background: var(--well); padding: 5px 9px; border-radius: 4px; }
  .lead-meta { font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 8px; }
  .lead-meta .k { color: var(--ink-3); }
  .lead-meta.usage .bar { width: 120px; height: 5px; border-radius: 3px; background: var(--well); overflow: hidden; display: inline-block; }
  .lead-meta.usage .bar i { display: block; height: 100%; background: var(--blue); }
  .unsure { font-size: 12.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 2px; }
  .unsure::first-letter { font: 700 11px var(--mono); }
  .unsure { border: 1px dashed var(--line); border-radius: 999px; padding: 1px 9px; }

  /* ---- insight: the lines your inbox could not tell you ---- */
  .insight { list-style: none; padding: 0 !important; margin: 0 0 1em; display: grid; gap: 10px; }
  .insight li { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 12px; align-items: baseline; margin: 0; }
  .insight .badge { font: 600 10px/1.9 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; text-align: center; border-radius: 3px; background: var(--blue-soft); color: var(--blue); }
  .insight .ins-at-stake .badge { background: var(--lamp-soft); color: var(--lamp); }
  .insight .ins-changed .badge { background: var(--well); color: var(--ink); }
  .insight .ins-pattern .badge { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }

  /* ---- facts: a definition list, empty fields visible (#2068) ---- */
  .panel .fill { margin: -6px 0 10px; font-size: 11px; color: var(--ink-3); }
  .factlist { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 0; margin: 0; }
  .factlist dt { font: 600 10px/1.5 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); padding: 7px 8px 7px 0; border-top: 1px solid var(--line-2); }
  .factlist dd { margin: 0; padding: 5px 0 6px; border-top: 1px solid var(--line-2); font-size: 13.5px; min-width: 0; overflow-wrap: anywhere; position: relative; display: flex; flex-direction: column; gap: 2px; }
  .factlist dt:first-of-type, .factlist dd:first-of-type { border-top: 0; }
  .factlist dd.none { color: var(--ink-3); opacity: 0.75; font-size: 12.5px; }
  .factlist .val.mono > span:first-child { font: 11.5px var(--mono); }
  .factlist .val.derived { color: var(--ink-2); }
  .factlist .qual { margin-left: 6px; font: 10px var(--mono); color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .factlist .copy { position: absolute; right: 0; top: 5px; font: 10.5px var(--ui); color: var(--ink-3); background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; cursor: pointer; opacity: 0; }
  .factlist dd:hover .copy, .factlist .copy:focus-visible { opacity: 1; }
  .factlist dd:has(.copy) .val { padding-right: 44px; }
  .cite.run { padding: 2px 5px 1px; }

  /* ---- the fact card: what you came for, at a glance (#2068) ---- */
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 18px 0 26px; max-width: 980px; box-shadow: var(--shadow); }
  .fact { background: var(--sheet); padding: 11px 14px 12px; min-width: 0; box-shadow: 1px 1px 0 var(--line); }
  .fact .k { font: 600 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
  .fact .v { font-size: 14.5px; color: var(--ink); overflow-wrap: anywhere; line-height: 1.4; }
  .fact .v.mono { font-size: 13px; }
  .fact.wide { grid-column: span 2; }
  .fact.missing-fact { background: repeating-linear-gradient(135deg, var(--sheet) 0 7px, var(--paper) 7px 8px); }
  .fact.missing-fact .v { color: var(--ink-3); font: italic 13px var(--text); }

  /* The memory surface: answer, connections, and activity before the full note. */
  .record-focus { max-width: 1120px; margin: 8px 0 34px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .scope-note { grid-column: 1 / -1; margin: 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--well); color: var(--ink-2); font: 13px/1.5 var(--ui); }
  .focus-head { grid-column: 1 / -1; min-height: 170px; padding: 26px 32px; border-radius: 16px; color: var(--night-ink); background: var(--night); position: relative; overflow: hidden; }
  .focus-head::after { content: ""; position: absolute; width: 420px; height: 420px; border: 1px solid var(--night-line); border-radius: 50%; right: -100px; top: -296px; box-shadow: 0 0 0 45px rgba(105, 128, 217, .035), 0 0 0 90px rgba(105, 128, 217, .025); pointer-events: none; }
  .focus-kicker { display: block; font: 600 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--night-2); }
  .focus-statement { max-width: 64ch; position: relative; z-index: 1; font: 26px/1.28 var(--display); margin: 16px 0 0; }
  .focus-limit { position: relative; z-index: 1; max-width: 64ch; margin: 12px 0 0; font: 13px/1.5 var(--ui); color: var(--night-2); }
  .focus-statement.clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .focus-next { position: relative; z-index: 1; max-width: 68ch; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--night-line); }
  .focus-next .k { display: block; font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--night-2); }
  .focus-next p { margin: 5px 0 0; font: 15px/1.45 var(--text); }
  .focus-more { position: relative; z-index: 1; border: 0; background: transparent; color: var(--night-ink); cursor: pointer; margin: 4px 0 0; padding: 0; min-height: 44px; font: 600 12px var(--ui); text-decoration: underline; text-underline-offset: 3px; }
  .focus-section.next-exchanges { grid-column: 1 / -1; }
  .project-workspace { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .project-workspace.single { grid-template-columns: 1fr; }
  .project-workspace .focus-section { min-width: 0; }
  .project-workspace p, .project-workspace li { font: 15px/1.5 var(--text); }
  .project-workspace p { margin: 0; }
  .project-workspace ul { margin: 0; padding-left: 18px; }
  .project-workspace li { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .project-workspace .open-note { display: inline-block; margin-top: 12px; font: 600 12px var(--ui); }
  .focus-section { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; min-width: 0; }
  .focus-section h2 { margin: 0 0 14px; font: 600 17px var(--ui); }
  .focus-section .threads { margin: 0; padding: 0; }
  .focus-section .thread { margin: 0 0 8px; }
  .focus-section .thread:last-child { margin-bottom: 0; }
  .focus-facts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding: 14px 20px; margin: 0; background: var(--blue-soft); border: 1px solid var(--blue-line); border-radius: 10px; }
  .focus-fact { min-width: 0; }
  .focus-facts dt { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--blue); }
  .focus-facts dd { margin: 6px 0 0; font-size: 13px; color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .relation-description { font: 13px/1.5 var(--ui); color: var(--ink-2); margin: 0 0 10px; }
  .relation-entry { min-width: 0; }
  .relation-provenance { font: 12px/1.5 var(--ui); color: var(--ink-2); padding: 7px 3px; overflow-wrap: anywhere; }
  .relation-provenance .cite { margin-left: 4px; }
  .relation-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 9px; }
  .relation-card { display: flex; flex-direction: column; gap: 5px; min-width: 0; padding: 11px 13px; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; text-decoration: none !important; transition: border-color .16s ease, transform .16s ease; }
  .relation-card:hover, .relation-card:focus-visible { border-color: var(--blue); transform: translateY(-2px); }
  .relation-card strong { font: 600 14px var(--ui); color: var(--ink); }
  .relation-kind { font: 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--blue); }
  .relation-basis { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font: 13px/1.5 var(--ui); color: var(--ink-2); }
  .more-relations { margin-top: 10px; }
  .more-relations > summary { cursor: pointer; font: 600 14px/1.5 var(--ui); color: var(--blue); min-height: 44px; display: list-item; padding: 11px 0; box-sizing: border-box; }
  .more-relations .relation-list { margin-top: 10px; }
  .related-records { grid-column: 1 / -1; }
  .conversation-view { grid-column: 1 / -1; }
  .conversation-list { display: flex; flex-wrap: wrap; gap: 9px; }
  .conversation-open { flex: 1 1 210px; text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--paper); color: var(--ink); cursor: pointer; }
  .conversation-open:hover, .conversation-open:focus-visible { border-color: var(--blue); }
  .conversation-open strong { display: block; font: 600 14px var(--ui); }
  .conversation-open span { display: block; margin-top: 5px; font: 11px var(--mono); color: var(--ink-3); }
  .conversation-message { border-top: 1px solid var(--line); padding: 14px 0; }
  .conversation-message p { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 15px/1.5 var(--text); }
  .activity-view { grid-column: 1 / -1; }
  .activity-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .activity-note { font: 11px var(--mono); color: var(--ink-3); }
  .activity-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .activity-filters button { font: 12px var(--ui); padding: 6px 10px; background: var(--paper); color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
  .activity-filters button.active { background: var(--night); color: var(--night-ink); border-color: var(--night); }
  .activity-list { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; }
  .activity-list li { display: grid; grid-template-columns: 105px 105px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--line-2); align-items: baseline; }
  .activity-list li[hidden] { display: none; }
  .activity-day { font: 11px var(--mono); color: var(--ink-3); }
  .activity-type { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--blue); }
  .activity-text { font: 14px/1.5 var(--text); }
  .deep-note { max-width: 1120px; border-top: 1px solid var(--line); margin-top: 18px; }
  .deep-head { display: flex; justify-content: space-between; gap: 15px; align-items: baseline; padding: 19px 0 0; }
  .deep-head h2 { margin: 0; font: 600 17px var(--ui); color: var(--ink); }
  .deep-hint { font: 11px var(--mono); color: var(--ink-3); }
  .deep-note .page-grid { padding-top: 22px; }
  .claim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 20px 0; }
  .claim-grid.standalone { max-width: 980px; }
  .claim-card { padding: 16px 18px; border-radius: 10px; border: 1px solid var(--blue-line); background: var(--sheet); color: var(--ink); }
  .claim-kind { font: 600 10px var(--mono); color: var(--blue); text-transform: uppercase; letter-spacing: .07em; }
  .claim-card h3 { font: 600 16px var(--ui); margin: 9px 0; }
  .claim-card .before { color: var(--ink-3); text-decoration: line-through; }
  .claim-card .after { font: 16px/1.45 var(--text); }
  .claim-card p { margin: 7px 0; }
  .claim-card > a:last-child { font-size: 12px; }
  .memory-card > p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
  .category-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 9px; margin: 15px 0 25px; }
  .category-card { border: 1px solid var(--line); border-radius: 9px; padding: 14px; background: var(--sheet); text-decoration: none !important; }
  .category-card:hover, .category-card:focus-visible { border-color: var(--blue); }
  .category-card strong { display: block; color: var(--ink); font: 600 14px var(--ui); }
  .category-card span { display: block; margin-top: 6px; color: var(--ink-3); font: 11px var(--mono); }
  .task-band { max-width: 980px; margin: 30px 0; }
  .task-band .threads { padding: 0; }
  .evidence-dialog { width: min(680px, calc(100vw - 24px)); max-height: min(760px, calc(100vh - 24px)); overflow: auto; padding: 26px; border: 1px solid var(--blue-line); border-radius: 14px; background: var(--sheet); color: var(--ink); box-shadow: 0 24px 80px rgba(0,0,0,.28); }
  .evidence-dialog::backdrop { background: rgba(5, 9, 25, .7); }
  .evidence-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; position: sticky; top: 0; z-index: 1; background: var(--sheet); box-shadow: 0 -26px 0 var(--sheet), 0 8px 0 var(--sheet); }
  .evidence-top .focus-kicker { color: var(--blue); }
  .evidence-close { border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 7px 10px; min-height: 44px; border-radius: 6px; cursor: pointer; }
  .evidence-dialog h2 { font: 25px var(--display); margin: 14px 0; }
  .evidence-summary { color: var(--ink-2); }
  .evidence-summary, .evidence-meta { overflow-wrap: anywhere; }
  .evidence-original { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 18px; }
  .evidence-original .focus-kicker { color: var(--blue); }
  .evidence-meta { font: 11px var(--mono); color: var(--ink-3); }
  .evidence-participants > summary { cursor: pointer; padding: 12px 0; }
  .evidence-original blockquote { margin: 12px 0 0; padding: 14px 18px; border-left: 3px solid var(--blue); background: var(--blue-soft); font: 16px/1.55 var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .evidence-unavailable { color: var(--ink-2); }
  @media (prefers-reduced-motion: reduce) { .relation-card { transition: none; } .relation-card:hover, .relation-card:focus-visible { transform: none; } }

  @media (min-width: 1180px) {
    .page-grid.has-side { grid-template-columns: minmax(0, 66ch) 320px; }
    .page-grid.has-side > .side { order: 0; margin: 0; position: sticky; top: 24px; align-self: start; }
  }
  @media (min-width: 821px) and (max-width: 1179px) {
    .page-grid > .side { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; align-items: start; }
    .page-grid > .side .panel + .panel { margin-top: 0; }
  }
  @media (max-width: 1100px) { .hits.cols { grid-template-columns: 1fr; } }
  @media (max-width: 820px) {
    .record-focus { grid-template-columns: 1fr; gap: 10px; margin-top: 12px; }
    .focus-head { padding: 20px; min-height: 0; }
    .focus-statement { font-size: 22px; }
    .focus-section { padding: 16px; }
    .focus-facts, .related-records, .activity-view, .conversation-view, .project-workspace { grid-column: 1; }
    .project-workspace { grid-template-columns: 1fr; }
    .focus-facts { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .focus-facts dd { margin: 0; }
    .activity-list li { grid-template-columns: 76px minmax(0, 1fr); gap: 3px 9px; }
    .activity-list { max-height: none; }
    .activity-list .activity-text { grid-column: 2; }
    .activity-note { display: none; }
    .deep-head { display: block; }
    .deep-hint { display: block; margin-top: 3px; }
    .evidence-dialog { padding: 18px; }
    .app { grid-template-columns: 1fr; align-content: start; }
    .rail { padding: 14px 16px; gap: 10px; position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand svg { width: 22px; height: 22px; }
    .search .kbd { display: none; }
    main { padding: 22px 16px 64px; }
    .rail .foot { display: none; }
    .rail[data-open="true"] .foot { display: flex; }
    .nav-toggle { display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 9px 12px; text-align: left; color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; font: 14px var(--ui); cursor: pointer; }
    .nav-toggle::after { content: "▾"; color: var(--ink-3); }
    .nav-toggle[aria-expanded="true"]::after { content: "▴"; }
    #nav { display: none; }
    .rail[data-open="true"] #nav { display: flex; }
    nav a { min-height: 44px; align-items: center; }
    .search input { font-size: 16px; min-height: 44px; padding-right: 44px; }
    .search-clear { right: 0; min-width: 44px; min-height: 44px; }
    .mobile-status { display: block; font: 11px/1.4 var(--mono); color: var(--ink-3); }
    h1 { font-size: 30px; }
    .standfirst { font-size: 18px; }
    h2.section { display: block; }
    h2.section .n { display: block; text-align: left; margin-top: 4px; }
    .night { padding: 20px 18px 18px; margin-left: -4px; margin-right: -4px; }
    .night .thesis { font-size: 22px; }
    .thread, .band .threads .thread, .block-threads .thread { grid-template-columns: minmax(0, 1fr); padding: 11px 14px; }
    .thread .when { order: -1; }
    .morning { padding: 23px 20px; }
    .morning-top { display: block; }
    .morning-time { display: block; margin-top: 10px; }
    .memory-grid { grid-template-columns: minmax(0, 1fr); }
    .memory-card { padding: 18px 0; }

// The page being rendered: its numbered sources, so a claim's [n] can name its source.
let CITES = { from: "", sources: {} };
function citeRun(ns, from) {

function citeChip(n, from) {

  return '<a class="cite" href="#r=' + esc(encodeURIComponent(from)) + "&amp;h=src-" + n.toLowerCase() + '"' +
    (tip ? ' data-tip="' + esc(tip) + '"' : "") + ' aria-label="Source ' + n + (tip ? ": " + esc(tip) : "") + '">' + n + "</a>";

// Pages are written about "the user"; the reader is read by them. At render time
// only (the Markdown keeps its wording, and Copy Markdown copies it as written)
// "the user" becomes "you", with the verb that follows agreeing: "the user has
// not signed" reads "you have not signed", "the user's" reads "your".
const YOU_VERBS = { has: "have", is: "are", was: "were", does: "do", "hasn't": "haven't", "isn't": "aren't", "wasn't": "weren't", "doesn't": "don't" };
// Words after "the user" that end in s and are not verbs: "owes the user its proposal".
const NOT_VERBS = new Set(["its", "as", "was", "has", "yes", "plus", "thus", "less", "unless", "always", "perhaps", "sometimes", "whereas", "towards", "afterwards", "nevertheless", "regardless", "across", "besides"]);

function youify(text) {

    .replace(/\b([Tt])he user(?:'s|’s)/g, (m, t) => cap(t, "your"))
    .replace(/\b([Tt])he user (?:(still|also|now|then|already|never|often|usually) )?([a-z]+(?:['’]t)?)\b/g, (m, t, adverb, word) => {

function markdownList(lines, start, from) {

function markdown(text, from) {

      continue;

function splitTrailers(text) {

      else if (new RegExp("^" + fence[0] + "{" + fence.length + ",}\\s*$").test(t)) fence = null;
      body.push(line); continue;
