<!doctype html>
<!--
  co rem reader. One self-contained file, no network, opened from file://.
  Python embeds a snapshot of the notebook where the placeholder below sits;
  everything after that is a client of the REM object and nothing else, so the
  same client can be served by a local server or a site later without changes.
  Note text is data: it reaches the DOM only through esc() or textContent.

  Design. co rem is named for REM sleep: overnight it consolidates the day's
  mail and coding sessions into pages. The home returns the changed context
  after the obligations waiting on the owner, then offers an older page to recall. Processing details remain
  available below the memory; a candidate connection stays a question until
  the owner reviews it. Every page opens on what is still open.
  - Palette: paper and ink, dawn indigo for changes, lamp amber for what
    waits on you, and a yellow mark shared by a claim and its source span.
  - Type: Optima for display only (titles, the night's sentence), Charter for
    page prose, Avenir for chrome, and mono only for commands and paths.
  - Fonts are local faces on purpose: a page of someone's private notes must
    not phone a font host on open.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>co rem</title>
<style>
  :root {
    color-scheme: light;
    /* Colour carries meaning: waiting, changed, a source span, or uncertainty. */
    --paper: #f4f5f8; --sheet: #ffffff; --ink: #191c30; --ink-2: #4d536b; --ink-3: #80869c;
    --line: #e0e2ea; --line-2: #eceef3;
    --night: #151a33; --night-2: #222a4e; --night-ink: #e6e8f3; --night-dim: #9097bb;
    --lamp: #9c5800; --lamp-soft: #fbefd9; --lamp-line: #ecc88e;
    --dawn: #4450c4; --dawn-soft: #eaecfb; --dawn-line: #c5caf2;
    --mark: #fde7b0; --quiet: #80869c;
    --well: var(--line-2); --blue: var(--dawn); --blue-soft: var(--dawn-soft); --blue-line: var(--dawn-line);
    --waiting: var(--lamp); --wait: var(--lamp); --night-line: var(--night-2); --night-lamp: #f2b65e; --mark-ink: var(--ink);
    --shadow: 0 10px 30px -18px rgba(21, 26, 51, .35);
    --display: Optima, "Optima Nova", Candara, "Segoe UI Variable Display", sans-serif;
    --text: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, "Songti SC", serif;
    --ui: "Avenir Next", Avenir, system-ui, -apple-system, "PingFang SC", sans-serif;
    --code: ui-monospace, "SF Mono", Menlo, monospace;
    --mono: var(--code);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0e1120; --sheet: #151a2b; --ink: #e4e6f0; --ink-2: #a8aec6; --ink-3: #7d849f;
      --line: #262c40; --line-2: #1e2334;
      --night: #151a33; --night-2: #222a4e; --night-ink: #e6e8f3; --night-dim: #9097bb;
      --lamp: #efb25e; --lamp-soft: #2b2314; --lamp-line: #5b4520;
      --dawn: #a3acff; --dawn-soft: #1d2348; --dawn-line: #343f80;
      --mark: #4d3c12; --quiet: #7d849f;
      --well: var(--line-2); --blue: var(--dawn); --blue-soft: var(--dawn-soft); --blue-line: var(--dawn-line);
      --waiting: var(--lamp); --wait: var(--lamp); --night-line: var(--night-2); --night-lamp: #f2b65e; --mark-ink: var(--ink);
      --shadow: 0 10px 30px -18px rgba(21, 26, 51, .35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0e1120; --sheet: #151a2b; --ink: #e4e6f0; --ink-2: #a8aec6; --ink-3: #7d849f;
    --line: #262c40; --line-2: #1e2334;
    --night: #151a33; --night-2: #222a4e; --night-ink: #e6e8f3; --night-dim: #9097bb;
    --lamp: #efb25e; --lamp-soft: #2b2314; --lamp-line: #5b4520;
    --dawn: #a3acff; --dawn-soft: #1d2348; --dawn-line: #343f80;
    --mark: #4d3c12; --quiet: #7d849f;
    --well: var(--line-2); --blue: var(--dawn); --blue-soft: var(--dawn-soft); --blue-line: var(--dawn-line);
    --waiting: var(--lamp); --wait: var(--lamp); --night-line: var(--night-2); --night-lamp: #f2b65e; --mark-ink: var(--ink);
    --shadow: 0 10px 30px -18px rgba(21, 26, 51, .35);
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--ui); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 2px; }
  code { font: 0.86em var(--mono); }
  .mono { font-family: var(--ui); font-variant-numeric: tabular-nums; }
  svg.moon { width: 11px; height: 11px; flex-shrink: 0; color: var(--ink-3); vertical-align: -1px; }

  .app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }

  /* ---- rail: quiet chrome, the notebook's spine ---- */
  .rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 16px 18px 20px; border-right: 1px solid var(--line); background: var(--paper); display: flex; flex-direction: column; gap: 18px; }
  .brand { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; align-items: center; color: var(--ink); text-decoration: none !important; }
  .brand svg { grid-row: span 2; width: 34px; height: 18px; }
  .brand .name { letter-spacing: 0; font: 600 17px/1 var(--display); }
  .brand .sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px/1.4 var(--ui); color: var(--ink-3); margin-top: 3px; }

  .search { position: relative; }
  .search input { width: 100%; padding: 8px 30px 8px 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--ink); font: 13.5px var(--ui); }
  .search input::-webkit-search-decoration,
  .search input::-webkit-search-cancel-button,
  .search input::-webkit-search-results-button,
  .search input::-webkit-search-results-decoration { display: none; -webkit-appearance: none; }
  .search input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }
  .search input::placeholder { color: var(--ink-3); }
  .search .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; fill: none; stroke: var(--ink-3); stroke-width: 2; pointer-events: none; }
  .search .kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 11px var(--ui); color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; pointer-events: none; }
  .search input:not(:placeholder-shown) ~ .kbd { display: none; }
  .search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 2px 6px; font-size: 13px; color: var(--ink-3); cursor: pointer; border-radius: 4px; display: none; line-height: 1; }
  .search-clear:hover { color: var(--ink); background: var(--well); }
  .search input:not(:placeholder-shown) + .search-clear { display: block; }

  nav { display: flex; flex-direction: column; gap: 1px; }
  nav .label { letter-spacing: 0; text-transform: none; color: var(--ink-3); font: 400 12px/1.5 var(--ui); margin: 8px 0 4px 10px; }
  nav a { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-radius: 5px; color: var(--ink-2); position: relative; font-size: 15px; padding: 6px 10px; }
  nav a:hover { background: var(--well); color: var(--ink); text-decoration: none; }
  nav a.active { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--ink); }
  nav a .n { color: var(--ink-3); font: 400 13px var(--ui); }
  nav a .n.zero { opacity: 0.5; }
  nav a .n.open { color: var(--lamp); }
  nav .gap { height: 10px; }

  .rail .foot { margin-top: auto; color: var(--ink-3); display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); font: 13px/1.5 var(--ui); }
  .theme-switch { display: inline-flex; background: var(--well); border-radius: 6px; padding: 2px; gap: 2px; align-self: flex-start; }
  .theme-btn { background: none; border: none; padding: 3px 9px; font: 11.5px var(--ui); color: var(--ink-2); border-radius: 4px; cursor: pointer; min-height: 24px; }
  .rail .foot > .theme-btn { min-height: 44px; text-align: left; }
  .theme-btn:hover { color: var(--ink); }
  .theme-btn.active { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  .privacy-tag { font: 10px var(--ui); letter-spacing: 0; text-transform: none; padding: 0 5px; margin: 0 2px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-3); background: var(--well); white-space: nowrap; }
  .privacy-tag.sensitive { border-color: var(--ink-3); color: var(--ink); font-weight: 600; }
  :root.hide-private .private, :root.hide-private li.private-item { display: none; }
  :root.hide-private .privacy-only .privacy-content { display: none; }
  .private-hidden-notice { display: none; }
  :root.hide-private .private-hidden-notice { display: block; }

  /* ---- main ---- */
  main { min-width: 0; width: 100%; overflow-wrap: anywhere; padding: 32px 40px 80px; max-width: 1180px; }
  main:focus { outline: none; }
  .eyebrow { letter-spacing: 0; text-transform: none; color: var(--ink-3); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 13px/1.4 var(--ui); margin-bottom: 8px; }
  .eyebrow a { color: var(--blue); }
  .eyebrow .sep { color: var(--line); }
  .eyebrow .when { text-transform: none; letter-spacing: 0; }
  h1 { font: 500 34px/1.15 var(--display); letter-spacing: -0.01em; margin: 0 0 8px; text-wrap: balance; color: var(--ink); }
  .lede { color: var(--ink-2); font: 16px/1.55 var(--text); margin: 0 0 24px; max-width: 64ch; }
  .lede b { color: var(--ink); font-weight: 600; }
  h2.section { font: 600 18px/1.3 var(--display); margin: 32px 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  h2.section .n { font: 11.5px var(--ui); color: var(--ink-3); text-align: right; font-weight: 400; }
  h2.section .n a { color: var(--ink-2); }
  .section-sub { color: var(--ink-3); font-size: 13.5px; margin: 0 0 14px; }

  /* status: a moon phase, full when investigated */
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font: 500 11px/1.6 var(--ui); letter-spacing: 0; text-transform: none; white-space: nowrap; background: var(--line-2); color: var(--ink-2); }
  .pill.status.mapped { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); }
  .pill.status.mapped svg.moon { color: var(--ink-3); }
  .pill.quiet { background: var(--well); color: var(--ink-2); }
  .pill.warn { background: var(--line-2); color: var(--ink-2); }

  /* ---- the night: the home's one loud thing ---- */
  .night { position: relative; border-radius: 0; background: var(--night); color: var(--night-ink); overflow: hidden; margin: -32px -40px 32px; padding: 24px 40px; box-shadow: none; }
  .night > * { position: relative; }
  .night .kicker { letter-spacing: 0; text-transform: none; color: var(--night-dim); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font: 400 14px/1.5 var(--ui); }
  .night .kicker svg { width: 14px; height: 14px; color: var(--night-lamp); }
  .night .thesis { text-wrap: balance; font: 19px/1.45 var(--text); max-width: 64ch; margin: 12px 0 16px; }
  .night .thesis b { font-weight: 600; color: #fff; }
  .night .stats { flex-wrap: wrap; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 24px; margin: 12px 0 0; }
  .night .stat .v { color: #fff; font: 600 16px/1.4 var(--ui); }
  .night .stat .k { color: var(--night-dim); letter-spacing: 0; font: 13px/1.5 var(--ui); margin-top: 0; }
  .night .stat.warn .v { color: var(--night-lamp); }
  .hypno { position: relative; height: 100px; margin: 12px 0 8px; }
  .hypno svg { display: block; width: 100%; height: 84px; overflow: visible; }
  .hypno .grid { stroke: var(--night-line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-dasharray: 2 4; }
  .hypno .trace { fill: none; stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke: #c9cff5; stroke-width: 1.6; stroke-linecap: round; }
  .hypno .area { fill: #c9d0f5; opacity: 0.13; }
  .hypno .day { position: absolute; top: 88px; padding-left: 4px; color: var(--night-dim); white-space: nowrap; font: 11px var(--ui); }
  .hypno .dot { position: absolute; border-radius: 50%; background: #fff; box-shadow: none; width: 6px; height: 6px; margin: -3px 0 0 -3px; }
  .hypno .dot.woke { background: var(--night-dim); box-shadow: none; }
  .night .legend { font: 10.5px var(--ui); color: var(--night-dim); display: flex; gap: 16px; flex-wrap: wrap; }
  .night .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .night .changes { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--night-line); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
  .night .changes .k { font: 11px var(--ui); color: var(--night-dim); margin-right: 4px; letter-spacing: 0; }
  .night .changes a { color: var(--night-ink); font-size: 13.5px; border-radius: 0; box-shadow: none; background: transparent; padding: 2px 0; text-decoration: underline; text-decoration-color: var(--night-dim); }
  .night .changes a:hover { background: rgba(255,255,255,0.14); text-decoration: none; }
  .night code { font: 12px var(--ui); color: #fff; background: rgba(255,255,255,0.08); padding: 2px 7px; border-radius: 4px; }
  .night p { margin: 0; color: var(--night-dim); font-size: 14px; }

  /* Waiting comes before rewrites; quieter context stays in the margin (UI audit #1–4). */
  nav a .n.waiting { color: var(--waiting); }
  .night-strip { padding: 20px 40px; margin: -32px -40px 32px; }
  .night-strip p { font: 14px/1.5 var(--ui); }
  .night-strip .hypno { height: 100px; margin: 12px 0 8px; }
  .night-strip .hypno svg { height: 84px; }
  .night-strip .hypno .day { top: 86px; font-size: 11px; }
  .morning-layout, .morning-primary, .morning-side { min-width: 0; }
  .morning-primary h1 { font: 500 34px/1.15 var(--display); margin: 0 0 8px; }
  .waiting-intro, .quiet-line { color: var(--ink-2); font-size: 14px; }
  .waiting-ledger { list-style: none; padding: 0; margin: 22px 0 12px; }
  .waiting-ledger > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; padding: 18px 0; border-top: 1px solid var(--line); }
  .waiting-person { display: flex; align-items: start; gap: 10px; min-width: 0; font-size: 14px; }
  .waiting-person a { color: var(--ink); font-weight: 600; }
  .waiting-person .meta { display: block; margin: 3px 0 0; color: var(--ink-3); font-size: 12px; }
  .avatar { display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; font-size: 12px; color: var(--ink-2); background: var(--line-2); }
  .waiting-ask { grid-column: 1 / -1; min-width: 0; }
  .waiting-ask .words { font: 19px/1.45 var(--text); margin: 0 0 8px; }
  .waiting-ask .context { color: var(--ink-2); font: 13px/1.55 var(--ui); margin: 0; }
  .waiting-age { grid-column: 2; grid-row: 1; text-align: right; font: 12px/1.5 var(--ui); color: var(--ink-3); }
  .waiting-age b { display: block; color: var(--waiting); font-weight: 600; }
  .waiting-age span { white-space: nowrap; }
  .waiting-more { color: var(--ink-2); font-size: 13px; }
  .overnight .claim-grid { display: block; }
  .overnight .claim-card { border: 0; border-radius: 0; background: transparent; border-top: 0; padding: 16px 0; }
  .morning-side .recall { display: block; margin-top: 28px; padding: 0; border: 0; background: transparent; }
  .morning-side .recall .label { font: 600 17px var(--display); color: var(--ink); text-transform: none; letter-spacing: 0; }
  .morning-side .recall h2 { font: 19px/1.4 var(--text); margin: 14px 0 10px; }
  .morning-side .recall-toggle { margin-top: 14px; }
  .gone-quiet { margin-top: 28px; color: var(--ink-2); }
  .gone-quiet summary { font: 600 17px/1.5 var(--display); cursor: pointer; color: var(--ink); }
  .quiet-list { list-style: none; padding: 0; font-size: 13px; }
  .quiet-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .quiet-list p { margin: 4px 0 0; color: var(--ink-2); font: 13px/1.4 var(--text); }
  .quiet-list span { white-space: nowrap; color: var(--ink-3); }
  @media (min-width: 1100px) {
    .morning-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; }
    .morning-side .recall { margin-top: 0; }
  }
  @media (min-width: 1550px) {
    .waiting-ledger > li { grid-template-columns: 160px minmax(0, 1fr) auto; }
    .waiting-ask { grid-column: 2; grid-row: 1; }
    .waiting-age { grid-column: 3; }
  }
  /* Morning recall: the foreground is what the notebook retained, not its run log. */
  .morning { margin: 24px 0 0; padding: 24px 0; border-top: 1px solid var(--line); color: var(--ink); }

  .morning-top { display: flex; justify-content: space-between; gap: 18px; align-items: start; border-bottom: 1px solid var(--line); padding-bottom: 22px; }
  .morning-kicker { display: block; color: var(--ink-3); font: 600 11px/1.4 var(--ui); text-transform: none; letter-spacing: 0; }
  .morning h2 { max-width: 22ch; font: 400 clamp(28px, 3vw, 42px)/1.12 var(--display); letter-spacing: -.02em; margin: 9px 0 0; text-wrap: balance; }
  .morning-time { flex-shrink: 0; color: var(--ink-2); font: 11px/1.5 var(--ui); }
  .inspection-link { display: inline-block; margin-top: 14px; padding: 0; border: 0; background: none; color: var(--ink-2); font: 12px var(--ui); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
  .first-map-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .first-map-actions a, .first-map-actions button { display: inline-flex; align-items: center; min-height: 44px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--ink-2); font: 600 13px var(--ui); text-decoration: none; cursor: pointer; }
  .first-map-actions a { background: var(--sheet); color: var(--ink); }
  .first-map-held { margin: 16px 0 0; color: var(--ink-2); font-size: 12.5px; }
  .memory-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
  .memory-card { min-width: 0; padding: 24px 22px 12px 0; }
  .memory-card + .memory-card { border-left: 1px solid var(--line); padding-left: 22px; }
  .memory-card .kind { color: var(--ink-2); font: 10px/1.4 var(--ui); text-transform: none; letter-spacing: 0; }
  .memory-card h3 { font: 500 20px/1.25 var(--display); margin: 9px 0 10px; }
  .memory-card h3 a, .memory-card .open { color: var(--ink-2); }
  .memory-card p { margin: 0 0 12px; color: var(--ink-2); font: 15px/1.5 var(--text); }
  .memory-card .project-purpose { color: var(--ink-2); font-size: 13.5px; }
  .memory-card .open { display: inline-flex; min-height: 44px; align-items: center; font: 12px var(--ui); text-decoration: underline; text-underline-offset: 4px; }
  .memory-empty { margin: 22px 0 0; color: var(--ink-2); font: 16px/1.5 var(--text); }
  .memory-connection { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 17px; margin-top: 8px; font-size: 13px; }
  .memory-connection .label { color: var(--ink-2); font: 10px var(--ui); letter-spacing: 0; text-transform: none; }
  .memory-connection a { color: var(--ink-2); }
  .memory-connection .relation { color: var(--ink-2); }
  .memory-connection .basis { color: var(--ink-2); }
  .recall { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 24px; align-items: center; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; padding: 16px 0; }
  .recall .label { font: 600 10px/1.4 var(--ui); letter-spacing: 0; text-transform: none; color: var(--blue); }
  .recall h2 { grid-column: 1; font: 500 23px/1.28 var(--display); margin: 6px 0; }
  .recall .why { grid-column: 1; color: var(--ink-2); font-size: 13px; margin: 0; }
  .recall-toggle { grid-column: 2; grid-row: 1 / span 3; align-self: center; min-height: 44px; border-radius: 7px; padding: 10px 14px; font: 600 13px var(--ui); cursor: pointer; background: transparent; border: 1px dashed var(--ink-3); color: var(--ink-2); }
  .recall-toggle:hover { border-color: var(--blue); }
  .recall-answer { grid-column: 1 / -1; border-top: 1px solid var(--line); margin-top: 16px; padding-top: 15px; }
  .recall-answer[hidden] { display: none; }
  .recall-answer p { font: 16px/1.5 var(--text); margin: 0 0 7px; }
  .recall-answer a { font-size: 13px; }
  .connection-review { margin-top: 14px; padding: 20px 27px; border: 1px solid var(--blue-line); background: var(--lamp-soft); border-color: var(--lamp-line); border-radius: 8px; }
  .connection-review .label { letter-spacing: 0; text-transform: none; color: var(--lamp); font: 500 13px var(--ui); }
  .connection-review h2 { font: 500 20px/1.3 var(--display); margin: 7px 0; }
  .connection-review p { margin: 0 0 10px; color: var(--ink-2); font-size: 13px; }
  .connection-review .subjects { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; }
  .night-details { margin-top: 60px; border-top: 1px solid var(--line); padding-top: 10px; }
  .night-details > summary { cursor: pointer; color: var(--ink-2); font: 13px var(--ui); padding: 8px 0; }
  .night-details .night { margin-top: 10px; }

  /* ---- this week: what was rewritten ---- */
  .week { list-style: none; padding: 0; margin: 10px 0 0; border-top: 1px solid var(--line); }
  .week li { display: grid; grid-template-columns: 64px 14px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
  .week .d { font-size: 11.5px; color: var(--ink-3); text-align: right; }
  .week .w { display: flex; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
  .week .w a { color: var(--ink); font-weight: 600; }
  .week .meta { font-size: 12px; color: var(--ink-3); }
  .week .s { flex-basis: 100%; font: 14px/1.45 var(--text); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* ---- open threads: who owes whom ---- */
  .bands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; margin-top: 12px; }
  .bands > .band:last-child:nth-child(3) { grid-column: 1 / -1; }
  .band h3 { display: flex; justify-content: space-between; align-items: baseline; letter-spacing: 0; text-transform: none; color: var(--ink-2); margin: 0 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line); font: 600 16px var(--display); }
  .band .threads .thread { grid-template-columns: 76px minmax(0, 1fr) auto; padding: 16px 0; }
  .band-none { color: var(--ink-3); font-size: 13.5px; margin: 8px 0 0; }
  .thread .when.today { padding: 0 5px; border-radius: 3px; color: var(--lamp); background: var(--lamp-soft); }
  @media (max-width: 1100px) { .bands { grid-template-columns: minmax(0, 1fr); } }
  .threads { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
  .thread { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; padding: 16px 0; background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
  .dir { letter-spacing: 0; text-transform: none; color: var(--lamp); white-space: nowrap; font: 500 12px/1.5 var(--ui); }
  .thread.theirs .dir { color: var(--ink-2); }
  .thread.plain .dir { color: var(--ink-3); }
  .thread .what { color: var(--ink); font: 16px/1.55 var(--text); }
  .also-on { color: var(--ink-3); font: 12px/1.5 var(--ui); margin-top: 4px; overflow-wrap: anywhere; }
  .also-on a { color: inherit; }
  .thread .who { font-size: 13px; color: var(--ink-2); margin-top: 3px; font-family: var(--ui); }
  .thread .when { font: 11.5px var(--ui); color: var(--ink-3); white-space: nowrap; }

  /* ---- rows: a page as one line of what it knows ---- */
  .hits { list-style: none; margin: 0; padding: 0; max-width: 80ch; border-top: 1px solid var(--line); }
  .hits.cols { max-width: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
  .hits > li { padding: 13px 0 14px; border-bottom: 1px solid var(--line); min-width: 0; }
  .hits .t { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .hits .t > span:first-child { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .hits .t a { color: var(--ink); font-weight: 600; font-size: 15px; }
  .hits.skills .t a { display: inline-flex; align-items: center; min-width: 44px; min-height: 44px; overflow-wrap: anywhere; }
  .hits .t a:hover { color: var(--blue); }
  .hits .t .meta { font-size: 12.5px; color: var(--ink-3); }
  .hits .when { font: 11.5px var(--ui); color: var(--ink-3); white-space: nowrap; }
  .hits .hit { margin-top: 4px; color: var(--ink-2); font: 14.5px/1.5 var(--text); }
  .hits .hit.ui { font-family: var(--ui); font-size: 13px; }
  .hits .open { color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
  .hits .open .k { flex-shrink: 0; font: 600 10px/1.9 var(--ui); letter-spacing: 0; text-transform: none; color: var(--ink-2); background: transparent; padding: 0 6px; border-radius: 3px; }
  .hits .eyebrow { margin-bottom: 4px; }
  .usage { display: flex; align-items: center; gap: 10px; margin-top: 6px; font: 11.5px var(--ui); color: var(--ink-3); }
  .usage .bar { width: 120px; height: 4px; border-radius: 2px; background: var(--well); overflow: hidden; flex-shrink: 0; }
  .usage .bar i { display: block; height: 100%; background: var(--ink-3); border-radius: 2px; }
  mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 2px; }

  /* the home's quick entry: one shelf per kind of page */
  .shelves { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px 40px; margin-top: 14px; }
  .shelf h3 { font: 600 11px var(--display); letter-spacing: 0; text-transform: none; color: var(--ink-3); margin: 0 0 6px; padding-bottom: 7px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .shelf h3 a { color: inherit; }
  .shelf .ask { font: italic 13.5px/1.4 var(--text); color: var(--ink-3); margin: 0 0 6px; }
  .toc { list-style: none; margin: 0; padding: 0; }
  .toc li { padding: 4px 0; font-size: 14px; line-height: 1.4; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .toc li > a:first-of-type { color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc li > a:hover { color: var(--blue); }
  .toc .when, .toc .path-hint { margin-left: auto; font: 11px var(--ui); color: var(--ink-3); white-space: nowrap; flex-shrink: 0; }
  .toc .path-hint { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .toc .more { color: var(--blue); font-size: 13px; }

  /* the engine room: maintenance, kept below everything */
  .maint { margin-top: 64px; border-top: 1px solid var(--line); padding-top: 8px; }
  .maint > summary { cursor: pointer; list-style: none; padding: 10px 0; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  .maint > summary::-webkit-details-marker { display: none; }
  .maint > summary h2 { font: 500 18px var(--display); margin: 0; display: inline; }
  .maint > summary .n { font: 11.5px var(--ui); color: var(--ink-3); }
  .maint > summary::after { content: "+"; font: 16px var(--ui); color: var(--ink-3); }
  .maint[open] > summary::after { content: "−"; }
  .maint .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px 22px; margin: 6px 0 16px; }
  .maint .k { font: 10.5px var(--ui); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
  .maint .v { font: 500 16px var(--ui); margin-top: 3px; }
  .maint .state { font-size: 14px; color: var(--ink-2); margin: 4px 0 14px; max-width: 72ch; }
  .activity-runs { list-style: none; margin: 0; padding: 0; max-width: 80ch; border-top: 1px solid var(--line); }
  .activity-runs > li { padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .run-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; font-size: 14px; }
  .run-meta { margin-top: 3px; font-size: 12px; color: var(--ink-3); }
  .run-pages { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 6px; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
  .run-pages .k { font: 600 10px/1.9 var(--ui); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
  .run-pages .k.warn { color: var(--quiet); }
  .run-pages .why { flex-basis: 100%; color: var(--ink-2); font-size: 13px; }
  .activity-runs .run-trace { margin: 4px 0 0; border-bottom: 0; }
  .activity-shelf { margin-top: 28px; border-top: 1px solid var(--line); }
  .activity-shelf > summary { cursor: pointer; padding: 12px 0; min-height: 44px; box-sizing: border-box; font: 500 15px var(--ui); color: var(--ink-2); }
  .run-trace { margin: 8px 0; border-bottom: 1px solid var(--line-2); }
  .run-trace > summary { cursor: pointer; padding: 8px 0; font: 12px var(--ui); color: var(--ink-2); }
  .run-trace h3 { font: 600 12px var(--display); margin: 12px 0 4px; }
  .run-trace ul { padding-left: 20px; margin: 4px 0 12px; }
  .run-trace li, .run-trace pre { font: 12px/1.5 var(--ui); overflow-wrap: anywhere; white-space: pre-wrap; }
  .run-trace pre { max-height: 240px; overflow: auto; }

  /* ---- a page ---- */
  .page-head { margin-bottom: 26px; }
  .standfirst { color: var(--ink); margin: 6px 0 0; max-width: 62ch; font: 400 18px/1.5 var(--text); }
  .page-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 56px; }
  .page-grid > .side { margin: 26px 0 0; max-width: 66ch; }
  .panel { font-size: 13px; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; padding: 16px 0; }
  .panel + .panel { margin-top: 12px; }
  .panel h3 { font: 600 10.5px var(--display); letter-spacing: 0; text-transform: none; color: var(--ink-3); margin: 0 0 10px; }
  .panel dl { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px 10px; margin: 0; }
  .panel dt { color: var(--ink-3); font-size: 12px; }
  .panel dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .panel dd.mono, .panel dd .mono { font-size: 12px; }
  .unk { color: var(--ink-3); opacity: 0.7; }
  .bigstat { display: flex; align-items: baseline; gap: 8px; }
  .bigstat .v { font: 500 30px/1 var(--ui); color: var(--ink); }
  .bigstat .k { font-size: 12.5px; color: var(--ink-3); }
  .panel .usage { margin-top: 10px; }
  .panel .usage .bar { width: 100%; height: 6px; }
  .panel p { margin: 8px 0 0; color: var(--ink-2); }

  .note { max-width: 66ch; font: 16px/1.55 var(--text); color: var(--ink); }
  .note p { margin: 0 0 1em; }
  .note > h2 { font: 600 18px/1.3 var(--display); margin: 32px 0 12px; position: relative; display: flex; align-items: baseline; gap: 10px; }
  .note > h2::after { content: ""; flex: 1; height: 1px; background: var(--line); transform: translateY(-5px); }
  .note > h2:first-child { margin-top: 0; }
  .note h3 { font: 600 16px/1.3 var(--display); margin: 1.5em 0 0.4em; position: relative; }
  .note h4, .note h5, .note h6 { font: 600 14.5px/1.3 var(--display); margin: 1.3em 0 0.4em; }
  .heading-anchor { opacity: 0; font: 400 13px var(--ui); color: var(--ink-3); text-decoration: none !important; }
  .note :is(h2,h3,h4):hover .heading-anchor, .heading-anchor:focus-visible { opacity: 1; }
  .heading-anchor:hover { color: var(--blue); }
  .note ul, .note ol { padding-left: 1.25em; margin: 0 0 1em; }
  .note li { margin: 0.3em 0; }
  .note li > p { margin-bottom: 0.25em; }
  .note li > ul, .note li > ol { margin-bottom: 0.5em; }
  .note li::marker { color: var(--ink-3); }
  .note li.unknown-item, .note p.unknown-item { color: var(--ink-3); font-style: italic; font-size: 15px; }
  .note strong { font-weight: 700; }
  .note code { background: var(--well); padding: 1px 5px; border-radius: 3px; font-size: 0.82em; }
  .note blockquote { margin: 0 0 1em; padding: 2px 18px; border-left: 2px solid var(--blue-line); color: var(--ink-2); font-style: italic; }
  .note hr { border: 0; border-top: 1px solid var(--line); margin: 1.8em 0; }
  .note table { border-collapse: collapse; font: 14px/1.45 var(--ui); }
  .note th, .note td { border-bottom: 1px solid var(--line); padding: 7px 14px 7px 0; text-align: left; vertical-align: top; }
  .note th { font: 600 11px var(--ui); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
  .table-scroll { max-width: 100%; overflow-x: auto; margin-bottom: 1.2em; }
  .table-scroll table { margin-bottom: 0; min-width: 100%; }
  .table-scroll th, .table-scroll td { min-width: 120px; }
  .note :is(h2,h3,h4,h5,h6), .note [id^="src-"] { scroll-margin-top: 24px; }

  /* citations name the original before the reader opens it */
  .cite { display: inline-block; position: relative; vertical-align: baseline; max-width: 100%; border: 1px solid var(--blue-line); padding: 3px 6px; margin: 0 2px; overflow-wrap: anywhere; text-decoration: none !important; font: 500 12.5px/16px var(--ui); color: var(--ink-2); background: var(--line-2); border-color: var(--line); border-radius: 999px; }
  /* Grow the tap target without opening a gap in the prose. */
  .cite::before { content: ""; position: absolute; inset: -2px; min-width: 24px; min-height: 24px; }
  .cite.missing { border-style: dashed; color: var(--ink-3); }
  .cite:hover, .cite:focus-visible { background: var(--mark); color: var(--ink); border-color: var(--lamp-line); }

  /* open threads on a page: the visual centre */
  .block-threads { margin: 0 0 8px; }
  .note .threads, .note .timeline, .note .block-sources ol { padding-left: 0; }
  .thread .when:empty { display: none; }
  .block-threads .threads { margin-bottom: 1em; }
  .calm { display: flex; gap: 10px; align-items: baseline; padding: 11px 16px; border-radius: 8px; background: var(--well); color: var(--ink-2); font-size: 15px; margin-bottom: 1em; }
  .calm .dir { color: var(--ink-3); }

  /* history: a dated spine */
  .timeline { list-style: none; margin: 0 0 1.2em; padding: 0; position: relative; }
  .timeline li { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 0; margin: 0; padding: 0 0 12px; position: relative; }
  .timeline li::before { content: ""; position: absolute; left: 101px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--sheet); box-shadow: 0 0 0 1.5px var(--blue); }
  .timeline li::after { content: ""; position: absolute; left: 104px; top: 20px; bottom: -2px; width: 1px; background: var(--line); }
  .timeline li:last-child::after { display: none; }
  .timeline .d { font: 12px/1.9 var(--ui); color: var(--ink-3); text-align: right; padding-right: 20px; white-space: pre-line; }
  .timeline .e { padding-left: 18px; font-size: 15.5px; line-height: 1.55; }
  .timeline li.undated .d { visibility: hidden; }
  .timeline li.undated::before { box-shadow: 0 0 0 1.5px var(--line); }

  /* sources: a compact footnote list */
  .block-sources ol { list-style: none; padding: 0; margin: 0 0 1em; font: 13px/1.5 var(--ui); color: var(--ink-2); }
  .block-sources li { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line-2); margin: 0; }
  .block-sources li:target, .block-sources li.flash { background: var(--mark); }
  .dead-link { color: var(--ink-3); text-decoration: line-through dotted; cursor: help; }
  .block-sources .n { font: 600 11px/1.9 var(--ui); color: var(--blue); }
  .block-sources .source-open { display: inline-flex; min-width: 44px; min-height: 44px; align-items: center; justify-content: center; justify-self: start; vertical-align: baseline; font: 500 11px var(--ui); }
  .block-sources .id { font: 11.5px var(--ui); color: var(--ink); }

  /* where it stands: a status block */
  .block-standing { border-left: 2px solid var(--blue); padding: 2px 0 2px 18px; margin-bottom: 1.2em; }
  .block-standing ul { list-style: none; padding: 0; }
  .block-standing li + li { margin-top: 0.6em; }

  /* code and diagrams: a plate */
  .code-block { position: relative; margin: 0 0 1.3em; }
  .note pre { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; overflow-x: auto; font: 12.5px/1.55 var(--ui); max-width: 100%; tab-size: 4; margin: 0; color: var(--ink); }
  .code-block.diagram pre { background-color: var(--sheet); background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 14px 14px; background-position: 7px 7px; padding: 22px 22px 20px; }
  .pan-hint { display: none; font: 11px var(--ui); color: var(--ink-3); margin-top: 5px; }
  @media (max-width: 600px) { .code-block.diagram .pan-hint { display: block; } }
  .code-block .cap { position: absolute; left: 12px; top: -8px; font: 600 9.5px/1 var(--ui); letter-spacing: 0; text-transform: none; color: var(--ink-3); background: var(--paper); padding: 3px 6px; border-radius: 3px; }
  .note pre code { background: none; padding: 0; font: inherit; white-space: pre; overflow-wrap: normal; }
  .code-copy { position: absolute; top: 8px; right: 8px; font: 11px var(--ui); color: var(--ink-2); background: var(--sheet); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; opacity: 0; cursor: pointer; }
  .code-block:hover .code-copy, .code-copy:focus-visible { opacity: 1; }

  /* guidance, not error: what is not known yet and the command that fills it */
  .missing:not(.cite), .empty { max-width: 66ch; margin-top: 32px; padding: 16px 0; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 14px; line-height: 1.6; position: relative; }
  .empty { margin-top: 10px; }
  .missing .lead, .empty .lead { display: block; font: 600 10.5px var(--ui); letter-spacing: 0; text-transform: none; color: var(--blue); margin-bottom: 4px; }
  .missing:not(.primary):not(.cite) { padding: 8px 0; background: transparent; font-size: 13px; }
  .missing:not(.primary) .names { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-3); }
  .missing:not(.primary) .cmd { margin-top: 6px; }
  .missing.primary { margin: 0 0 24px; border-top: 1px solid var(--line); background: transparent; padding: 16px 0; }
  .missing.primary .lead { font-size: 11px; }
  .missing.primary .why { margin: 4px 0 8px; font: 16px/1.5 var(--text); color: var(--ink); }
  .missing.primary .names { color: var(--ink-2); font-size: 13px; }
  .btn-primary { min-height: 44px; font: 600 13px var(--ui); color: var(--sheet); background: var(--blue); border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  .btn-primary:hover { filter: brightness(1.1); }
  .missing .cmd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .missing.primary .cmd { margin-top: 0; }
  .missing code, .empty code { font: 12.5px var(--ui); color: var(--ink); background: var(--well); border-radius: 4px; padding: 3px 8px; overflow-wrap: anywhere; }
  .aside { max-width: 66ch; margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px 18px; font-size: 14px; }
  .aside .k { font: 10.5px var(--ui); letter-spacing: 0; text-transform: none; color: var(--ink-3); padding-top: 4px; }
  .aside .related a { display: inline-block; margin: 0 14px 6px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 11.5px var(--ui); color: var(--ink-2); background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
  .chip .d { color: var(--ink-3); margin-left: 6px; }
  .page-foot { max-width: 66ch; margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line-2); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn-action, .eyebrow-path { font: 12px var(--ui); color: var(--ink-2); background: var(--sheet); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  .eyebrow-path { font: 11.5px var(--ui); }
  .btn-action:hover, .eyebrow-path:hover { color: var(--blue); border-color: var(--blue-line); }
  .btn-action.done { color: var(--blue); border-color: var(--blue-line); background: var(--blue-soft); }
  details.copies { margin: 0 0 20px; font-size: 14px; }
  details.copies summary { cursor: pointer; color: var(--ink-2); }
  details.copies p { margin: 6px 0 0 16px; font: 12px var(--ui); }

  /* search: the best match answers, the rest grouped */
  .best { max-width: 80ch; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 16px 0; margin: 0 0 16px; }
  .best-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 12px; }
  .best-head .lead { font: 600 10.5px var(--ui); letter-spacing: 0; text-transform: none; color: var(--blue); }
  .best-head a { font: 500 21px var(--display); color: var(--ink); }
  .best-facts { display: grid; grid-auto-flow: column; grid-template-rows: auto auto; gap: 3px 22px; margin: 0; justify-content: start; }
  .best-facts dt { font: 600 10px var(--ui); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
  .best-facts dd { margin: 0; font: 13px var(--ui); overflow-wrap: anywhere; }
  .best-facts dd.none { color: var(--ink-3); font-family: var(--ui); }
  .best-open { margin-top: 12px; display: flex; gap: 8px; align-items: baseline; font: 14.5px var(--text); }
  .best-open .dir { flex-shrink: 0; color: var(--ink-2); }
  h2.section.group { font-size: 17px; margin: 28px 0 8px; }
  nav a.you { margin-bottom: 10px; background: var(--sheet); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; color: var(--ink); }
  nav a.you > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  nav a.you .n { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 11.5px var(--ui); }
  @media (max-width: 820px) { .best-facts { grid-auto-flow: row; grid-template-rows: none; grid-template-columns: 96px minmax(0, 1fr); } }

  /* questions & connections */
  .review { max-width: 72ch; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .review h2 { font: 500 19px/1.3 var(--display); margin: 0 0 6px; }
  .review .basis { font-size: 13.5px; color: var(--ink-2); margin: 0 0 8px; }
  .review .subjects a { margin-right: 14px; font-size: 14px; }
  .review .response { font: italic 15px var(--text); color: var(--ink-2); margin: 8px 0 0; }
  .review .note { margin-top: 10px; font-size: 14px; }
  .review button { font: 12px var(--ui); color: var(--ink-2); background: var(--sheet); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; cursor: pointer; margin-bottom: 6px; }

  .nav-toggle { display: none; }
  .mobile-status { display: none; }
  .skip { position: absolute; left: 16px; top: -80px; z-index: 2; background: var(--sheet); padding: 10px; }
  .skip:focus { top: 8px; }
  .mobile-back { display: none; margin-bottom: 14px; }
  .mobile-back a { font-size: 13.5px; color: var(--ink-2); }

  /* ---- the sheet: a page per row, facts in columns ---- */
  main.wide { max-width: none; }
  .sheet-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 12px; }
  .sheet-find { flex: 0 1 260px; min-width: 0; padding: 7px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--ink); font: 13.5px var(--ui); }
  .sheet-find:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .seg button { font: 12.5px var(--ui); color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
  .seg button .n { font: 11px var(--ui); color: var(--ink-3); }
  .seg button:hover { border-color: var(--blue-line); color: var(--ink); }
  .seg button.on { background: var(--sheet); border-color: var(--ink-3); color: var(--ink); }
  .seg button.on .n { color: var(--ink-2); opacity: 0.7; }
  .sheet-count { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
  .held-note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: -18px 0 20px; color: var(--ink-3); font-size: 12.5px; }
  .held-note button { min-height: 44px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--ink-2); font: 600 12px var(--ui); cursor: pointer; }
  .sheet-scroll { overflow: auto; max-height: calc(100vh - 150px); background: transparent; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; }
  table.sheet { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
  .sheet th { position: sticky; top: 0; z-index: 2; text-align: left; padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--paper); }
  .sheet th button { all: unset; box-sizing: border-box; display: flex; gap: 6px; align-items: center; width: 100%; padding: 9px 12px; letter-spacing: 0; text-transform: none; color: var(--ink-2); cursor: pointer; font: 600 12px var(--ui); }
  .sheet th button:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  .sheet th .arrow { color: var(--ink-3); opacity: 0.6; font-size: 11px; }
  .sheet th[aria-sort="ascending"] .arrow, .sheet th[aria-sort="descending"] .arrow { color: var(--blue); opacity: 1; }
  .sheet th.num button { justify-content: flex-end; }
  .sheet td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; color: var(--ink); max-width: 260px; min-width: 120px; overflow-wrap: normal; word-break: normal; }
  .sheet td.num { min-width: 0; }
  .sheet .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 200px; }
  .sheet td.wide .clamp { max-width: 360px; }
  .sheet tbody tr { cursor: pointer; }
  .sheet tbody tr:hover td { background: var(--line-2); }
  .sheet tbody tr:last-child td { border-bottom: 0; }
  .sheet td.num { text-align: right; white-space: nowrap; }
  .sheet td.mono-col { white-space: nowrap; font-size: 12px; }
  .sheet td.wide { min-width: 240px; max-width: 380px; color: var(--ink-2); }
  .sheet .name { position: sticky; left: 0; z-index: 1; min-width: 220px; max-width: 300px; box-shadow: inset -1px 0 0 var(--line-2); background: var(--paper); }
  .sheet th.name { z-index: 3; background: var(--paper); }
  .name-cell { display: flex; flex-direction: column; gap: 2px; }
  .name-cell .nm { display: flex; align-items: center; gap: 7px; font-weight: 600; }
  .name-cell .nm a { color: var(--ink); }
  .mobile-status-label { display: none; }
  .name-cell .sum { font-size: 12.5px; color: var(--ink-3); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sheet .open-col { min-width: 220px; max-width: 320px; }
  .open-cell { display: flex; gap: 7px; align-items: baseline; }
  .open-cell .dir { font-size: 9.5px; padding: 0 5px; border-radius: 3px; background: var(--lamp-soft); }
  .open-cell.theirs .dir { background: transparent; color: var(--ink-2); }
  .open-cell.plain .dir { background: var(--well); color: var(--quiet); }
  .open-cell .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .open-cell .more { font: 11px var(--ui); color: var(--ink-3); }
  .sheet td.none { text-align: center; color: var(--ink-3); padding: 28px; cursor: default; }

  .contact-directory { margin: 18px 0 24px; overflow: hidden; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; }
  .contact-directory summary { cursor: pointer; padding: 15px 18px; font-weight: 650; color: var(--ink); }
  .contact-directory summary:focus-visible { outline: 2px solid var(--blue); outline-offset: -3px; }
  .contact-directory .directory-body { padding: 0 18px 18px; }
  .contact-directory .directory-note { margin: 0 0 12px; color: var(--ink-2); font-size: 13px; line-height: 1.5; }
  .contact-directory .directory-note.warn { color: var(--lamp); }
  .contact-directory .directory-find { width: 100%; max-width: 420px; margin: 3px 0 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--sheet); color: var(--ink); font: inherit; }
  .contact-directory .directory-scroll { overflow-x: auto; }
  .contact-directory table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .contact-directory th, .contact-directory td { padding: 8px 9px; border-bottom: 1px solid var(--line); text-align: left; }
  .contact-directory th { color: var(--ink-3); font: 600 10px var(--ui); text-transform: none; letter-spacing: 0; }
  .contact-directory td:last-child, .contact-directory th:last-child { text-align: right; }
  .contact-directory .candidate-name { font-weight: 600; }
  .contact-directory .candidate-email { color: var(--ink-2); font: 12px var(--ui); }
  .contact-directory button { cursor: pointer; }
  .contact-directory td button { min-height: 36px; padding: 7px 10px; border: 1px solid var(--blue); border-radius: 5px; background: var(--blue-soft); color: var(--blue); font: 600 12px var(--ui); white-space: nowrap; }
  .contact-directory td button:hover, .contact-directory td button:focus-visible { background: var(--blue); color: var(--sheet); }
  .contact-directory td button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .contact-directory .directory-more { margin-top: 10px; border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; background: var(--well); color: var(--ink); }
  .contact-directory .directory-action td { padding: 12px; text-align: left; background: var(--well); color: var(--ink-2); font-size: 13px; }
  .contact-directory .directory-action code { display: block; overflow-wrap: anywhere; white-space: pre-wrap; margin-top: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--sheet); color: var(--ink); font: 11px/1.45 var(--ui); text-align: left; }
  .contact-directory .directory-action button { display: block; margin-top: 8px; }
  @media (max-width: 600px) {
    .contact-directory .directory-body { padding: 0 12px 14px; }
    .contact-directory .directory-scroll { overflow-x: visible; }
    .contact-directory table, .contact-directory tbody { display: block; width: 100%; }
    .contact-directory thead { display: none; }
    .contact-directory tbody > tr:not(.directory-action) { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; padding: 12px; margin: 0 0 9px; border: 1px solid var(--line); border-radius: 7px; }
    .contact-directory tbody > tr:not(.directory-action) > td { display: block; padding: 0; border: 0; min-width: 0; }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(1) { grid-column: 1 / -1; font-size: 15px; overflow-wrap: anywhere; }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(2) { grid-column: 1 / -1; overflow-wrap: anywhere; }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(3) { grid-column: 1; color: var(--ink-3); }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(3)::before { content: "Last · "; }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(4) { grid-column: 2; text-align: right; color: var(--ink-3); }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(4)::after { content: " mail"; }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(5) { grid-column: 1 / -1; text-align: left; margin-top: 5px; }
    .contact-directory td button { min-height: 44px; }
    .contact-directory .directory-action { display: block; margin: -9px 0 9px; }
    .contact-directory .directory-action td { display: block; border: 1px solid var(--line); border-radius: 0 0 7px 7px; }
  }

  /* People at 1440: every column fits (main 1136px); narrower, the sheet scrolls inside itself. */
  @media (min-width: 821px) { main.wide { padding-left: 28px; padding-right: 28px; } }
  .sheet th button { padding: 9px 9px; }
  .sheet td { padding: 8px 9px; min-width: 0; font-size: 13px; }
  .sheet .name { min-width: 180px; max-width: 200px; width: 190px; }
  .sheet .c-open { min-width: 220px; max-width: 250px; width: 240px; }
  .sheet .c-company, .sheet .c-role { min-width: 92px; max-width: 112px; }
  .sheet .c-company .clamp, .sheet .c-role .clamp { max-width: 112px; }
  .sheet .c-email { max-width: 140px; }
  .sheet .trunc { display: block; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .c-phone { min-width: 128px; max-width: 180px; white-space: normal; }
  .sheet .c-phone .mono { white-space: normal; overflow-wrap: anywhere; }
  .open-cell { flex-wrap: wrap; row-gap: 2px; }
  .open-cell .txt { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; flex-basis: 100%; }
  .name-cell .st { display: inline-flex; }
  /* A cut edge says so: a shadow where more columns wait to the right. */
  .sheet-box { position: relative; }
  .sheet-box::after { content: ""; position: absolute; right: 1px; bottom: 1px; top: var(--sheet-top, 0); width: 28px; pointer-events: none; border-radius: 0 8px 8px 0; background: linear-gradient(to right, transparent, rgba(23, 27, 43, 0.12)); opacity: 0; transition: opacity 150ms; }
  .sheet-box.clip-right::after { opacity: 1; }

  /* ---- under the title: what is open, how long, when you last spoke ---- */
  .leadrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 16px 0 0; }
  .leadrow:empty { display: none; }
  .lead-open { display: inline-flex; align-items: baseline; gap: 9px; max-width: 100%; color: var(--ink); text-decoration: none !important; background: transparent; box-shadow: none; border-radius: 0; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .lead-open.theirs { background: transparent; box-shadow: none; }
  .lead-open.plain { background: transparent; box-shadow: none; }
  .lead-open .txt { font: 14.5px var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
  .lead-open .age { font-size: 12px; color: var(--lamp); font-weight: 600; white-space: nowrap; }
  .lead-open.theirs .age, .lead-open.theirs .dir { color: var(--ink-2); }
  .lead-open.plain .dir { color: var(--quiet); }
  .lead-open .age.today { padding: 0 5px; border-radius: 3px; color: var(--lamp); background: var(--lamp-soft); }
  .lead-open .more { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .lead-calm { font: 600 10.5px var(--ui); letter-spacing: 0; text-transform: none; color: var(--ink-3); background: var(--well); padding: 5px 9px; border-radius: 4px; }
  .lead-meta { font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 8px; }
  .lead-meta.project-purpose-preview { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; width: 100%; font: 500 15px/1.4 var(--text); color: var(--ink); }
  .project-purpose-cites, .skill-finding-cites { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: 100%; font: 12px var(--ui); color: var(--ink-3); }
  /* Standalone source controls need a full touch target. */
  .project-purpose-cites a.cite, .skill-finding-cites a.cite { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; }
  .focus-head :is(.project-purpose-cites, .skill-finding-cites) { position: relative; z-index: 1; margin-top: 8px; color: var(--ink-2); }
  .focus-head :is(.project-purpose-cites, .skill-finding-cites) a.cite:hover, .focus-head :is(.project-purpose-cites, .skill-finding-cites) a.cite:focus-visible { background: var(--mark); }
  .focus-head :is(.project-purpose-cites, .skill-finding-cites) a.cite:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .lead-meta .k { color: var(--ink-3); }
  .lead-meta.usage .bar { width: 120px; height: 5px; border-radius: 3px; background: var(--well); overflow: hidden; display: inline-block; }
  .lead-meta.usage .bar i { display: block; height: 100%; background: var(--ink-3); }
  .unsure { font-size: 12.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 2px; }
  .unsure::first-letter { font: 700 11px var(--ui); }
  .unsure { border: 1px dashed var(--line); border-radius: 999px; padding: 1px 9px; }

  /* ---- insight: the lines your inbox could not tell you ---- */
  .insight { list-style: none; padding: 0 !important; margin: 0 0 1em; display: grid; gap: 10px; }
  .insight li { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 12px; align-items: baseline; margin: 0; }
  .insight .badge { letter-spacing: 0; text-transform: none; border-radius: 3px; background: transparent; color: var(--ink-2); font: 500 13px/1.5 var(--ui); text-align: left; }
  .insight .ins-at-stake .badge { background: transparent; color: var(--ink-2); }
  .insight .ins-changed .badge { background: transparent; color: var(--dawn); }
  .insight .ins-pattern .badge { background: transparent; color: var(--ink-2); box-shadow: none; }

  /* ---- facts: a definition list, empty fields visible (#2068) ---- */
  .panel .fill { margin: -6px 0 10px; font-size: 11px; color: var(--ink-3); }
  .factlist { display: grid; grid-template-columns: minmax(80px, min-content) minmax(0, 1fr); gap: 0; margin: 0; }
  .factlist dt { font: 600 10px/1.5 var(--ui); letter-spacing: 0; text-transform: none; color: var(--ink-3); padding: 7px 12px 7px 0; border-top: 1px solid var(--line-2); overflow-wrap: normal; }
  .factlist dd { margin: 0; padding: 5px 0 6px; border-top: 1px solid var(--line-2); font-size: 13.5px; min-width: 0; overflow-wrap: anywhere; position: relative; display: flex; flex-direction: column; gap: 2px; }
  .factlist dt:first-of-type, .factlist dd:first-of-type { border-top: 0; }
  .factlist dd.none { color: var(--ink-3); opacity: 0.75; font-size: 12.5px; }
  .factlist .val.mono > span:first-child { font: 11.5px var(--ui); }
  .factlist .val.derived { color: var(--ink-2); }
  .factlist .qual { margin-left: 6px; font: 10px var(--ui); color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .factlist .copy { position: absolute; right: 0; top: 5px; font: 10.5px var(--ui); color: var(--ink-3); background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; cursor: pointer; opacity: 0; }
  .factlist dd:hover .copy, .factlist .copy:focus-visible { opacity: 1; }
  .factlist dd:has(.copy) .val { padding-right: 44px; }
  .cite.run { padding: 3px 6px; }

  /* ---- the fact card: what you came for, at a glance (#2068) ---- */
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0; overflow: hidden; margin: 18px 0 26px; max-width: 980px; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; box-shadow: none; }
  .fact { padding: 11px 14px 12px; min-width: 0; background: transparent; box-shadow: none; border-bottom: 1px solid var(--line); }
  .fact .k { font: 600 10px var(--ui); letter-spacing: 0; text-transform: none; color: var(--ink-3); margin-bottom: 4px; }
  .fact .v { font-size: 14.5px; color: var(--ink); overflow-wrap: anywhere; line-height: 1.4; }
  .fact .v.mono { font-size: 13px; }
  .fact.wide { grid-column: span 2; }
  .fact.missing-fact { background: transparent; }
  .fact.missing-fact .v { color: var(--ink-3); font: italic 13px var(--text); }

  /* The memory surface: answer, connections, and activity before the full note. */
  .record-focus { max-width: 1120px; margin: 8px 0 34px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .focus-head { grid-column: 1 / -1; min-width: 0; padding: 16px 0 24px; color: var(--ink); border-bottom: 1px solid var(--line); }

  .focus-kicker { display: block; letter-spacing: 0; text-transform: none; font: 400 13px/1.4 var(--ui); color: var(--ink-3); }
  .focus-statement { max-width: 64ch; position: relative; z-index: 1; font: 20px/1.5 var(--text); margin: 8px 0 0; }
  .focus-limit { position: relative; z-index: 1; max-width: 64ch; margin: 12px 0 0; font: 13px/1.5 var(--ui); color: var(--ink-2); }
  .focus-statement.clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .focus-source { position: relative; z-index: 1; display: inline-flex; align-items: center; min-height: 44px; margin-top: 12px; padding: 0 12px; border: 1px solid var(--line); color: var(--ink); background: var(--sheet); border-radius: 6px; font: 500 13px var(--ui); }
  .focus-source:hover { color: var(--ink); background: var(--line-2); text-decoration: none; }
  .focus-source:focus-visible { outline-color: var(--ink); }
  .focus-command { cursor: pointer; margin-right: 8px; }
  .focus-next { position: relative; z-index: 1; max-width: 68ch; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
  .focus-next .k { display: block; font: 600 10px var(--ui); letter-spacing: 0; text-transform: none; color: var(--ink-2); }
  .focus-next p { margin: 5px 0 0; font: 15px/1.45 var(--text); }
  .focus-more { position: relative; z-index: 1; display: block; border: 0; background: transparent; color: var(--ink); cursor: pointer; margin: 4px 0 0; padding: 0; min-height: 44px; font: 600 12px var(--ui); text-decoration: underline; text-underline-offset: 3px; }
  .focus-more[hidden] { display: none; }
  .focus-section.next-exchanges { grid-column: 1 / -1; }
  .project-workspace { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .project-workspace.single { grid-template-columns: 1fr; }
  .project-workspace .focus-section { min-width: 0; }
  .project-workspace p, .project-workspace li { font: 15px/1.5 var(--text); }
  .project-workspace p { margin: 0; }
  .project-workspace ul { margin: 0; padding-left: 18px; }
  .project-workspace li { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .project-workspace .open-note { display: inline-block; margin-top: 12px; font: 600 12px var(--ui); }
  .focus-section { min-width: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; padding: 16px 0; }
  .focus-section h2 { margin: 0 0 14px; font: 600 18px/1.3 var(--display); }
  .focus-section .threads { margin: 0; padding: 0; }
  .focus-section .thread { margin: 0 0 8px; }
  .focus-section .thread:last-child { margin-bottom: 0; }
  .focus-facts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 0; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 16px 0; }
  .focus-fact { min-width: 0; }
  .focus-facts dt { font: 600 10px var(--ui); text-transform: none; letter-spacing: 0; color: var(--ink-3); }
  .focus-facts dd { margin: 6px 0 0; font-size: 13px; color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .contact-strip dd { display: block; }
  .contact-strip .contact-what { display: block; margin-top: 3px; font-size: 12px; color: var(--ink-2); }
  .contact-strip .copy { margin-left: 8px; font: 10.5px var(--ui); color: var(--ink-3); background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; cursor: pointer; vertical-align: 1px; }
  .relation-description { font: 13px/1.5 var(--ui); color: var(--ink-2); margin: 0 0 10px; }
  .relation-entry { min-width: 0; }
  .relation-provenance { font: 12px/1.5 var(--ui); color: var(--ink-2); padding: 7px 3px; overflow-wrap: anywhere; }
  .relation-provenance .cite { margin-left: 4px; }
  .relation-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 9px; }
  .relation-card { display: flex; flex-direction: column; gap: 5px; min-width: 0; text-decoration: none !important; transition: border-color .16s ease, transform .16s ease; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; padding: 16px 0; }

    const select = el("select", { class: "evidence-source-select private", "aria-label": "Source for this line" }, numbers.map(n => el("option", { value: n, text: chipLabel(r, n) })));
    select.value = source.n;
    select.onchange = () => openEvidence(r, select.value, trigger);
    panel.insertBefore(select, panel.querySelector(".evidence-claim"));
  }
  panel.appendChild(el("p", { class: "private-hidden-notice", text: "Source descriptions and original excerpts are hidden because their private content has not been classified. Use Show labelled passages in the menu to read them." }));
  if (context) {
    const text = excerpt + (context.truncated ? "…" : ""), quote = el("blockquote", { html: markedSpan(text, span?.source) });
    panel.appendChild(evidenceOriginal(context, quote));
  } else panel.appendChild(el("p", { class: "evidence-unavailable", text: "The original isn't in this snapshot." }));
  evidenceTrigger = trigger;
  panel.parentElement.hidden = false;
  document.body.classList.add("evidence-open");
  evidenceLayout();
  panel.scrollTop = 0;
  close.focus({ preventScroll: true });
  scrollEvidenceSpan(panel);
  return true;
}
document.addEventListener("keydown", event => {
  const panel = document.getElementById("evidence-panel");
  if (!panel || panel.parentElement.hidden) return;
  if (event.key === "Escape") { event.preventDefault(); closeEvidence(); }
  if (event.key !== "Tab" || innerWidth >= 1100) return;
  const controls = [...panel.querySelectorAll('a, button, input, select, summary')].filter(node => node.getClientRects().length);
  const first = controls[0], last = controls.at(-1);
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
});
window.addEventListener("hashchange", closeEvidence);
window.addEventListener("resize", evidenceLayout);
document.addEventListener("click", e => {
  const citation = e.target.closest("a.cite");
  if (!citation) return;
  const url = new URL(citation.href);
  const params = new URLSearchParams(url.hash.slice(1));
  const path = params.get("r"), number = (params.get("h") || "").replace(/^src-/, "");
  const r = byPath(path);
  if (r && openEvidence(r, number, citation)) e.preventDefault();
});

const qInput = document.getElementById("q");
const qClear = document.getElementById("q-clear");
qInput.addEventListener("input", e => {
  const q = e.target.value.trim();
  location.hash = q ? "q=" + encodeURIComponent(q) : "";
});
qClear.addEventListener("click", () => { qInput.value = ""; location.hash = ""; qInput.focus(); });

const rail = document.querySelector(".rail");
const toggle = document.querySelector(".nav-toggle");
function closeNav() { rail.dataset.open = "false"; toggle.setAttribute("aria-expanded", "false"); }
toggle.addEventListener("click", () => {
  const open = toggle.getAttribute("aria-expanded") !== "true";
  rail.dataset.open = String(open); toggle.setAttribute("aria-expanded", String(open));
});
document.querySelector(".skip").addEventListener("click", e => { e.preventDefault(); document.getElementById("main").focus(); });
document.getElementById("nav").addEventListener("click", e => {
  if (e.target.closest("a")) { closeNav(); document.getElementById("main").focus(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (document.activeElement === qInput) {
      if (qInput.value) { qInput.value = ""; location.hash = ""; } else qInput.blur();
      return;
    }
    closeNav();
    if (document.activeElement.closest("#nav")) toggle.focus();
  }
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    e.preventDefault(); qInput.focus();
  }
});
// ---- Languages ---------------------------------------------------------------
// A page read in another language. Translations are made by co ai on the Host
// (rem/translate.py) and cached beside the notebook; the page as written stays
// the record. A snapshot offers only the translations it carries; the live
// reader (served by rem_http.py) can ask the Host for any language.
// The menu offers the owner's own languages first (languages.py: detected from
// their mail and sessions, or `co rem config set languages`), then on a person
// the languages they speak, then the rest under "Other…". The page's own
// language is not offered: "As written" is that.
const READ_LANGUAGES = ["en", "zh", "zh-TW", "ja", "ko", "es", "fr", "de"];
function nativeName(tag) { return new Intl.DisplayNames([tag], { type: "language" }).of(tag) || tag; }
function languageBar(r) {
  const cached = Object.keys(r.translations || {});
  const offered = tag => tag !== r.written_in && (REM.live || cached.includes(tag));
  const yours = [...new Set(REM.your_languages || [])].filter(offered);
  const theirs = [...new Set(r.speaks || [])].filter(tag => offered(tag) && !yours.includes(tag));
  const rest = [...new Set([...READ_LANGUAGES, ...cached])].filter(tag => offered(tag) && !yours.includes(tag) && !theirs.includes(tag));
  if (!yours.length && !theirs.length && !rest.length) return null;
  const option = (tag, prefix) => el("option", { value: tag, text: (prefix || "") + nativeName(tag) + (cached.includes(tag) ? "" : " · translate with co ai") });
  const select = el("select", { "aria-label": "Read this page in" }, [el("option", { value: "", text: "As written" }),
    ...yours.map(tag => option(tag)), ...theirs.map(tag => option(tag, "Their language: ")),
    rest.length ? el("optgroup", { label: "Other…" }, rest.map(tag => option(tag))) : null]);
  select.value = r.shown || "";
  const status = el("span", { class: "lang-status", role: "status" });
  select.onchange = () => readIn(r, select.value, status, select);
  return el("div", { class: "lang-bar" }, [el("span", { text: "Read in" }), select, status]);
}
async function readIn(r, tag, status, select) {
  if (!tag || r.translations?.[tag]) return showLanguage(r, tag);
  select.disabled = true;
  status.textContent = "Translating with co ai… this takes a minute or two.";
  let answer = await askHost({ page: r.path, language: tag });
  while (answer.state === "running") {
    await new Promise(done => setTimeout(done, 2000));
    answer = await askHost({ page: r.path, language: tag });
  }
  select.disabled = false;
  if (answer.state === "failed") { status.textContent = "Not translated: " + answer.error; return; }
  (r.translations ||= {})[tag] = answer.text;
  showLanguage(r, tag);
}
function askHost(body) {
  return fetch("/rem/translate", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
    .then(response => response.status === 401 ? { state: "failed", error: "this tab is no longer signed in; run co rem open again" } : response.json())
    .catch(error => ({ state: "failed", error: "co ai is not answering (" + error.message + "); run co rem open again" }));
}
function showLanguage(r, tag) {
  r.original ??= r.text;
  r.text = tag ? r.translations[tag] : r.original;
  r.shown = tag;
  KNOWN.delete(r.path);
  render();
}

window.addEventListener("hashchange", render);
window.addEventListener("resize", refreshFocusExpansion);
render();
</script>
