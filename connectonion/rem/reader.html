<!doctype html>
<!--
  co rem reader. One self-contained file, no network, opened from file://.
  Python embeds a snapshot of the notebook where the placeholder below sits;
  everything after that is a client of the REM object and nothing else, so the
  same client can be served by a local server or a site later without changes.
  Note text is data: it reaches the DOM only through esc() or textContent.

  Design. co rem is named for REM sleep: overnight it consolidates the day's
  mail and coding sessions into pages. The home returns the changed context
  after the obligations waiting on the owner. Processing details remain
  available below the memory; a candidate connection stays a question until
  the owner reviews it. Every page opens on what is still open.
  - Palette: paper and ink, dawn indigo for changes, lamp amber for what
    waits on you, and a yellow mark shared by a claim and its source span.
  - Type: one system sans (SF / PingFang) for titles, prose and chrome, and
    mono only for commands and paths.
  - Fonts are local faces on purpose: a page of someone's private notes must
    not phone a font host on open.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>co rem</title>
<!-- The tab icon (D-132): the mark, drawn for 16 px and inline so nothing is fetched. The browser paints it
     outside the page and by the system's theme, so it cannot read var(): its four colours are the
     sheet's ink and paper, light and dark, written out (tests/unit/test_rem_reader_style_sheet.py). -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2034%2034%22%3E%3Cstyle%3E.f%7Bfill%3A%23121512%7D.sp%7Bfill%3Anone%3Bstroke%3A%23ffffff%3Bstroke-linecap%3Around%7D%40media%20(prefers-color-scheme%3Adark)%7B.f%7Bfill%3A%23eef0ed%7D.sp%7Bstroke%3A%230f110f%7D%7D%3C%2Fstyle%3E%3Cpath%20class%3D%22f%22%20d%3D%22M9%201h16a8%208%200%200%201%208%208v16a8%208%200%200%201-8%208H9a8%208%200%200%201-8-8V9a8%208%200%200%201%208-8z%22%2F%3E%3Cpath%20class%3D%22sp%22%20stroke-width%3D%223.4%22%20transform%3D%22translate(0%202.2)%22%20d%3D%22M5.82%2013.80A4.6%204.6%200%200%200%2013.78%2013.80M20.22%2013.80A4.6%204.6%200%200%200%2028.18%2013.80%22%2F%3E%3C%2Fsvg%3E">
<style>
  /* fuse:tokens */
  /* REM · N3 "Desk" (D-123): the whole token sheet. Outside it the reader may only name these
   (tests/unit/test_rem_reader_style_sheet.py). One white canvas; depth comes from elevation only.
   Colour meanings: green = the one primary action, red = overdue, pencil (dashed) = REM's guess.
   Dark is the same names under the two theme selectors. */
  :root {
    color-scheme: light;
    --paper: #ffffff; /* the only canvas colour */
    --raised: #ffffff; /* cards and widgets: in light mode depth comes from shadow only */
    --ink: #121512;
    --grey: #636863; /* second ink: meta, labels, quiet icons */
    --pencil: #a3a8a3; /* REM's inference: dashed borders, the night-chart line, never solid text */
    --rule: #e8eae7; /* hairlines and ring tracks */
    --well: #f5f6f4; /* insets inside a card: avatar discs, inputs, hover rows, segment tracks */
    --green: #22d27a; /* the one primary action per screen */
    --on-green: #05301b;
    --red: #c02a17; /* overdue only: fuse rings, N 天 labels */
    --scrim: rgba(255, 255, 255, .6); /* behind sheets */

    /* type: five sizes, two weights, one family (CJK + Latin); fonts are local on purpose */
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", Inter, sans-serif;
    --s-display: 44px; /* the single display element per screen: a count or a name */
    --s-head: 24px; /* a card's subject, a widget's big number */
    --s-body: 15px; /* sentences, letters, quotes */
    --s-ui: 13px; /* rows, chips, buttons in menus; the smallest size for running Chinese */
    --s-meta: 11px; /* dates, labels, badges: short labels only */
    --mono: ui-monospace, "SF Mono", Menlo, monospace; /* code and paths only */
    --w-regular: 400;
    --w-bold: 600;
    --lh-tight: 1.05;
    --lh-body: 1.55;
    --track-display: -0.035em;

    /* grid */
    --measure: 720px;
    --gap: 36px;
    --rail: 300px;
    --u1: 4px; --u2: 8px; --u3: 16px; --u4: 24px; --u5: 40px; --u6: 64px;

    /* lines */
    --hair: 1px;
    --rule-heavy: 2px;
    --fuse: 6px; /* the one heavy mark of the older fuse views (org timeline) */

    /* shape: cards 22, inner panels 16, controls 12, chips and the ⌘K bar fully round */
    --radius: 12px;
    --r-card: 22px;
    --r-inner: 16px;
    --r-pill: 999px;
    --round: 50%;
    --r-org: 30%; /* an organisation is a rounded square */
    --r-cell: 4px; /* a day in the contact rhythm */

    /* elevation: e1 resting card, e2 the one focus card per screen, e3 menus and sheets */
    --e1: 0 0 0 1px rgba(18, 21, 18, .06), 0 1px 2px rgba(18, 21, 18, .04), 0 8px 24px -10px rgba(18, 21, 18, .14);
    --e2: 0 0 0 1px rgba(18, 21, 18, .07), 0 2px 6px rgba(18, 21, 18, .05), 0 28px 60px -22px rgba(18, 21, 18, .30);
    --e3: 0 0 0 1px rgba(18, 21, 18, .08), 0 16px 40px -12px rgba(18, 21, 18, .28);
    --e-ring: inset 0 0 0 1px var(--rule); /* an outlined chip or an inset panel */
    --e-ink: inset 0 0 0 1.5px var(--ink); /* a chosen chip, a hovered control */
    --e-fuse: inset 0 0 0 1.5px rgba(192, 42, 23, .25); /* a fuse pill */
    --e-green: 0 8px 18px -8px rgba(34, 210, 122, .7); /* the one primary action lifts off the card */

    /* motion: it explains a change of state, never decorates */
    --t-press: 150ms; /* hover, colour */
    --t-state: 250ms; /* lift, menu pop, switch */
    --t-draw: 500ms; /* a card or widget rises */
    --t-stagger: 40ms;
    --t-burn: 1100ms; /* a fuse ring burns in */
    --t-ember: 1600ms; /* the most urgent fuse still glows */
    --t-night: 2400ms; /* the night chart draws up to now */
    --ease-out: cubic-bezier(.2, .7, .2, 1);
    --spring: cubic-bezier(.2, .9, .25, 1.15);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0f110f;
      --raised: #181b18;
      --ink: #eef0ed;
      --grey: #9aa09a;
      --pencil: #6b716b;
      --rule: #2a2e2a;
      --well: #20241f;
      --red: #ff5a3c;
      --e-fuse: inset 0 0 0 1.5px rgba(255, 90, 60, .3);
      --scrim: rgba(15, 17, 15, .6);
      --e1: 0 0 0 1px rgba(255, 255, 255, .06), 0 8px 24px -10px rgba(0, 0, 0, .6);
      --e2: 0 0 0 1px rgba(255, 255, 255, .09), 0 28px 60px -22px rgba(0, 0, 0, .8);
      --e3: 0 0 0 1px rgba(255, 255, 255, .10), 0 16px 40px -12px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0f110f;
    --raised: #181b18;
    --ink: #eef0ed;
    --grey: #9aa09a;
    --pencil: #6b716b;
    --rule: #2a2e2a;
    --well: #20241f;
    --red: #ff5a3c;
    --e-fuse: inset 0 0 0 1.5px rgba(255, 90, 60, .3);
    --scrim: rgba(15, 17, 15, .6);
    --e1: 0 0 0 1px rgba(255, 255, 255, .06), 0 8px 24px -10px rgba(0, 0, 0, .6);
    --e2: 0 0 0 1px rgba(255, 255, 255, .09), 0 28px 60px -22px rgba(0, 0, 0, .8);
    --e3: 0 0 0 1px rgba(255, 255, 255, .10), 0 16px 40px -12px rgba(0, 0, 0, .8);
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --t-press: 0ms; --t-state: 0ms; --t-draw: 0ms; --t-stagger: 0ms; --t-burn: 0ms; --t-ember: 0ms; --t-night: 0ms; }
  }
  /* A phone's display element is 36. */
  @media (max-width: 640px) { :root { --s-display: 36px; } }
  /* 设置 ▸ 减少动态效果: the same stillness, chosen in the reader. */
  :root.calm { --t-press: 0ms; --t-state: 0ms; --t-draw: 0ms; --t-stagger: 0ms; --t-burn: 0ms; --t-ember: 0ms; --t-night: 0ms; }
  /* /fuse:tokens */
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; background: var(--paper); color: var(--ink); font: var(--s-body)/1.55 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  a { color: var(--ink); text-decoration: none; }
  :is(p, .person-lead, .thread .who, .pass-summary, .note li, .what, .also-on, .relation-provenance, .lead-meta, .empty) a {
    text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 55%, transparent); text-underline-offset: 3px;
  }
  a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: var(--radius); }
  /* Fuse has no shadow, so rings became hairline outlines declared later with one or two classes; three
     selectors' weight lets the focus ring win without !important. #main and the Today cards are focused by
     script (tabindex=-1) and keep their own rules, as do text fields. */
  :root :focus-visible:not([tabindex="-1"], input, textarea) { outline: var(--rule-heavy) solid var(--ink); }
  code { font: var(--s-body) var(--mono); }
  .mono { font-family: var(--font); font-variant-numeric: tabular-nums; }
  svg.moon { width: 11px; height: 11px; flex-shrink: 0; color: var(--grey); vertical-align: -1px; }

  .privacy-tag { font: var(--s-meta) var(--font); letter-spacing: 0; text-transform: none; padding: 0 5px; margin: 0 2px; border-radius: var(--radius); border: 1px solid var(--rule); color: var(--grey); background: var(--rule); white-space: nowrap; }
  .privacy-tag.sensitive { border-color: var(--grey); color: var(--ink); font-weight: var(--w-bold); }
  :root.hide-private .private, :root.hide-private li.private-item { display: none; }
  :root.hide-private .privacy-only .privacy-content { display: none; }
  .private-hidden-notice, .private-history-notice { display: none; }
  :root.hide-private .private-entry { display: none; }
  :root.hide-private :is(.timeline, .activity-list):not(:has(> li:not(.private-entry))) + .private-history-notice { display: block; }
  :root.hide-private .tl:not(:has(> li.tl-e:not(.private-entry))) { display: none; }
  :root.hide-private .tl:not(:has(> li.tl-e:not(.private-entry))) + .private-history-notice { display: block; }
  .private-history-notice, :root.hide-private .person-insight dd.privacy-only { color: var(--grey); font: var(--s-meta)/1.5 var(--font); }
  :root.hide-private .person-insight dd.privacy-only .private-hidden-notice { margin: 0; }
  :root.hide-private .private-hidden-notice { display: block; }

  /* ---- main ---- */
  main { min-width: 0; width: 100%; overflow-wrap: anywhere; padding: 32px 40px 80px; max-width: 1180px; }
  main:focus { outline: none; }
  .eyebrow { letter-spacing: 0; text-transform: none; color: var(--grey); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: var(--s-meta)/1.4 var(--font); margin-bottom: 8px; }
  .eyebrow a { color: var(--ink); }
  .eyebrow .sep { color: var(--rule); }
  .eyebrow .when { text-transform: none; letter-spacing: 0; }
  h1 { font: var(--w-regular) var(--s-head)/1.15 var(--font); letter-spacing: -0.01em; margin: 0 0 8px; text-wrap: balance; color: var(--ink); }
  .lede { color: var(--grey); font: var(--s-body)/1.55 var(--font); margin: 0 0 24px; max-width: 64ch; }
  .lede b { color: var(--ink); font-weight: var(--w-bold); }
  h2.section { font: var(--w-bold) var(--s-body)/1.3 var(--font); margin: 32px 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  h2.section .n { font: var(--s-meta) var(--font); color: var(--grey); text-align: right; font-weight: var(--w-regular); }
  h2.section .n a { color: var(--grey); }
  .section-sub { color: var(--grey); font-size: var(--s-meta); margin: 0 0 14px; }

  /* status: a moon phase, full when investigated */
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: var(--radius); font: var(--w-regular) var(--s-meta)/1.6 var(--font); letter-spacing: 0; text-transform: none; white-space: nowrap; background: var(--rule); color: var(--grey); }
  .pill.status.mapped { background: transparent; outline: var(--hair) solid var(--rule); outline-offset: calc(-1 * var(--hair)); color: var(--grey); }
  .pill.status.mapped svg.moon { color: var(--grey); }
  .pill.quiet { background: var(--rule); color: var(--grey); }
  .pill.warn { background: var(--rule); color: var(--grey); }

  /* ---- the night: the home's one loud thing ---- */
  .night { position: relative; border-radius: var(--radius); background: var(--ink); color: var(--paper); overflow: hidden; margin: -32px -40px 32px; padding: 24px 40px; }
  .night > * { position: relative; }
  .night .kicker { letter-spacing: 0; text-transform: none; color: var(--grey); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font: var(--w-regular) var(--s-body)/1.5 var(--font); }
  .night .kicker svg { width: 14px; height: 14px; color: var(--paper); }
  .night .thesis { text-wrap: balance; font: var(--s-body)/1.45 var(--font); max-width: 64ch; margin: 12px 0 16px; }
  .night .thesis b { font-weight: var(--w-bold); color: var(--paper); }
  .night .stats { flex-wrap: wrap; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 24px; margin: 12px 0 0; }
  .night .stat .v { color: var(--paper); font: var(--w-bold) var(--s-body)/1.4 var(--font); }
  .night .stat .k { color: var(--grey); letter-spacing: 0; font: var(--s-meta)/1.5 var(--font); margin-top: 0; }
  .night .stat.warn .v { color: var(--paper); }
  .hypno { position: relative; height: 100px; margin: 12px 0 8px; }
  .hypno svg { display: block; width: 100%; height: 84px; overflow: visible; }
  .hypno .grid { stroke: var(--grey); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-dasharray: 2 4; }
  .hypno .trace { fill: none; stroke-dashoffset: 0; stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke: var(--pencil); stroke-width: 1.6; stroke-linecap: round; }
  .hypno .area { fill: var(--pencil); opacity: 0.13; }
  .hypno .day { position: absolute; top: 88px; padding-left: 4px; color: var(--grey); white-space: nowrap; font: var(--s-meta) var(--font); }
  .hypno .dot { position: absolute; border-radius: var(--round); background: var(--paper); width: 6px; height: 6px; margin: -3px 0 0 -3px; }
  .hypno .dot.woke { background: var(--grey); }
  .night .legend { font: var(--s-meta) var(--font); color: var(--grey); display: flex; gap: 16px; flex-wrap: wrap; }
  .night .legend i { display: inline-block; width: 7px; height: 7px; border-radius: var(--round); margin-right: 6px; vertical-align: 0; }
  .night .changes { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--grey); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
  .night .changes .page-names { min-width: 0; flex: 1; line-height: 1.8; }
  .night .changes .k { font: var(--s-meta) var(--font); color: var(--grey); margin-right: 4px; letter-spacing: 0; }
  .night .changes a { color: var(--paper); font-size: var(--s-meta); border-radius: var(--radius); background: transparent; padding: 2px 0; text-decoration: none; }
  .night .changes a:hover { text-decoration: underline; }
  .night code { font: var(--s-meta) var(--font); color: var(--paper); background: var(--grey); padding: 2px 7px; border-radius: var(--radius); }
  .night p { margin: 0; color: var(--grey); font-size: var(--s-body); }

  /* Waiting comes before rewrites; quieter context stays in the margin (UI audit #1–4). */
  /* Waiting on you is the count that asks something of the owner: heavier, not a hue. */
  .waiting-intro, .quiet-line { color: var(--grey); font-size: var(--s-body); }
  .today-brief .section { margin-top: 0; }
  .owner-slot { background: var(--paper); color: var(--ink); border: 1px dashed var(--pencil); border-radius: var(--radius); padding: 2px 5px; box-decoration-break: clone; }
  .draft-reason { grid-column: 1 / -1; }
  .task-result { grid-column: 1 / -1; min-width: 0; padding: 16px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); }
  .task-result p { margin: 6px 0 12px; overflow-wrap: anywhere; }
  .task-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 8px; }
  .task-result textarea { box-sizing: border-box; display: block; width: 100%; min-height: 100px; margin: 12px 0; padding: 10px; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--radius); font: var(--s-body)/1.6 var(--font); resize: vertical; }
  .today-threads { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .btn-act { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border-radius: var(--radius); background: var(--green); color: var(--on-green) !important; font: var(--w-bold) var(--s-body) var(--font); text-decoration: none !important; white-space: nowrap; transition: background var(--t-press) var(--ease-out), color var(--t-press) var(--ease-out); }
  /* The primary key turns over on hover: green label on the dark green, both from the sheet. */
  .btn-quiet { min-height: 40px; padding: 0 10px; border: 0; background: transparent; color: var(--grey); font: var(--w-regular) var(--s-meta) var(--font); cursor: pointer; border-radius: var(--radius); }
  .btn-quiet:hover { color: var(--ink); background: var(--rule); }
  .thread-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 10px; }
  /* ---- the writer: full screen, one letter ---- */
  .writer { width: min(1180px, 96vw); height: min(860px, 94vh); max-width: none; max-height: none; padding: 0; border: 0; border-radius: var(--radius); background: var(--paper); color: var(--ink); display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); overflow: hidden; }
  .writer::backdrop { background: color-mix(in srgb, var(--paper) 70%, transparent); backdrop-filter: blur(2px); }
  .writer-letter { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--rule); }
  .writer-letter .mail-head { padding: 18px 24px 12px; }
  .writer-body { flex: 1; min-height: 0; resize: none; border: 0; outline: none; padding: 20px 24px; font: var(--s-body)/1.65 var(--font); color: var(--ink); background: var(--paper); }
  .writer-actions { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--rule); }
  .writer-side { overflow-y: auto; padding: 22px 24px; background: var(--paper); font: var(--s-body)/1.6 var(--font); color: var(--grey); }
  .writer-side h3 { margin: 0 0 6px; font: var(--w-bold) var(--s-body)/1.3 var(--font); color: var(--ink); }
  .writer-side h3 a { color: inherit; }
  .writer-side h4 { margin: 20px 0 6px; font: var(--w-bold) var(--s-meta)/1.4 var(--font); color: var(--grey); }
  .writer-side p { margin: 0; white-space: pre-wrap; }
  .writer-brief { color: var(--grey); }
  .writer-msg { padding: 10px 0; border-top: 1px solid var(--rule); }
  .writer-msg-head { font: var(--w-bold) var(--s-meta)/1.4 var(--font); color: var(--grey); margin-bottom: 4px; }
  .writer-msg-text { white-space: pre-wrap; font: var(--s-meta)/1.55 var(--font); color: var(--grey); max-height: 14em; overflow: hidden; }
  @media (max-width: 719px) {
    .writer { width: 100vw; height: 100dvh; border-radius: var(--radius); grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .writer-letter { border-right: 0; }
    .writer-side { max-height: 38dvh; border-top: 1px solid var(--rule); }
  }
  .kind-badge { display: inline-block; margin-right: 10px; padding: 1px 7px; border-radius: var(--radius); border: 1px solid var(--rule); font: var(--w-regular) var(--s-meta)/1.6 var(--font); color: var(--grey); background: var(--paper); }
  .kind-badge.mail::before { content: "✉"; margin-right: 4px; color: var(--grey); }
  .draft-now { display: inline-flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
  .draft-now .draft-status:empty { display: none; }
  /* ---- a reply shown as the mail it becomes ---- */
  .mail-channels { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--radius); background: var(--rule); margin-bottom: 6px; }
  .mail-channels .channel { border: 0; background: transparent; padding: 3px 10px; border-radius: var(--radius); font: var(--w-regular) var(--s-meta) var(--font); color: var(--grey); cursor: pointer; }
  .mail-channels .channel.active { background: var(--paper); color: var(--ink); font-weight: var(--w-bold); cursor: default; }
  .mailcard.chat .mail-text { font-size: var(--s-body); border-radius: var(--radius); margin: 12px 16px; padding: 12px 14px; background: var(--rule); color: var(--ink); }
  .mailcard.chat .mail-body { background: var(--paper); }
  .mailcard { grid-column: 1 / -1; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); overflow: hidden; }
  .mail-head { padding: 10px 16px 8px; border-bottom: 1px solid var(--rule); display: grid; gap: 4px; }
  .mail-row { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 8px; font: var(--s-meta)/1.5 var(--font); min-width: 0; }
  .mail-row .k, .mail-gist .k, .mail-why .k { color: var(--grey); }
  .mail-row .v { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-row .addr { color: var(--grey); }
  .mail-row .subject { font-weight: var(--w-bold); }
  .mail-body { display: grid; gap: 0; }
  .mail-body.bilingual { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .mail-text { padding: 14px 16px; white-space: pre-wrap; font: var(--s-body)/1.6 var(--font); color: var(--ink); background: var(--paper); }
  .mail-gist { padding: 14px 16px; border-left: 1px solid var(--rule); font: var(--s-meta)/1.6 var(--font); color: var(--grey); }
  .mail-gist .k { display: block; font-size: var(--s-meta); margin-bottom: 4px; }
  .mail-gist p { margin: 0; white-space: pre-wrap; }
  .mail-why { margin: 0; padding: 10px 16px; border-top: 1px solid var(--rule); font: var(--s-meta)/1.55 var(--font); color: var(--grey); }
  .mail-why .k { font-weight: var(--w-bold); }
  .mail-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 12px 16px; border-top: 1px solid var(--rule); background: var(--paper); }
  .mail-note { margin-left: auto; font: var(--s-meta) var(--font); color: var(--grey); }
  .mail-status { margin: 0; padding: 0 16px 10px; background: var(--paper); }
  .mail-status:empty { display: none; }
  .mail-done { margin: 0; padding: 14px 16px; font: var(--w-bold) var(--s-body) var(--font); color: var(--ink); }
  @media (max-width: 820px), (pointer: coarse) { .btn-act, .btn-quiet, .mail-channels .channel { min-height: 44px; } }
  @media (max-width: 719px) {
    /* The first screen keeps Send in reach: the letter is clamped and the gist
       waits for the writer; the background stays, because approval needs it. */
    .mail-body.bilingual { grid-template-columns: minmax(0, 1fr); }
    .mail-text { max-height: 7.2em; overflow: hidden; -webkit-mask-image: linear-gradient(var(--ink) 70%, transparent); mask-image: linear-gradient(var(--ink) 70%, transparent); }
    .mail-gist { display: none; }
    .mail-why { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .mail-note { flex-basis: 100%; margin-left: 0; }
  }
  .waiting-more { color: var(--grey); font-size: var(--s-meta); }
  .overnight .claim-grid { display: block; }
  .overnight .claim-card { border: 0; border-radius: var(--radius); background: transparent; border-top: 0; padding: 16px 0; }
  .gone-quiet { margin-top: 28px; color: var(--grey); }
  .quiet-list { list-style: none; padding: 0; font-size: var(--s-meta); }
  .quiet-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); }
  .quiet-list p { margin: 4px 0 0; color: var(--grey); font: var(--s-meta)/1.4 var(--font); }
  .quiet-list span { white-space: nowrap; color: var(--grey); }
  /* Morning recall: the foreground is what the notebook retained, not its run log. */
  .morning { margin: 24px 0 0; padding: 24px 0; border-top: 1px solid var(--rule); color: var(--ink); }

  .morning-top { display: flex; justify-content: space-between; gap: 18px; align-items: start; border-bottom: 1px solid var(--rule); padding-bottom: 22px; }
  .morning-kicker { display: block; color: var(--grey); font: var(--w-bold) var(--s-meta)/1.4 var(--font); text-transform: none; letter-spacing: 0; }
  .morning h2 { max-width: 22ch; font: var(--w-regular) var(--s-head)/1.12 var(--font); letter-spacing: -.02em; margin: 9px 0 0; text-wrap: balance; }
  .morning-time { flex-shrink: 0; color: var(--grey); font: var(--s-meta)/1.5 var(--font); }
  .inspection-link { display: inline-block; margin-top: 14px; padding: 0; border: 0; background: none; color: var(--grey); font: var(--s-meta) var(--font); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
  .first-map-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .first-map-actions a, .first-map-actions button { display: inline-flex; align-items: center; min-height: 44px; padding: 9px 14px; border: 1px solid var(--rule); border-radius: var(--radius); background: transparent; color: var(--grey); font: var(--w-bold) var(--s-meta) var(--font); text-decoration: none; cursor: pointer; }
  .first-map-actions a { background: var(--paper); color: var(--ink); }
  .first-map-held { margin: 16px 0 0; color: var(--grey); font-size: var(--s-meta); }
  .memory-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
  .memory-card { min-width: 0; padding: 24px 22px 12px 0; }
  .memory-card + .memory-card { border-left: 1px solid var(--rule); padding-left: 22px; }
  .memory-card .kind { color: var(--grey); font: var(--s-meta)/1.4 var(--font); text-transform: none; letter-spacing: 0; }
  .memory-card h3 { font: var(--w-regular) var(--s-body)/1.25 var(--font); margin: 9px 0 10px; }
  .memory-card h3 a, .memory-card .open { color: var(--grey); }
  .memory-card p { margin: 0 0 12px; color: var(--grey); font: var(--s-body)/1.5 var(--font); }
  .memory-card .project-purpose { color: var(--grey); font-size: var(--s-meta); }
  .memory-card .open { display: inline-flex; min-height: 44px; align-items: center; font: var(--s-meta) var(--font); text-decoration: underline; text-underline-offset: 4px; }
  .memory-empty { margin: 22px 0 0; color: var(--grey); font: var(--s-body)/1.5 var(--font); }
  .memory-connection { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 17px; margin-top: 8px; font-size: var(--s-meta); }
  .memory-connection .label { color: var(--grey); font: var(--s-meta) var(--font); letter-spacing: 0; text-transform: none; }
  .memory-connection a { color: var(--grey); }
  .memory-connection .relation { color: var(--grey); }
  .memory-connection .basis { color: var(--grey); }
  .connection-review { margin-top: 14px; padding: 20px 27px; border: 1px solid var(--rule); background: var(--paper); border-color: var(--rule); border-radius: var(--radius); }
  .connection-review .label { letter-spacing: 0; text-transform: none; color: var(--ink); font: var(--w-regular) var(--s-meta) var(--font); }
  .connection-review h2 { font: var(--w-regular) var(--s-body)/1.3 var(--font); margin: 7px 0; }
  .connection-review p { margin: 0 0 10px; color: var(--grey); font-size: var(--s-meta); }
  .connection-review .subjects { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: var(--s-meta); }
  .night-details { margin-top: 60px; border-top: 1px solid var(--rule); padding-top: 10px; }
  .night-details .night { margin-top: 10px; }

  /* ---- this week: what was rewritten ---- */
  .week { list-style: none; padding: 0; margin: 10px 0 0; border-top: 1px solid var(--rule); }
  .week li { display: grid; grid-template-columns: 64px 14px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .week .d { font-size: var(--s-meta); color: var(--grey); text-align: right; }
  .week .w { display: flex; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
  .week .w a { color: var(--ink); font-weight: var(--w-bold); }
  .week .meta { font-size: var(--s-meta); color: var(--grey); }
  .week .s { flex-basis: 100%; font: var(--s-body)/1.45 var(--font); color: var(--grey); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* skills: the most-used as cards, everything else as an index that fills the width (sprint 13) */
  .skills-find { display: block; width: min(100%, 420px); min-height: 44px; margin: 4px 0 28px; padding: 0 14px; border: 0; border-radius: var(--r-pill); background: var(--well); color: var(--ink); font: var(--s-body) var(--font); }
  .skills-find::placeholder { color: var(--grey); }
  .skills-view a { color: inherit; text-decoration: none; }
  .skills-view .skill-name { color: var(--ink); font: var(--w-bold) var(--s-body)/1.35 var(--font); overflow-wrap: anywhere; }
  .skills-view .skill-line { display: block; color: var(--grey); font: var(--s-ui)/1.45 var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skills-view .skill-uses { color: var(--grey); font: var(--s-ui) var(--font); white-space: nowrap; }
  .skills-top .section { margin-top: 0; }
  .skill-cards { list-style: none; margin: 0 0 28px; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .skill-card { display: flex; flex-direction: column; gap: 4px; height: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: var(--r-inner); background: var(--raised); box-shadow: var(--e1); }
  .skill-card .skill-line { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .skill-card .skill-uses { margin-top: auto; padding-top: 4px; }
  .skill-card:hover { box-shadow: var(--e-ink); }
  .skill-item:hover { background: var(--well); }
  .skill-shape { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 20px; }
  .skill-shape .k { color: var(--ink); font: var(--w-bold) var(--s-body) var(--font); margin-right: 8px; }
  .skill-shape button { min-height: 44px; padding: 0 10px; border: 0; border-radius: var(--r-pill); background: var(--well); color: var(--ink); font: var(--s-ui) var(--font); cursor: pointer; }
  .skill-shape .n, .skill-family h3 .n { margin-left: 6px; color: var(--grey); font-weight: var(--w-regular); }
  .skill-family { margin-bottom: 20px; }
  .skill-family h3 { margin: 0 0 4px; padding: 8px 0 6px; border-bottom: 1px solid var(--rule); color: var(--ink); font: var(--w-bold) var(--s-body) var(--font); letter-spacing: 0; text-transform: none; }
  .skill-family ul, .skill-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); column-gap: 40px; }
  .skill-family li, .skill-grid li { min-width: 0; }
  .skill-item { display: block; min-height: 44px; padding: 6px 8px; margin: 0 -8px; border-radius: var(--radius); }
  .skill-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
  .skill-family h3:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .skill-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .skills-empty { margin-top: 12px; }

  /* ---- open threads: who owes whom ---- */
  .bands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; margin-top: 12px; }
  .bands > .band:last-child:nth-child(3) { grid-column: 1 / -1; }
  .band h3 { display: flex; justify-content: space-between; align-items: baseline; letter-spacing: 0; text-transform: none; color: var(--grey); margin: 0 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--rule); font: var(--w-bold) var(--s-body) var(--font); }
  .band .threads .thread { grid-template-columns: 76px minmax(0, 1fr) auto; padding: 16px 0; }
  .band-none { color: var(--grey); font-size: var(--s-meta); margin: 8px 0 0; }
  .thread .when.today { padding: 0 5px; border-radius: var(--radius); color: var(--ink); background: var(--paper); }
  @media (max-width: 1100px) { .bands { grid-template-columns: minmax(0, 1fr); } }
  .threads { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--rule); }
  .thread { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; padding: 16px 0; background: transparent; border: 0; border-bottom: 1px solid var(--rule); border-radius: var(--radius); }
  .dir { letter-spacing: 0; text-transform: none; color: var(--ink); white-space: nowrap; font: var(--w-regular) var(--s-meta)/1.5 var(--font); }
  .thread.theirs .dir { color: var(--grey); }
  .thread.plain .dir { color: var(--grey); }
  .thread .what { color: var(--ink); font: var(--s-body)/1.55 var(--font); }
  .also-on { color: var(--grey); font: var(--s-meta)/1.5 var(--font); margin-top: 4px; overflow-wrap: anywhere; }
  .also-on a { color: inherit; }
  .thread .who { font-size: var(--s-meta); color: var(--grey); margin-top: 3px; font-family: var(--font); }
  .thread .when { font: var(--s-meta) var(--font); color: var(--grey); white-space: nowrap; }

  /* ---- rows: a page as one line of what it knows ---- */
  .hits { list-style: none; margin: 0; padding: 0; max-width: 80ch; border-top: 1px solid var(--rule); }
  .changed-pages { max-width: 80ch; }
  .hits.cols { max-width: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
  .hits > li { padding: 13px 0 14px; border-bottom: 1px solid var(--rule); min-width: 0; }
  .hits .t { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .hits .t > span:first-child { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .hits .t a { color: var(--ink); font-weight: var(--w-bold); font-size: var(--s-body); }
  .hits.skills .t a { display: inline-flex; align-items: center; min-width: 44px; min-height: 44px; overflow-wrap: anywhere; }
  .hits .t .meta { font-size: var(--s-meta); color: var(--grey); }
  .hits .when { font: var(--s-meta) var(--font); color: var(--grey); white-space: nowrap; }
  .hits .hit { margin-top: 4px; color: var(--grey); font: var(--s-body)/1.5 var(--font); }
  .hits .hit.ui { font-family: var(--font); font-size: var(--s-meta); }
  .hits .open { color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
  .hits .open .k { flex-shrink: 0; font: var(--w-bold) var(--s-meta)/1.9 var(--font); letter-spacing: 0; text-transform: none; color: var(--grey); background: transparent; padding: 0 6px; border-radius: var(--radius); }
  .hits .eyebrow { margin-bottom: 4px; }
  .usage { display: flex; align-items: center; gap: 10px; margin-top: 6px; font: var(--s-meta) var(--font); color: var(--grey); }
  .usage .bar { width: 120px; height: 4px; border-radius: var(--radius); background: var(--rule); overflow: hidden; flex-shrink: 0; }
  .usage .bar i { display: block; height: 100%; background: var(--grey); border-radius: var(--radius); }
  mark { background: var(--rule); color: var(--ink); padding: 0; border-radius: var(--radius); box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  /* the home's quick entry: one shelf per kind of page */
  .shelves { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px 40px; margin-top: 14px; }
  .shelf h3 { font: var(--w-bold) var(--s-meta) var(--font); letter-spacing: 0; text-transform: none; color: var(--grey); margin: 0 0 6px; padding-bottom: 7px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; }
  .shelf h3 a { color: inherit; }
  .shelf .ask { font: italic var(--s-meta)/1.4 var(--font); color: var(--grey); margin: 0 0 6px; }
  .toc { list-style: none; margin: 0; padding: 0; }
  .toc li { padding: 4px 0; font-size: var(--s-body); line-height: 1.4; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .toc li > a:first-of-type { color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc li > a:hover { color: var(--ink); }
  .toc .when, .toc .path-hint { margin-left: auto; font: var(--s-meta) var(--font); color: var(--grey); white-space: nowrap; flex-shrink: 0; }
  .toc .path-hint { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .toc .more { color: var(--ink); font-size: var(--s-meta); }

  /* the engine room: maintenance, kept below everything */
  .maint { margin-top: 64px; border-top: 1px solid var(--rule); padding-top: 8px; }
  .maint > summary { flex-wrap: nowrap; cursor: pointer; list-style: none; padding: 10px 0; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  .maint > summary::-webkit-details-marker { display: none; }
  .maint > summary h2 { font: var(--w-regular) var(--s-body) var(--font); margin: 0; display: inline; }
  .maint > summary .n { font: var(--s-meta) var(--font); color: var(--grey); }
  .maint > summary::after { content: "+"; font: var(--s-body) var(--font); color: var(--grey); flex: none; white-space: nowrap; }
  .maint[open] > summary::after { content: "−"; }
  .maint .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px 22px; margin: 6px 0 16px; }
  .maint .k { font: var(--s-meta) var(--font); letter-spacing: 0; text-transform: none; color: var(--grey); }
  .maint .v { font: var(--w-regular) var(--s-body) var(--font); margin-top: 3px; }
  .maint .state { font-size: var(--s-body); color: var(--grey); margin: 4px 0 14px; max-width: 72ch; }
  .activity-runs { list-style: none; margin: 0; padding: 0; max-width: 80ch; border-top: 1px solid var(--rule); }
  .activity-runs > li { padding: 12px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
  .run-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; font-size: var(--s-body); }
  .run-meta { margin-top: 3px; font-size: var(--s-meta); color: var(--grey); }
  .run-pages { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 6px; font-size: var(--s-body); min-width: 0; overflow-wrap: anywhere; }
  .run-pages .k { font: var(--w-bold) var(--s-meta)/1.9 var(--font); letter-spacing: 0; text-transform: none; color: var(--grey); }
  .run-pages .k.warn { color: var(--grey); }
  .run-pages .why { flex-basis: 100%; color: var(--grey); font-size: var(--s-meta); }
  .activity-runs .run-trace { margin: 4px 0 0; border-bottom: 0; }
  .activity-shelf { margin-top: 28px; border-top: 1px solid var(--rule); }
  .activity-shelf > summary { cursor: pointer; padding: 12px 0; min-height: 44px; box-sizing: border-box; font: var(--w-regular) var(--s-body) var(--font); color: var(--grey); }
  .run-trace { margin: 8px 0; border-bottom: 1px solid var(--rule); }
  .run-trace > summary { cursor: pointer; padding: 8px 0; font: var(--s-meta) var(--font); color: var(--grey); }
  .run-trace h3 { font: var(--w-bold) var(--s-meta) var(--font); margin: 12px 0 4px; }
  .run-trace ul { padding-left: 20px; margin: 4px 0 12px; }
  .run-trace li, .run-trace pre { font: var(--s-meta)/1.5 var(--font); overflow-wrap: anywhere; white-space: pre-wrap; }
  .run-trace pre { max-height: 240px; overflow: auto; }

  /* ---- a page ---- */
  .page-head { margin-bottom: 26px; }
  .standfirst { color: var(--ink); margin: 6px 0 0; max-width: 62ch; font: var(--w-regular) var(--s-body)/1.5 var(--font); }
  .page-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 56px; }
  .page-grid > .side { margin: 26px 0 0; max-width: 66ch; }
  .panel { font-size: var(--s-meta); border: 0; border-top: 1px solid var(--rule); border-radius: var(--radius); background: transparent; padding: 16px 0; }
  .panel + .panel { margin-top: 12px; }
  .panel h3 { font: var(--w-bold) var(--s-meta) var(--font); letter-spacing: 0; text-transform: none; color: var(--grey); margin: 0 0 10px; }
  .panel dl { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px 10px; margin: 0; }
  .panel dt { color: var(--grey); font-size: var(--s-meta); }
  .panel dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .panel dd.mono, .panel dd .mono { font-size: var(--s-meta); }
  .unk { color: var(--grey); }
  .bigstat { display: flex; align-items: baseline; gap: 8px; }
  .bigstat .v { font: var(--w-regular) var(--s-head)/1 var(--font); color: var(--ink); }
  .bigstat .k { font-size: var(--s-meta); color: var(--grey); }
  .panel .usage { margin-top: 10px; }
  .panel .usage .bar { width: 100%; height: 6px; }
  .panel p { margin: 8px 0 0; color: var(--grey); }

  .note { max-width: 66ch; font: var(--s-body)/1.55 var(--font); color: var(--ink); }
  .note p { margin: 0 0 1em; }
  .note > h2 { font: var(--w-bold) var(--s-body)/1.3 var(--font); margin: 32px 0 12px; position: relative; display: flex; align-items: baseline; gap: 10px; }
  .note > h2::after { content: ""; flex: 1; height: 1px; background: var(--rule); transform: translateY(-5px); }
  .note > h2:first-child { margin-top: 0; }
  .note h3 { font: var(--w-bold) var(--s-body)/1.3 var(--font); margin: 1.5em 0 0.4em; position: relative; }
  .note h4, .note h5, .note h6 { font: var(--w-bold) var(--s-body)/1.3 var(--font); margin: 1.3em 0 0.4em; }
  .heading-anchor { opacity: 0; font: var(--w-regular) var(--s-meta) var(--font); color: var(--grey); text-decoration: none !important; }
  .note :is(h2,h3,h4):hover .heading-anchor, .heading-anchor:focus-visible { opacity: 1; }
  .heading-anchor:hover { color: var(--ink); }
  .note ul, .note ol { padding-left: 1.25em; margin: 0 0 1em; }
  .note li { margin: 0.3em 0; }
  .note li > p { margin-bottom: 0.25em; }
  .note li > ul, .note li > ol { margin-bottom: 0.5em; }
  .note li::marker { color: var(--grey); }
  .note li.unknown-item, .note p.unknown-item { color: var(--grey); font-style: italic; font-size: var(--s-body); }
  .note strong { font-weight: var(--w-bold); }
  .note code { background: var(--rule); padding: 1px 5px; border-radius: var(--radius); font-size: var(--s-meta); }
  .said { font-family: var(--font); font-style: normal; color: var(--ink); background: var(--paper); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--ink) 25%, transparent); text-underline-offset: .16em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .note blockquote, .session-quote, .session-page .session-quote { margin: 0 0 1em; padding: 10px 18px; border-left: 4px solid var(--ink); color: var(--ink); background: var(--paper); font: var(--s-body)/1.6 var(--font); }
  .note hr { border: 0; border-top: 1px solid var(--rule); margin: 1.8em 0; }
  .note table { border-collapse: collapse; font: var(--s-body)/1.45 var(--font); }
  .note th, .note td { border-bottom: 1px solid var(--rule); padding: 7px 14px 7px 0; text-align: left; vertical-align: top; }
  .note th { font: var(--w-bold) var(--s-meta) var(--font); letter-spacing: 0; text-transform: none; color: var(--grey); }
  .table-scroll { max-width: 100%; overflow-x: auto; margin-bottom: 1.2em; }
  .table-scroll table { margin-bottom: 0; min-width: 100%; }
  .table-scroll th, .table-scroll td { min-width: 120px; }
  .note :is(h2,h3,h4,h5,h6), .note [id^="src-"] { scroll-margin-top: 24px; }

  /* citations name the original before the reader opens it */
  .cite { display: inline-block; position: relative; vertical-align: baseline; max-width: 100%; border: 1px solid var(--rule); padding: 3px 6px; margin: 0 2px; overflow-wrap: anywhere; text-decoration: none !important; font: var(--w-regular) var(--s-meta)/16px var(--font); color: var(--grey); background: var(--rule); border-color: var(--rule); border-radius: var(--radius); }
  /* Grow the tap target without opening a gap in the prose. */
  .cite::before { content: ""; position: absolute; inset: -2px; min-width: 24px; min-height: 24px; }
  .citation-tip { position: fixed; z-index: 30; width: max-content; max-width: calc(100vw - 24px); overflow-wrap: anywhere; padding: 8px 12px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); color: var(--grey); outline: var(--hair) solid var(--rule); font: var(--s-meta)/1.5 var(--font); pointer-events: none; }
  .cite.missing { border-style: dashed; color: var(--grey); }
  .cite:hover, .cite:focus-visible { background: var(--rule); color: var(--ink); border-color: var(--rule); }
  .cite:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* open threads on a page: the visual centre */
  .block-threads { margin: 0 0 8px; }
  .note .threads, .note .timeline, .note .block-sources ol { padding-left: 0; }
  .thread .when:empty { display: none; }
  .blocker-tag { display: inline-block; margin-left: 6px; padding: 1px 5px; border: 1px solid var(--rule); border-radius: var(--radius); color: var(--grey); font: var(--w-regular) var(--s-meta)/1.4 var(--font); }
  .block-threads .threads { margin-bottom: 1em; }
  .calm { display: flex; gap: 10px; align-items: baseline; padding: 11px 16px; border-radius: var(--radius); background: var(--rule); color: var(--grey); font-size: var(--s-body); margin-bottom: 1em; }
  .calm .dir { color: var(--grey); }

  /* history: a dated spine */
  .timeline { list-style: none; margin: 0 0 1.2em; padding: 0; position: relative; }
  .timeline li { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 0; margin: 0; padding: 0 0 12px; position: relative; }
  .timeline li::before { content: ""; position: absolute; left: 101px; top: 9px; width: 7px; height: 7px; border-radius: var(--round); background: var(--paper); outline: var(--hair) solid var(--ink); }
  .timeline li::after { content: ""; position: absolute; left: 104px; top: 20px; bottom: -2px; width: 1px; background: var(--rule); }
  .timeline li:last-child::after { display: none; }
  .timeline .d { font: var(--s-meta)/1.9 var(--font); color: var(--grey); text-align: right; padding-right: 20px; white-space: pre-line; }
  .timeline .e { max-width: 72ch; padding-left: 18px; font-size: var(--s-body); line-height: 1.55; }
  .timeline li.undated .d { visibility: hidden; }
  .timeline li.undated::before { outline: var(--hair) solid var(--rule); }

  /* sources: a compact footnote list */
  .block-sources ol { list-style: none; padding: 0; margin: 0 0 1em; font: var(--s-meta)/1.5 var(--font); color: var(--grey); }
  .block-sources li { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--rule); margin: 0; }
  .block-sources li:target, .block-sources li.flash { background: var(--rule); }
  .dead-link { color: var(--grey); text-decoration: line-through dotted; cursor: help; }
  .block-sources .n { font: var(--w-bold) var(--s-meta)/1.9 var(--font); color: var(--ink); }
  .block-sources .source-open { display: inline-flex; min-width: 44px; min-height: 44px; align-items: center; justify-content: center; justify-self: start; vertical-align: baseline; font: var(--w-regular) var(--s-meta) var(--font); }
  .block-sources .id { font: var(--s-meta) var(--font); color: var(--ink); }

  /* where it stands: a status block */
  .block-standing { border-left: 2px solid var(--ink); padding: 2px 0 2px 18px; margin-bottom: 1.2em; }
  .block-standing ul { list-style: none; padding: 0; }
  .block-standing li + li { margin-top: 0.6em; }

  /* code and diagrams: a plate */
  .code-block { position: relative; margin: 0 0 1.3em; }
  .note pre { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px; overflow-x: auto; font: var(--s-meta)/1.55 var(--font); max-width: 100%; tab-size: 4; margin: 0; color: var(--ink); }
  .code-block.diagram pre { background-color: var(--paper); background-image: radial-gradient(var(--rule) 1px, transparent 1.2px); background-size: 14px 14px; background-position: 7px 7px; padding: 22px 22px 20px; }
  .pan-hint { display: none; font: var(--s-meta) var(--font); color: var(--grey); margin-top: 5px; }
  @media (max-width: 600px) { .code-block.diagram .pan-hint { display: block; } }
  .code-block .cap { position: absolute; left: 12px; top: -8px; font: var(--w-bold) var(--s-meta)/1 var(--font); letter-spacing: 0; text-transform: none; color: var(--grey); background: var(--paper); padding: 3px 6px; border-radius: var(--radius); }
  .note pre code { background: none; padding: 0; font: inherit; white-space: pre; overflow-wrap: normal; }
  .code-copy { position: absolute; top: 8px; right: 8px; font: var(--s-meta) var(--font); color: var(--grey); background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); padding: 2px 8px; opacity: 0; cursor: pointer; }
  .code-block:hover .code-copy, .code-copy:focus-visible { opacity: 1; }

  /* guidance, not error: what is not known yet and the command that fills it */
  .missing:not(.cite), .empty { max-width: 66ch; margin-top: 32px; padding: 16px 0; border-top: 1px solid var(--rule); color: var(--grey); font-size: var(--s-body); line-height: 1.6; position: relative; }
  .empty { margin-top: 10px; }
  .empty > a { display: block; margin-top: 8px; }
  .empty-line { margin: 8px 0 0; color: var(--grey); font: var(--s-body)/1.5 var(--font); }
  .reply-draft { color: var(--ink); font: var(--s-body)/1.5 var(--font); flex: 1 0 100%; min-width: 0; padding: 16px; border: 1px solid var(--rule); border-radius: var(--radius); }
  .reply-draft p { overflow-wrap: anywhere; margin: 8px 0; }
  .reply-draft pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
  .thread-actions .reply-draft button { margin: 8px 8px 0 0; padding: 8px 12px; min-height: 40px; }
  .reply-draft button:first-child { border: 1px solid var(--grey); border-radius: var(--radius); color: var(--ink); background: var(--paper); text-decoration: none; }

  .translation-note { margin: 16px 0; color: var(--grey); font: var(--s-meta)/1.5 var(--font); }
  .missing .lead, .empty .lead { display: block; font: var(--w-bold) var(--s-meta) var(--font); letter-spacing: 0; text-transform: none; color: var(--ink); margin-bottom: 4px; }
  .missing:not(.primary):not(.cite) { padding: 8px 0; background: transparent; font-size: var(--s-meta); }
  .missing:not(.primary) .names { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--grey); }
  .missing.primary { margin: 0 0 24px; border-top: 1px solid var(--rule); background: transparent; padding: 16px 0; }
  .missing.primary .lead { font-size: var(--s-meta); color: var(--grey); }
  .missing.primary .why { margin: 4px 0 8px; font: var(--s-body)/1.5 var(--font); color: var(--ink); }
  .missing.primary .names { color: var(--grey); font-size: var(--s-meta); }
  .btn-primary { min-height: 44px; font: var(--w-bold) var(--s-meta) var(--font); color: var(--paper); background: var(--ink); border: 0; border-radius: var(--radius); padding: 7px 14px; cursor: pointer; }
  .btn-primary:hover { filter: brightness(1.1); }
  .activity-more { min-height: 44px; }
  .missing code, .empty code { font: var(--s-meta) var(--font); color: var(--ink); background: var(--rule); border-radius: var(--radius); padding: 3px 8px; overflow-wrap: anywhere; }
  .aside { max-width: 66ch; margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px 18px; font-size: var(--s-body); }
  .aside .k { font: var(--s-meta) var(--font); letter-spacing: 0; text-transform: none; color: var(--grey); padding-top: 4px; }
  .aside .related a { display: inline-block; margin: 0 14px 6px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: var(--s-meta) var(--font); color: var(--grey); background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); padding: 2px 8px; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
  .chip .d { color: var(--grey); margin-left: 6px; }
  .page-foot { max-width: 66ch; margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .page-foot .when { color: var(--grey); font: var(--s-meta)/1.5 var(--font); }
  .btn-action, .eyebrow-path { font: var(--s-meta) var(--font); color: var(--grey); background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; }
  .eyebrow-path { font: var(--s-meta) var(--font); }
  .btn-action:hover, .eyebrow-path:hover { color: var(--ink); border-color: var(--rule); }
  .btn-action.done { color: var(--ink); border-color: var(--rule); background: var(--rule); }
  details.copies { margin: 0 0 20px; font-size: var(--s-body); }
  details.copies summary { cursor: pointer; color: var(--grey); }
  details.copies p { margin: 6px 0 0 16px; font: var(--s-meta) var(--font); }

  /* search: the best match answers, the rest grouped */
  .best { max-width: 80ch; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 16px 0; margin: 0 0 16px; }
  .best-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 12px; }
  .best-head .lead { font: var(--w-bold) var(--s-meta) var(--font); letter-spacing: 0; text-transform: none; color: var(--ink); }
  .best-head a { font: var(--w-regular) var(--s-head) var(--font); color: var(--ink); }
  .best-facts { display: grid; grid-auto-flow: column; grid-template-rows: auto auto; gap: 3px 22px; margin: 0; justify-content: start; }
  .best-facts dt { font: var(--w-bold) var(--s-meta) var(--font); letter-spacing: 0; text-transform: none; color: var(--grey); }
  .best-facts dd { margin: 0; font: var(--s-meta) var(--font); overflow-wrap: anywhere; }
  .best-facts dd.none { color: var(--grey); font-family: var(--font); }
  .best-open { margin-top: 12px; display: flex; gap: 8px; align-items: baseline; font: var(--s-body) var(--font); }
  .best-open .dir { flex-shrink: 0; color: var(--grey); }
  .search-group { max-width: 80ch; }
  h2.section.group { font-size: var(--s-body); margin: 28px 0 8px; }
  @media (max-width: 820px) { .best-facts { grid-auto-flow: row; grid-template-rows: none; grid-template-columns: 96px minmax(0, 1fr); } }

  /* questions & connections */
  .review { max-width: 72ch; padding: 18px 0; border-bottom: 1px solid var(--rule); }
  .review h2 { font: var(--w-regular) var(--s-body)/1.3 var(--font); margin: 0 0 6px; }
  .review .basis { font-size: var(--s-meta); color: var(--grey); margin: 0 0 8px; }
  .review .subjects a { margin-right: 14px; font-size: var(--s-body); }
  .review .response { font: italic var(--s-body) var(--font); color: var(--grey); margin: 8px 0 0; }
  .review .note { margin-top: 10px; font-size: var(--s-body); }
  .review button { font: var(--s-meta) var(--font); color: var(--grey); background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; margin-bottom: 6px; }
  .review-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 12px; font-size: var(--s-body); }
  .review-acts button { margin: 0; min-height: 36px; padding: 6px 14px; font-size: var(--s-body); color: var(--ink); }
  .review-acts textarea { flex: 1 0 100%; box-sizing: border-box; font: var(--s-body)/1.5 var(--font); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 10px; }
  .review-done { margin: 12px 0 0; font-size: var(--s-body); color: var(--ink); }

  .skip { position: absolute; left: 16px; top: -80px; z-index: 2; background: var(--paper); padding: 10px; }
  .skip:focus { top: 8px; }
  .mobile-back { display: none; margin-bottom: 14px; }
  .mobile-back a { font-size: var(--s-meta); color: var(--grey); }

  /* ---- the sheet: a page per row, facts in columns ---- */
  main.wide { max-width: none; }
  .sheet-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 12px; }
  .sheet-find { flex: 0 1 260px; min-width: 0; padding: 7px 11px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); color: var(--ink); font: var(--s-meta) var(--font); }
  .sheet-find:focus { border-color: var(--ink); outline: var(--rule-heavy) solid var(--ink); }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .seg button { font: var(--s-meta) var(--font); color: var(--grey); background: transparent; border: 1px solid var(--rule); border-radius: var(--radius); padding: 4px 11px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
  .seg button .n { font: var(--s-meta) var(--font); color: var(--grey); }
  .seg button:hover { border-color: var(--rule); color: var(--ink); }
  .seg button.on { background: var(--paper); border-color: var(--grey); color: var(--ink); }
  .seg button.on .n { color: var(--grey); }
  .sheet-count { margin-left: auto; font-size: var(--s-meta); color: var(--grey); }
  .held-note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: -18px 0 20px; color: var(--grey); font-size: var(--s-meta); }
  .held-note button { min-height: 44px; padding: 7px 11px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); color: var(--grey); font: var(--w-bold) var(--s-meta) var(--font); cursor: pointer; }
  .sheet-scroll { overflow: auto; max-height: calc(100vh - 150px); background: transparent; border: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); border-radius: var(--radius); }
  table.sheet { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--s-meta); }
  .sheet th { position: sticky; top: 0; z-index: 2; text-align: left; padding: 0; border-bottom: 1px solid var(--rule); white-space: nowrap; background: var(--paper); }
  .sheet th button { all: unset; box-sizing: border-box; display: flex; gap: 6px; align-items: center; width: 100%; padding: 9px 12px; letter-spacing: 0; text-transform: none; color: var(--grey); cursor: pointer; font: var(--w-bold) var(--s-meta) var(--font); }
  .sheet th button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .sheet th .arrow { color: var(--grey); opacity: 0.6; font-size: var(--s-meta); }
  .sheet th[aria-sort="ascending"] .arrow, .sheet th[aria-sort="descending"] .arrow { color: var(--ink); opacity: 1; }
  .sheet th.num button { justify-content: flex-end; }
  .sheet td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; color: var(--ink); max-width: 260px; min-width: 120px; overflow-wrap: normal; word-break: normal; }
  .sheet td.num { min-width: 0; }
  .sheet .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 200px; }
  .sheet td.wide .clamp { max-width: 360px; }
  .sheet tbody tr { cursor: pointer; }
  .sheet tbody tr:hover td { background: var(--rule); }
  .sheet tbody tr:last-child td { border-bottom: 0; }
  .sheet td.num { text-align: right; white-space: nowrap; }
  .sheet td.mono-col { white-space: nowrap; font-size: var(--s-meta); }
  .sheet td.wide { min-width: 240px; max-width: 380px; color: var(--grey); }
  .sheet .name { position: sticky; left: 0; z-index: 1; min-width: 220px; max-width: 300px; border-right: var(--hair) solid var(--rule); background: var(--paper); }
  .sheet th.name { z-index: 3; background: var(--paper); }
  .name-cell { display: flex; flex-direction: column; gap: 2px; }
  .name-cell .nm { display: flex; align-items: center; gap: 7px; font-weight: var(--w-bold); }
  .name-cell .nm a { color: var(--ink); }
  .mobile-status-label { display: none; }
  .name-cell .sum { font-size: var(--s-meta); color: var(--grey); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sheet .open-col { min-width: 220px; max-width: 320px; }
  .open-cell { display: flex; gap: 7px; align-items: baseline; }
  .open-cell .dir { font-size: var(--s-meta); padding: 0 5px; border-radius: var(--radius); background: var(--paper); }
  .open-cell.theirs .dir { background: transparent; color: var(--grey); }
  .open-cell.plain .dir { background: var(--rule); color: var(--grey); }
  .open-cell .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--grey); }
  .open-cell .more { font: var(--s-meta) var(--font); color: var(--grey); }
  .sheet td.none { text-align: center; color: var(--grey); padding: 28px; cursor: default; }

  .contact-directory { margin: 18px 0 24px; overflow: hidden; border: 0; border-top: 1px solid var(--rule); border-radius: var(--radius); background: transparent; }
  .contact-directory summary { cursor: pointer; padding: 15px 0; font: var(--w-bold) var(--s-body)/1.5 var(--font); color: var(--ink); }
  .contact-directory summary:focus-visible { outline: 2px solid var(--ink); outline-offset: -3px; }
  .contact-directory .directory-body { padding: 0 18px 18px; }
  .contact-directory .directory-note { margin: 0 0 12px; color: var(--grey); font-size: var(--s-meta); line-height: 1.5; }
  .contact-directory .directory-note.warn { color: var(--ink); }
  .contact-directory .directory-find { width: 100%; max-width: 420px; margin: 3px 0 12px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); color: var(--ink); font: inherit; }
  .contact-directory .directory-scroll { overflow-x: auto; }
  .contact-directory table { width: 100%; border-collapse: collapse; font-size: var(--s-meta); }
  .contact-directory th, .contact-directory td { padding: 8px 9px; border-bottom: 1px solid var(--rule); text-align: left; }
  .contact-directory th { color: var(--grey); font: var(--w-bold) var(--s-meta) var(--font); text-transform: none; letter-spacing: 0; }
  .contact-directory td:last-child, .contact-directory th:last-child { text-align: right; }
  .contact-directory .candidate-name { font-weight: var(--w-bold); }
  .contact-directory .candidate-email { color: var(--grey); font: var(--s-meta) var(--font); }
  .contact-directory button { cursor: pointer; }
  .contact-directory td button { min-height: 36px; padding: 7px 10px; border: 1px solid var(--ink); border-radius: var(--radius); background: var(--rule); color: var(--ink); font: var(--w-bold) var(--s-meta) var(--font); white-space: nowrap; }
  .contact-directory td button:hover, .contact-directory td button:focus-visible { background: var(--ink); color: var(--paper); }
  .contact-directory td button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .contact-directory .directory-more { margin-top: 10px; border: 1px solid var(--rule); border-radius: var(--radius); padding: 6px 10px; background: var(--rule); color: var(--ink); }
  .contact-directory .directory-action td { padding: 12px; text-align: left; background: var(--rule); color: var(--grey); font-size: var(--s-meta); }
  .contact-directory .directory-action code { display: block; overflow-wrap: anywhere; white-space: pre-wrap; margin-top: 8px; padding: 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); color: var(--ink); font: var(--s-meta)/1.45 var(--font); text-align: left; }
  .contact-directory .directory-action button { display: block; margin-top: 8px; }
  @media (max-width: 600px) {
    .contact-directory .directory-body { padding: 0 12px 14px; }
    .contact-directory .directory-scroll { overflow-x: visible; }
    .contact-directory table, .contact-directory tbody { display: block; width: 100%; }
    .contact-directory thead { display: none; }
    .contact-directory tbody > tr:not(.directory-action) { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; padding: 12px; margin: 0 0 9px; border: 1px solid var(--rule); border-radius: var(--radius); }
    .contact-directory tbody > tr:not(.directory-action) > td { display: block; padding: 0; border: 0; min-width: 0; }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(1) { grid-column: 1 / -1; font-size: var(--s-body); overflow-wrap: anywhere; }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(2) { grid-column: 1 / -1; overflow-wrap: anywhere; }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(3) { grid-column: 1; color: var(--grey); }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(3)::before { content: "Last · "; }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(4) { grid-column: 2; text-align: right; color: var(--grey); }
    .contact-directory tbody > tr:not(.directory-action) > td:nth-child(4)::after { content: " mail"; }

  /* People at 1440: every column fits (main 1136px); narrower, the sheet scrolls inside itself. */
  @media (min-width: 821px) { main.wide { padding-left: 28px; padding-right: 28px; } }

  /* ---- under the title: what is open, how long, when you last spoke ---- */
  .leadrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 16px 0 0; }

  .lead-open { display: inline-flex; align-items: baseline; gap: 9px; max-width: 100%; color: var(--ink); text-decoration: none !important; background: transparent; border-radius: var(--radius); padding: 8px 0; border-bottom: 1px solid var(--rule); }

  .lead-meta.project-purpose-preview.clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .leadrow .focus-more { flex-basis: 100%; margin: 0; text-align: left; }
  .project-purpose-cites, .skill-finding-cites { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: 100%; font: var(--s-meta) var(--font); color: var(--grey); }
  /* Standalone source controls need a full touch target. */

  /* ---- insight: the lines your inbox could not tell you ---- */

  /* ---- facts: a definition list, empty fields visible (#2068) ---- */
  .panel .fill { margin: -6px 0 10px; font-size: var(--s-meta); color: var(--grey); }

  /* ---- the fact card: what you came for, at a glance (#2068) ---- */
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0; overflow: hidden; margin: 18px 0 26px; max-width: 980px; border: 0; border-top: 1px solid var(--rule); border-radius: var(--radius); background: transparent; }

  /* The memory surface: answer, connections, and activity before the full note. */
  .record-focus { max-width: 1120px; margin: 8px 0 34px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .focus-head { grid-column: 1 / -1; min-width: 0; padding: 16px 0 24px; color: var(--ink); border-bottom: 0; }

  .focus-kicker { display: block; letter-spacing: 0; text-transform: none; font: var(--w-regular) var(--s-meta)/1.4 var(--font); color: var(--grey); }

  .deep-note-limit { max-width: 64ch; margin: 16px 0; font: var(--s-meta)/1.5 var(--font); color: var(--grey); }
  .focus-statement.clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .focus-source { position: relative; z-index: 1; display: inline-flex; align-items: center; min-height: 44px; margin-top: 12px; padding: 0 12px; border: 1px solid var(--rule); color: var(--ink); background: var(--paper); border-radius: var(--radius); font: var(--w-regular) var(--s-meta) var(--font); }

  .focus-next p { margin: 5px 0 0; font: var(--s-body)/1.45 var(--font); }
  .focus-more { position: relative; z-index: 1; display: block; border: 0; background: transparent; color: var(--ink); cursor: pointer; margin: 4px 0 0; padding: 0; min-height: 44px; font: var(--w-bold) var(--s-meta) var(--font); text-decoration: underline; text-underline-offset: 3px; }
  .focus-more[hidden] { display: none; }
  .focus-section.next-exchanges { grid-column: 1 / -1; }
  .project-workspace { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .project-workspace.single { grid-template-columns: 1fr; }

  .focus-section { min-width: 0; border: 0; border-top: 1px solid var(--rule); border-radius: var(--radius); background: transparent; padding: 16px 0; }

  .next-exchanges .thread { padding-inline: 0; }

  .focus-facts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 0; border: 0; border-top: 1px solid var(--rule); border-radius: var(--radius); background: transparent; padding: 16px 0; }
  .focus-fact { min-width: 0; }

  .focus-facts dd { margin: 6px 0 0; font-size: var(--s-meta); color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .contact-strip dd { display: block; }
  .contact-strip .contact-what { display: block; margin-top: 3px; font-size: var(--s-meta); color: var(--grey); }
  .contact-strip .copy { margin-left: 8px; font: var(--s-meta) var(--font); color: var(--grey); background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); padding: 1px 6px; cursor: pointer; vertical-align: 1px; }
  .relation-description { font: var(--s-meta)/1.5 var(--font); color: var(--grey); margin: 0 0 10px; }
  .relation-entry { min-width: 0; display: flex; flex-direction: column; }

  .relation-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 9px; align-items: start; }
  .relation-card { display: flex; flex-direction: column; gap: 5px; min-width: 0; text-decoration: none !important; transition: border-color var(--t-press) var(--ease-out), transform var(--t-press) var(--ease-out); border: 0; border-top: 1px solid var(--rule); border-radius: var(--radius); background: transparent; padding: 16px 0; }

  }
  .more-relations { margin-top: 8px; }
  .more-relations > summary { cursor: pointer; font: var(--w-regular) var(--s-body)/1.5 var(--font); color: var(--grey); display: list-item; padding: 0; box-sizing: border-box; }
  .more-relations .relation-list { margin-top: 10px; }

  @media (max-width: 820px), (pointer: coarse) {

  }
  .conversation-view, .documents { grid-column: 1 / -1; }
  .conversation-list { display: flex; flex-wrap: wrap; gap: 9px; }
  .conversation-open { flex: 1 1 210px; text-align: left; color: var(--ink); cursor: pointer; border: 0; border-top: 1px solid var(--rule); border-radius: var(--radius); background: transparent; padding: 16px 0; }

  .conversation-message p { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: var(--s-body)/1.5 var(--font); }
  .activity-view { grid-column: 1 / -1; }
  .activity-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .activity-note { font: var(--s-meta) var(--font); color: var(--grey); }

  .activity-filters button { font: var(--s-meta) var(--font); padding: 6px 10px; background: var(--paper); color: var(--grey); border: 1px solid var(--rule); border-radius: var(--radius); cursor: pointer; }
