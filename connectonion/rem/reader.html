    if (li.querySelector(".private") && !rest.textContent.trim()) li.classList.add("private-item");
  });

  const headings = [...note.querySelectorAll("h2, h3, h4, h5, h6")];
  const ids = new Set(), toc = [];
  for (const h of headings) {
    const base = h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}_\s-]/gu, "").replace(/\s+/g, "-") || "section";
    let id = base, n = 1;
    while (ids.has(id)) id = base + "-" + n++;
    ids.add(id); h.id = id;
    if (h.tagName === "H2") toc.push({ title: h.textContent.trim(), id });
    h.appendChild(el("a", { class: "heading-anchor", href: "#r=" + encodeURIComponent(r.path) + "&h=" + encodeURIComponent(id), "aria-label": "Direct link to section", text: "#" }));
  }
  for (const block of note.querySelectorAll(".code-block")) {
    const btn = block.querySelector(".code-copy");
    btn.onclick = () => copyToClipboard(block.querySelector("code").textContent, btn, "Copied");
  }

  const panels = sidePanels(r, k);
  if (toc.length >= 4) panels.push(tocPanel([el("ul", { class: "toc" }, toc.map(t =>
    el("li", {}, [el("a", { href: "#r=" + encodeURIComponent(r.path) + "&h=" + encodeURIComponent(t.id), text: t.title })])))]));
  const grid = el("div", { class: "page-grid" + (panels.length ? " has-side" : "") }, [el("div", { class: "body" }, [note]), el("aside", { class: "side", "aria-label": "About this page" }, panels)]);
  const deep = el("section", { class: "deep-note", "aria-labelledby": "full-memory-heading" }, [
    el("div", { class: "deep-head" }, [el("h2", { id: "full-memory-heading", text: "Full memory and sources" }),
      el("span", { class: "deep-hint", text: "Original note · all fields · citations" })]), grid]);
  main.appendChild(deep);
  const column = grid.firstChild;

  if (parts.related || parts.sources) {
    const aside = el("div", { class: "aside" });
    if (parts.related) {
      aside.appendChild(el("div", { class: "k", text: "Related" }));
      const links = [...parts.related.matchAll(/\[([^\]]+)\]\(([^)\s]+)\)/g)];
      const box = el("div", { class: "related" });
      if (links.length) {
        for (const [, lbl, url] of links) {
          const link = safeHref(r.path, url);
          box.appendChild(link ? el("a", { href: link.href, text: lbl }) : el("span", { text: lbl }));
        }
      } else box.innerHTML = inline(parts.related, r.path);
      aside.appendChild(box);
    }
    if (parts.sources) {
      aside.appendChild(el("div", { class: "k", text: "Sources" }));
      const chips = sourceChips(parts.sources);
      aside.appendChild(chips.length ? el("div", { class: "chips" }, chips) : el("div", { text: parts.sources }));
    }
    column.appendChild(aside);
  }

  if (k.missing.length) {
    const command = "co rem --root '" + String(REM.root).replace(/'/g, "'\\''") + "' investigate '" + r.path.replace(/'/g, "'\\''") + "'";
    const mapped = k.status === "Mapped";
    const copyCmd = el("button", { class: mapped ? "btn-primary" : "btn-action", type: "button", text: mapped ? "Copy the command" : "Copy" });
    copyCmd.onclick = () => copyToClipboard(command, copyCmd, "Copied — paste it in a terminal");
    // A page only mapped from your sources gets one clear next step at the top;
    // a written page names its remaining gaps in one quiet line at the foot.
    const box = el("div", { class: "missing" + (mapped ? " primary" : "") }, [
      el("span", { class: "lead", text: mapped ? "Only mapped so far" : k.missing.length + (k.missing.length === 1 ? " unresolved section" : " unresolved sections") }),
      mapped ? el("div", { class: "cmd" }, [el("code", { text: command }), copyCmd]) : null,
      mapped ? el("p", { class: "why", text: r.private_project
        ? "Automatic investigation skips this private project. To request a write, run the command for this page."
        : "co rem has this page from your sources' metadata, not from reading them. One investigation reads the material and fills it in." }) : null,
      el("div", { class: "names", text: (mapped ? "Not investigated yet: " : "Still unknown: ") + youify(k.missing.join(", ")) + "." }),
      mapped ? null : el("div", { class: "cmd" }, [el("code", { text: command }), copyCmd])]);
    if (mapped) deep.parentNode.insertBefore(box, deep); else column.appendChild(box);
  }

  const foot = el("div", { class: "page-foot" });
  const pathBtn = el("button", { class: "eyebrow-path", type: "button", text: r.path, title: "Copy the file path" });
  pathBtn.onclick = () => copyToClipboard(r.path, pathBtn, "Path copied");
  const copyMd = el("button", { class: "btn-action", type: "button", text: "Copy Markdown", title: "Copy the page as written, unknowns included" });
  copyMd.onclick = () => copyToClipboard(r.text, copyMd, "Markdown copied");
  foot.append(pathBtn, copyMd);
  column.appendChild(foot);

  if (heading) {
    const target = document.getElementById(heading) || document.getElementById(heading.toLowerCase()) || headings.find(h => h.id === heading.toLowerCase());
    if (target && target.tagName === "LI") {
      // A citation's source: centred and briefly lit, so the eye finds the line (#2054).
      target.scrollIntoView({ block: "center" });
      target.classList.add("flash");
    } else if (target) target.scrollIntoView();
  }
}

function highlight(line, needle) {
  const lower = line.toLowerCase();
  const out = [];
  let i = 0, at;
  while ((at = lower.indexOf(needle, i)) !== -1) {
    out.push(esc(line.slice(i, at)), "<mark>", esc(line.slice(at, at + needle.length)), "</mark>");
    i = at + needle.length;
  }
  out.push(esc(line.slice(i)));
  return out.join("");
}

function search(q) {
  const main = document.getElementById("main");
  main.textContent = "";
  if (/\b(who\s+(?:do\s+i\s+)?owe|what\s+do\s+i\s+owe|waiting\s+on\s+me|open\s+threads)\b/i.test(q)) { taskView("open"); return; }
  if (/\b(what\s+changed|memory\s+changes|learned\s+(?:last\s+night|overnight))\b/i.test(q)) { taskView("changes"); return; }
  const connected = /\b(?:connected|related)\s+to\s+(.+)/i.exec(q);
  if (connected) {
    const target = listedRecords().find(r => r.title.toLowerCase() === connected[1].trim().toLowerCase());
    if (target) {
      main.appendChild(el("div", { class: "eyebrow", text: "Search / connected context" }));
      main.appendChild(el("h1", { text: "Connected to " + target.title }));
      const card = recordFocus(target).querySelector(".related-records");
      main.appendChild(card || el("div", { class: "empty", text: "No supported links in this snapshot." }));
      return;
    }
  }
  const needle = q.toLowerCase();
  const hits = [];
  const grouped = new Map();
  const plain = l => l.replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/[*`>]/g, "");
  for (const r of REM.records) {
    if (r.path === "skills/catalog/index.md") continue;
    const lines = splitTrailers(r.text).body.replace(COMMENT, "").split("\n").map(plain)
      .filter(l => l.toLowerCase().includes(needle)).slice(0, 3);
    if (lines.length || r.title.toLowerCase().includes(needle)) {
      const primary = r.catalog_parent ? byPath(r.catalog_parent) : r;
      if (!grouped.has(primary.path)) { const hit = { r: primary, lines: [] }; grouped.set(primary.path, hit); hits.push(hit); }
      const hit = grouped.get(primary.path);
      hit.lines.push(...lines);
      hit.lines = [...new Set(hit.lines)].slice(0, 3);
    }
  }
  // Names first: a page whose title matches is what was looked for.
  hits.sort((a, b) => (b.r.title.toLowerCase().includes(needle) ? 1 : 0) - (a.r.title.toLowerCase().includes(needle) ? 1 : 0));
  main.appendChild(el("div", { class: "eyebrow" }, [el("span", { text: "Search" })]));
  main.appendChild(el("h1", { text: "“" + q + "”" }));
  main.appendChild(el("p", { class: "lede", text: hits.length + (hits.length === 1 ? " page matches" : " pages match") + " — literal, case-insensitive" }));
  if (!hits.length) {
    main.appendChild(el("div", { class: "empty" }, [el("span", { class: "lead", text: "No match" }), "No page contains that. Try a related term, a person's first name, or a project name."]));
    return;
  }
  // The best match answers: a person's or organisation's name gets its facts right here.
  const best = hits.find(h => FACT_LABELS[h.r.category] && h.r.title.toLowerCase().includes(needle));
  if (best) main.appendChild(bestMatch(best.r));
  // Grouped by kind, people first; one snippet a page, never a local path.
  const ORDER = ["people", "orgs", "projects", "skills"];
  const rank = c => ORDER.includes(c) ? ORDER.indexOf(c) : ORDER.length;
  const groups = new Map();
  for (const hit of hits.sort((a, b) => rank(a.r.category) - rank(b.r.category))) {
    if (!groups.has(hit.r.category)) groups.set(hit.r.category, []);
    groups.get(hit.r.category).push(hit);
  }
  const isPath = l => /^(?:\/|~\/|[A-Z]:\\)\S+/.test(l) || /^(?:File|Path):\s*[/~]/.test(l);
  for (const [c, list] of groups) {
    main.appendChild(el("h2", { class: "section group" }, [el("span", { text: label(c) }), el("span", { class: "n", text: String(list.length) })]));
    const ul = el("ul", { class: "hits" });
    for (const { r, lines } of list) {
      const li = el("li", {}, [
        el("div", { class: "t" }, [el("span", {}, [el("a", { href: href(r), html: highlight(r.title, needle) }), statusPill(r)]),
          el("span", { class: "when", text: shortDate(known(r).last) })])]);
      const line = lines.map(l => l.trim().replace(/^#+\s*/, "").replace(/^[-+]\s+/, "")).find(l => !isPath(l));
      if (line) li.appendChild(el("div", { class: "hit", html: highlight(line.replace(/\s*\[W?\d{1,3}\]/g, ""), needle) }));
      ul.appendChild(li);
    }
    main.appendChild(ul);
  }
}
function bestMatch(r) {
  const f = facts(r), k = known(r), parsed = parseFacts(r);
  const first = l => ((parsed.get(l) || [])[0] || {}).value || "";
  const cells = r.category === "people"
    ? [["Email", plainValue(first("Email") || f.email)], ["Phone", plainValue(first("Phone"))], ["Company", plainValue(first("Company") || f.company)], [mappedContact(r) ? "Last contact in map" : "Last contact", k.last ? fmtDate(k.last) : ""]]
    : r.category === "orgs"
      ? [["What they do", plainValue(first("What they do") || f.what)], ["Website", plainValue(first("Website") || f.domain)], ["Last contact", k.last ? fmtDate(k.last) : ""]]
      : [[first("Repository") ? "Repository" : "Local path", plainValue(first("Repository") || f.repo)], ["Status", plainValue(first("Status"))], ["Last activity", k.last ? fmtDate(k.last) : ""]];
  const open = f.open[0];
  return el("section", { class: "best" }, [
    el("div", { class: "best-head" }, [el("span", { class: "lead", text: "Best match" }), el("a", { href: href(r), text: r.title }), statusPill(r)]),
    el("dl", { class: "best-facts" }, cells.flatMap(([name, v]) => [el("dt", { text: name }), el("dd", { class: v ? "" : "none", text: v || "— not found" })])),
    open ? el("div", { class: "best-open" }, [el("span", { class: "dir", text: DIRECTION_LABEL[open.dir] }), el("span", { text: plainLine(open.text) })]) : null]);
}

function reviewPage() {
  const main = document.getElementById("main");
  main.textContent = "";
  main.appendChild(el("div", { class: "eyebrow" }, [el("a", { href: "#", text: "Contents" }), el("span", { class: "sep", text: "/" }), el("span", { text: "Review" })]));
  main.appendChild(el("h1", { text: "Questions & connections" }));
  main.appendChild(el("p", { class: "lede", text: "Evidence-linked suggestions, not established facts. This snapshot is read-only; use the terminal command to record your decision, then run co rem open again." }));
  const quote = value => "'" + String(value).replace(/'/g, "'\\''") + "'";
  for (const row of REM.reviews || []) {
    const box = el("section", { class: "review" });
    box.appendChild(el("div", { class: "eyebrow" }, [el("span", { class: "pill" + (row.status === "pending" ? " warn" : " quiet"), text: row.status }), el("span", { text: row.kind || "" })]));
    box.appendChild(el("h2", { text: row.question }));
    box.appendChild(el("p", { class: "basis", text: row.status + " · " + row.basis }));
    box.appendChild(el("p", { class: "subjects" }, row.subjects.map(path => el("a", { href: "#r=" + encodeURIComponent(path), text: byPath(path)?.title || path }))));
    if (row.response) box.appendChild(el("p", { class: "response", text: row.author + ": " + row.response }));
    if (row.status === "pending") {
      const command = "co rem --root " + quote(REM.root) + " review " + quote(row.id);
      for (const verdict of row.kind === "link" ? ["yes", "no"] : ["answer"]) {
        const text = command + " --verdict " + verdict + " --author 'your name' --response 'your reason or answer'";
        const button = el("button", { type: "button", text: "Copy " + verdict + " command" });
        button.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(text); button.textContent = "Copied — edit your name and response"; }
          catch (_) { button.textContent = "Select and copy the command below"; }
        });
        box.appendChild(el("div", { class: "note" }, [button, el("div", { class: "code-block" }, [el("pre", {}, [el("code", { text })])])]));
      }
    }
    main.appendChild(box);
  }
  if (!(REM.reviews || []).length) main.appendChild(el("div", { class: "empty" }, [el("span", { class: "lead", text: "Nothing to review" }), "No review candidates yet. No new connection is better than an invented one."]));
}

function render() {
  if (!REM) return;
  const { record: r, category: c, query, heading, view, reviews } = route();
  renderRail(railActive());
  const box = document.getElementById("q");
  if (box.value !== (query || "")) box.value = query || "";
  window.scrollTo(0, 0);
  // The sheet views use the full width; reading views keep a measure.
  document.getElementById("main").classList.toggle("wide", !!(c && !r && !query && !reviews && COLUMNS[c] && inCategory(c).length));
  if (reviews) reviewPage();
  else if (query) search(query);
  else if (r) record(r, heading);
  else if (view === "open" || view === "changes") taskView(view);
  else if (c) category(c);
  else overview();
  document.title = (reviews ? "Questions & connections" : r ? (byPath(r)?.title || "Missing page") : query ? "Search: " + query :
    view === "open" ? "Open threads" : view === "changes" ? "Memory changes" : c ? (c === "all" ? "Explore" : label(c)) : "Today") + " · co rem";
  for (const link of document.querySelectorAll("#nav a.active")) link.setAttribute("aria-current", "page");
  refreshFocusExpansion();
}

function openEvidence(r, number, trigger) {
  const source = sourceList(r).find(item => item.n.toLowerCase() === number.toLowerCase());
  if (!source) return false;
  const id = sourceId(source.text);
  const context = (REM.source_context || {})[id];
  const mail = /^(gmail|outlook)$/.test(context?.source || "");
  const headers = context?.participants;
  const headerText = value => Array.isArray(value) ? value.join(", ") : value || "Not recorded";
  const revision = /:([0-9a-f]{40}):(.+)$/.exec(context?.origin || "");
  const origin = revision ? revision[2] + " @ " + revision[1].slice(0, 8)
    : context?.origin ? context.origin.split("/").at(-1).replace(/.*:checkout-state$/, "Checkout state") : "";
  let dialog = document.getElementById("evidence-dialog");
  if (!dialog) { dialog = el("dialog", { id: "evidence-dialog", class: "evidence-dialog", "aria-label": "Source context" }); document.body.appendChild(dialog); }
  dialog.textContent = "";
  const close = el("button", { type: "button", class: "evidence-close", text: "Close ×", "aria-label": "Close source context" });
  close.onclick = () => dialog.close();
  dialog.append(el("div", { class: "evidence-top" }, [el("span", { class: "focus-kicker", text: "co rem / source " + number }), close]),
    el("h2", { text: "Why this appears on " + r.title }),
    el("p", { class: "evidence-summary private", text: source.text }));
  dialog.appendChild(el("p", { class: "private-hidden-notice", text: "Source descriptions and original excerpts are hidden because their private content has not been classified. Use Show labelled passages in the menu to read them." }));
  if (context) dialog.append(el("div", { class: "evidence-original private" }, [
    el("span", { class: "focus-kicker", text: (/^skill-(source|reference)$/.test(context.source) ? "Instruction excerpt" : context.source === "project-source" ? "Repository snapshot" : mail ? context.body_empty ? "Mail headers" : "Mail body excerpt" : "Original source context") + " · not a validated claim span" }),
    ...(origin ? [el("p", { class: "evidence-meta", text: origin })] : []),
    el("p", { class: "evidence-meta", text: [context.source, context.sender,
      context.time ? (mail ? "Sent " : "") + fmtTime(context.time) : "",
      context.captured_at ? (mail ? "Retrieved " : "Captured ") + fmtTime(context.captured_at) : "",
      context.retained_at && !context.captured_at ? "Archived " + fmtTime(context.retained_at) : ""].filter(Boolean).join(" · ") }),
    ...(mail && headers ? [el("details", { class: "evidence-participants" }, [
      el("summary", { text: "From, To and Cc" }),
      ...["from", "to", "cc"].map(key => el("p", { class: "evidence-meta", text: ({from: "From", to: "To", cc: "Cc"}[key]) + ": " + headerText(headers[key]) }))])] : []),
    ...(context.body_format ? [el("p", { class: "evidence-meta", text: context.body_format })] : []),
    ...(mail && context.subject ? [el("p", { class: "evidence-meta evidence-subject", text: "Subject: " + context.subject })] : []),
    ...(context.input_scope ? [el("p", { class: "evidence-input-scope", text: inputScopeText(context.input_scope) })] : []),
    context.body_empty ? el("p", { class: "evidence-empty-body", text: "The retained message has no body text. Its headers are available." })
      : el("blockquote", { text: context.excerpt + (context.truncated ? "…" : "") })]));
  else dialog.appendChild(el("p", { class: "evidence-unavailable", text: "The original source is not archived in this snapshot. The citation above identifies a source; it does not show its original text." }));
  dialog.addEventListener("close", () => trigger.focus(), { once: true });
  if (dialog.showModal) dialog.showModal(); else dialog.setAttribute("open", "");
  close.focus();
  return true;
}
document.addEventListener("click", e => {
  const citation = e.target.closest("a.cite");
  if (!citation) return;
  const url = new URL(citation.href);
  const params = new URLSearchParams(url.hash.slice(1));
  const path = params.get("r"), number = (params.get("h") || "").replace(/^src-/, "");
  const r = byPath(path);
  if (r && openEvidence(r, number, citation)) e.preventDefault();
});

const qInput = document.getElementById("q");
const qClear = document.getElementById("q-clear");
qInput.addEventListener("input", e => {
  const q = e.target.value.trim();
  location.hash = q ? "q=" + encodeURIComponent(q) : "";
});
qClear.addEventListener("click", () => { qInput.value = ""; location.hash = ""; qInput.focus(); });

const rail = document.querySelector(".rail");
const toggle = document.querySelector(".nav-toggle");
function closeNav() { rail.dataset.open = "false"; toggle.setAttribute("aria-expanded", "false"); }
toggle.addEventListener("click", () => {
  const open = toggle.getAttribute("aria-expanded") !== "true";
  rail.dataset.open = String(open); toggle.setAttribute("aria-expanded", String(open));
});
document.querySelector(".skip").addEventListener("click", e => { e.preventDefault(); document.getElementById("main").focus(); });
document.getElementById("nav").addEventListener("click", e => {
  if (e.target.closest("a")) { closeNav(); document.getElementById("main").focus(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (document.activeElement === qInput) {
      if (qInput.value) { qInput.value = ""; location.hash = ""; } else qInput.blur();
      return;
    }
    closeNav();
    if (document.activeElement.closest("#nav")) toggle.focus();
  }
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    e.preventDefault(); qInput.focus();
  }
});
window.addEventListener("hashchange", render);
window.addEventListener("resize", refreshFocusExpansion);
render();
</script>
</body>
