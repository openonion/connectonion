version: v1.9.6rc2
images:
- file: rem-today-desktop.png
  alt: 'Today on a desktop: an icon rail on the left, a search pill on top, a night chart with three dips and the faces of Mara and Inès on its two rises, the number 4 with four faces of which two carry red rings marked 5 d and 2 d, and one raised card with the reply to Inès Halvorsen whose Send button is green'
  caption: Today is a desk. The night chart shows what REM did, the faces show who is waiting and for how long, and one reply is raised with Send as the only green on the page.
  scenario: Open Today in the fictional notebook a week after its last mail, with Inès five days overdue and Mara two, a reply REM prepared for each, and the question on the card to Inès answered.
  viewport: 1440x1000, light, en-US
  commit: 1d07bd9daa3ccb05119ec91568fad025a19a5af1
  source_run: 'local: a throw-away pytest file (not committed) that reuses the today fixture and the OVERDUE scene of tests/e2e/cli/test_rem_today_fuse_browser.py on the notebook built by tests/fixtures/rem_reader_notebook.py, moves the fixture run logs a week forward with the clock, adds one prepared reply each for Inès and Mara, and clicks the first answer; run with CO_REM_BROWSER_TEST=1 CO_REM_SHOTS=<dir> pytest'
- file: rem-today-phone.png
  alt: 'Today on a phone: the night chart folded under its title, the number 4 with four faces, the card for Inès Halvorsen with the first two lines of the letter and the answered question, a green Send bar, and a floating tab bar with Today, Waiting, People, Search and More; a strip of the page below shows between the two bars'
  caption: On a phone the chart folds away, the reply card fills the screen, and Send sits just above the floating tab bar.
  scenario: The same notebook, day and answered question as the desktop picture, at phone width.
  viewport: 390x844, light, en-US
  commit: 1d07bd9daa3ccb05119ec91568fad025a19a5af1
  source_run: 'local: the same throw-away pytest file as rem-today-desktop.png, at 390x844'
