  alt: "co whatsapp check against a live listener, printing configured and then
    connected as an account since a timestamp; then the same command against an
    inbox holding a stale connected record, printing not connected because no
    listener is running."
  caption: "check says two different things now — that the machine is configured,
    and separately whether a socket is up — and a leftover record does not become
    a green tick."
  scenario: "The first block is live against pid 35771 on the real linked number.
    The second is the case that matters for trusting the new line: the inbox holds
    a connection record saying connected, written by a process that is gone. It
    reports not connected rather than believing the file, because the record is
    only read while the pid that wrote it is the pid holding the lock. Before this
    release the same command printed a green tick reading reachable from four
    facts, none of which is the network."
