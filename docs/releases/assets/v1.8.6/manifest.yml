images:
- file: whatsapp-is-an-inbox-with-an-undo.png
  alt: "co whatsapp --help listing twelve verbs — listen, receive, send, reply,
    edit, delete, done, check, ls, chats, log, consume; then co whatsapp check
    reporting the inbox configured with a listener pid and, on a separate line,
    connected as a phone number since a timestamp."
  caption: "Twelve verbs on a number a person already uses — and `check` says
    configured and connected as two separate claims, because they are two."
  scenario: "The first block is the command surface this release settles on.
    `edit` and `delete` are the new ones: they are what makes a wrong answer in
    front of a customer recoverable, which is the difference between a bot you
    can put in a real group and one you cannot. The second block is the
    diagnostic reading the listener's own connection record on the owner's live
    account — `configured` is a claim about this machine, `connected as … since
    …` is a claim about a socket, and before 1.8.6a7 a single line said
    'reachable' for both from four facts that included no network at all."
