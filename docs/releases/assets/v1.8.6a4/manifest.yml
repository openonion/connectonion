- file: a-listener-that-stopped-says-why.png
  alt: An inbox log showing a listener stopping after being logged out by the phone,
    and the refusal it prints with exit 3.
  caption: A listener that can never receive again stops and says so, instead of
    holding a socket and printing nothing.
  # Quoted, because a bare ` #` starts a YAML comment and silently truncates the
  # value — which is how the last two manifests failed to parse.
  scenario: "What issue 1581 reported from production, after the fix. We were handling
    three of neonize's thirty-seven events; LoggedOutEv was arriving and being
    discarded, so the process kept running and 'nobody has messaged us' was
    indistinguishable from 'we were logged out yesterday'."
  viewport: 1040x~260 terminal capture, 2x
  commit: 6c7147bd
  source_run: https://github.com/openonion/connectonion/issues/1581
