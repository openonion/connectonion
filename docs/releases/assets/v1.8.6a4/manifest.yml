  alt: A received WhatsApp record carrying sender_name, a quoted block with from_me
    true, and a context array holding two earlier turns including the bot's own reply.
  caption: The bot knows who is talking and what they mean — a name instead of an id,
    the message being answered, and the conversation around it.
