[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connectonion"
version = "1.8.8b8"
description = "Connect your AI agent to Gmail, a real browser and your files, one command each. The agent CLI harness."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    { name = "ConnectOnion Team", email = "pypi@connectonion.com" }
]
keywords = [
    "ai",
    "agent",
    "llm",
    "tools",
    "openai",
    "automation",
    "debugging",
    "interactive-debugging",
    "breakpoints",
    "xray",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    # Upper bounds only where the next major is known to break us, not by habit.
    # pydantic 3 is the announced end of the v2 API our models are written in;
    # openai and anthropic already cap it at <3, so this costs nothing today and
    # keeps an old connectonion from resolving against it tomorrow.
    "pydantic>=2.0.0,<3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "rich>=13.0.0",
    "PyNaCl>=1.6.2",
    "qrcode>=8.2",
    "mnemonic>=0.20",
    "questionary>=2.0.0",
    "websockets>=11.0.0",
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    # httpx 1.0 (on PyPI as 1.0.dev6 since before 1.8.8) removes HTTPError,
    # AsyncClient and Timeout, which connect(), hosted agents and co outlook use.
    # Testers who installed 1.8.8b7 with `--pre` got it and everything remote
    # crashed. Without this cap, stable would break the day 1.0 goes final.
    "httpx>=0.24.0,<1",
    "ifaddr>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.0",
    "typer>=0.20.0",
    "bashlex>=0.18",
    "uvicorn>=0.20.0",
    "textual>=0.86.0",
    "textual-autocomplete>=3.0.0",
    # Pinned exact: Patchright ships its stealth patches inside a separately-downloaded
    # driver, and that driver has silently regressed to the unpatched vanilla Playwright
    # build across releases (1.57.x, 1.61.1 → navigator.webdriver leaks / automation infobar).
    # 1.61.2 is verified-good. When bumping, re-verify stealth with `co doctor`: the driver's
    # chromiumSwitches must drop `--enable-automation` and add
    # `--disable-blink-features=AutomationControlled`, and navigator.webdriver must be false.
    "patchright==1.61.2",
    "charset-normalizer>=3.0.0",
    "pypdf>=4.0.0",
    "python-pptx>=1.0.0",
    "python-docx>=1.1.0",
    "packaging>=23.0",
    # uv.lock protects this repository, but it is not installed with the library.
    # Publish the audited transitive floors too, so an existing user environment
    # cannot satisfy ConnectOnion with versions that retain known vulnerabilities.
    "click>=8.3.3",
    "httplib2>=0.32.0",
    "idna>=3.15",
    "protobuf>=6.33.5",
    "pyasn1>=0.6.4",
    "Pygments>=2.20.0",
    "soupsieve>=2.8.4",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
# The paid browser's driver. An extra rather than a dependency: most people run
# the free engine, and installing a commercial client for all of them to serve
# the few would be the wrong default. `co browser --engine wtf` installs it on
# demand too, so this is for anyone who would rather pin it in their own
# requirements than have a command reach for pip.
wtf = [
    "onionwright>=0.0.14",
]
synology = [
    "keyring>=25,<26",
    "pysnmp>=7.1,<8",
    "paramiko>=4,<5",
]
# WhatsApp as an inbox. An extra because the cost is not shared: neonize is a
# 21MB compiled Go library (whatsmeow) plus pillow, python-magic and four more
# packages, and python-magic needs libmagic from the system. Nobody who only
# uses Feishu should pay for that. Pinned exactly rather than `>=`: the wheel
# carries a snapshot of whatsmeow's WhatsApp protocol implementation, so a
# version bump is a protocol change and deserves to be a deliberate one.
whatsapp = [
    "neonize==0.4.3.post0",
]
# Spreadsheet attachments in the Personal Wiki. An extra because nothing else
# reads XLSX, and every install was carrying it (with et-xmlfile) for the few
# who investigate mail with spreadsheets attached. Without it an XLSX
# attachment is named, not read, and the note says how to install this.
wiki = [
    "openpyxl>=3.1.0",
]
dev = [
    # The wiki extra, so the spreadsheet tests run rather than skip.
    "openpyxl>=3.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    # pytest.ini has wanted `timeout = 300` since before this was installable.
    # Without it a hung test is indistinguishable from a slow one: no output,
    # no failure, nothing to grep. One cost 25 minutes before anyone looked.
    "pytest-timeout>=2.3.0",
    # `pytest -n auto` runs the offline suite in under a minute instead of four.
    "pytest-xdist>=3.6.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/openonion/connectonion"
Documentation = "https://docs.connectonion.com"
Repository = "https://github.com/openonion/connectonion"
"Bug Tracker" = "https://github.com/openonion/connectonion/issues"

[project.scripts]
co = "connectonion.cli.main:cli"
connectonion = "connectonion.cli.main:cli"

[tool.hatch.build.targets.wheel]
# Ship the repo-root docs/ inside the package as connectonion/docs/, which is
# where get_docs_source() looks and what `co init` copies into .co/docs/.
#
# This used to be `packages = ["connectonion"]` plus a force-include of "docs".
# force-include runs after exclusion rules, so nothing could be kept out of it:
# 1.8.8b7 shipped docs/testing/ (91 files of test runs, ~245 absolute paths from
# the maintainer's machine) inside the wheel and into every new project's
# .co/docs/. `only-include` + `sources` puts the same files at the same place
# while letting `exclude` apply. The whole docs/ directory is still mapped, so a
# docs folder added later ships without anyone remembering to list it.
only-include = ["connectonion", "docs"]
sources = { "docs" = "connectonion/docs" }
# Internal-only trees: test runs and release evidence, written on a maintainer's
# machine and full of its paths and screenshots (releases/assets alone was 5 MB
# of the 9 MB wheel). design-decisions/ keeps shipping on purpose: it explains
# why, which is what an agent reading .co/docs/ needs. Keep this list equal to
# docs/.package-ignore, which copy_docs() reads for editable installs;
# tests/unit/test_the_wheel_ships_only_public_docs.py holds them together.
exclude = [
    "docs/archive",
    "docs/testing",
    "docs/acceptance",
    "docs/releases/assets",
]

[tool.hatch.build.targets.sdist]
include = [
    "connectonion/**",
    "docs/**",
    "README.md",
    "LICENSE",
]
# The sdist is on PyPI too; the same internal trees stay out of it.
exclude = [
    "docs/archive",
    "docs/testing",
    "docs/acceptance",
    "docs/releases/assets",
]

# Include all non-Python files (md, txt, etc.) in the package
[tool.hatch.build]
include = [
    "connectonion/**/*.md",
    "connectonion/**/*.html",
    "connectonion/**/*.txt",
    "connectonion/**/*.yaml",
    "connectonion/**/*.proto",
    "connectonion/**/*.example",
    "connectonion/**/*.html",
    "connectonion/**/*.js",
    "connectonion/cli/templates/**/Dockerfile",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
