[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connectonion"
version = "1.7.0rc11"
description = "A simple Python framework for creating AI agents with behavior tracking"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    { name = "ConnectOnion Team", email = "pypi@connectonion.com" }
]
keywords = [
    "ai",
    "agent",
    "llm",
    "tools",
    "openai",
    "automation",
    "debugging",
    "interactive-debugging",
    "breakpoints",
    "xray",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "rich>=13.0.0",
    "PyNaCl>=1.6.2",
    "mnemonic>=0.20",
    "questionary>=2.0.0",
    "websockets>=11.0.0",
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    "httpx>=0.24.0",
    "ifaddr>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.0",
    "typer>=0.20.0",
    "bashlex>=0.18",
    "uvicorn>=0.20.0",
    "textual>=0.86.0",
    "textual-autocomplete>=3.0.0",
    # Pinned exact: Patchright ships its stealth patches inside a separately-downloaded
    # driver, and that driver has silently regressed to the unpatched vanilla Playwright
    # build across releases (1.57.x, 1.61.1 → navigator.webdriver leaks / automation infobar).
    # 1.61.2 is verified-good. When bumping, re-verify stealth with `co doctor`: the driver's
    # chromiumSwitches must drop `--enable-automation` and add
    # `--disable-blink-features=AutomationControlled`, and navigator.webdriver must be false.
    "patchright==1.61.2",
    "charset-normalizer>=3.0.0",
    "pypdf>=4.0.0",
    "python-pptx>=1.0.0",
    "python-docx>=1.1.0",
    "packaging>=23.0",
    # uv.lock protects this repository, but it is not installed with the library.
    # Publish the audited transitive floors too, so an existing user environment
    # cannot satisfy ConnectOnion with versions that retain known vulnerabilities.
    "click>=8.3.3",
    "httplib2>=0.32.0",
    "idna>=3.15",
    "protobuf>=6.33.5",
    "pyasn1>=0.6.4",
    "Pygments>=2.20.0",
    "soupsieve>=2.8.4",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    # pytest.ini has wanted `timeout = 300` since before this was installable.
    # Without it a hung test is indistinguishable from a slow one: no output,
    # no failure, nothing to grep. One cost 25 minutes before anyone looked.
    "pytest-timeout>=2.3.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/openonion/connectonion"
Documentation = "https://docs.connectonion.com"
Repository = "https://github.com/openonion/connectonion"
"Bug Tracker" = "https://github.com/openonion/connectonion/issues"

[project.scripts]
co = "connectonion.cli.main:cli"
connectonion = "connectonion.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["connectonion"]
exclude = [
    "connectonion/docs/archive/**",
]

# Ship the repo-root docs/ inside the package as connectonion/docs/.
#
# It was never shipped before: `packages = ["connectonion"]` only picks up what
# lives under connectonion/, and docs/ is at the root — so every wheel went out
# without it while `co init` still reported ".co/docs/ (full documentation)" over
# an empty folder. get_docs_source() already expects connectonion/docs/ to exist
# ("via force-include", says its comment); this is that force-include, finally
# written.
#
# The whole directory is mapped rather than a list of subpaths on purpose: an
# explicit list would silently omit any docs folder added later, which is the same
# class of bug this line fixes.
#
# Caveat, measured: force-include runs after exclusion rules, so the `exclude`
# above does NOT reach these files. docs/archive/ stays out only because it is in
# .gitignore (hatch honours VCS ignores); docs/design-decisions/ (26 files,
# 0.28 MB) does ship despite docs/.package-ignore asking otherwise. Accepted —
# copy_docs() keeps archive out of the user's .co/docs/, and design notes are
# harmless to ship. To actually exclude it, .gitignore is the lever that works.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "connectonion/docs"

[tool.hatch.build.targets.sdist]
include = [
    "connectonion/**",
    "docs/**",
    "README.md",
    "LICENSE",
]

# Include all non-Python files (md, txt, etc.) in the package
[tool.hatch.build]
include = [
    "connectonion/**/*.md",
    "connectonion/**/*.txt",
    "connectonion/**/*.yaml",
    "connectonion/**/*.example",
    "connectonion/cli/templates/**/Dockerfile",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (multi-component)",
    "real_api: Tests requiring real API keys",
    "slow: Tests that take >10 seconds",
    "network: Tests requiring network/relay",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-m 'not real_api and not slow'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
