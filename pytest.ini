[pytest]
# Pytest configuration for ConnectOnion

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: pin the default fixture loop scope explicitly. Silences the
# "asyncio_default_fixture_loop_scope is unset" PytestDeprecationWarning; 'function'
# keeps the historical default (a fresh event loop per test), so behavior is unchanged.
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    unit: Unit tests - fast, isolated tests with mocks
    e2e: End-to-end tests of complete workflows
    e2e_online: End-to-end tests that call real APIs
    deploy: Deploy tests that require DEPLOY_API_URL
    slow: Slow tests that take more than 10 seconds
    real_api: Opt-in tests that call a real provider or remote API
    provider_cli: Real provider CLI tests that use the CLI's own authentication
    network: Tests that require network/relay server connection
    cli: CLI-specific tests
    asyncio: Async tests using pytest-asyncio
    benchmark: Performance/benchmark tests
    real_refresh: Outlook token-refresh flow tests (bypass the refresh stub)

# Output options. `-ra` lists every non-pass outcome in the summary; the old
# `-rs` listed only skips, so a `-q` run ended with no record of what failed.
addopts =
    -ra
    --tb=short
    --strict-markers
    --strict-config
    --durations=10
    -m "not real_api and not network"

# An xfail that passes is a fixed bug nobody noticed, or a test that no
# longer tests what it claims. Either way it should surface.
xfail_strict = true

# Warnings are left visible. DeprecationWarning used to be ignored wholesale,
# which meant the summary's warning count said nothing about upgrade debt;
# with the ignore removed the full run surfaced none from our code or our
# dependencies, so there was nothing to hide. ResourceWarning stays on too:
# an unclosed file or socket in the summary is a leak with a file and line.
# Silence a specific third-party warning here, by message, with the owner
# and the condition for removing the line — never a whole category.
filterwarnings =
    # google-api-core warns about Python 3.10 reaching end of life on
    # 2026-10-04. Remove when 3.10 leaves the CI matrix (planned for 1.9.0).
    ignore:You are using a Python version .* which Google will stop supporting:FutureWarning

# Minimum version
minversion = 6.0

# No single test may hang the suite. The slowest test in the whole run takes
# five seconds, so 60 only ever fires on something that has genuinely stopped,
# and it fires with a thread dump naming the test instead of silence. It used
# to be 300, which was five minutes of a red run before anyone learned which
# test it was. A test that legitimately needs longer marks itself:
# @pytest.mark.timeout(N).
timeout = 60

# Parallel runs: `make test` (or `pytest -n auto`) spreads files across all
# cores — the full offline suite drops from ~4 minutes to under a minute.
# Not in addopts so that a single-file run stays a plain in-process run where
# -s, breakpoints and tracebacks behave.
